<style>
  :root{
    --paper:#F5F5F6;
    --ink:#1E1F22;
    --ink-soft:#6B6D72;
    --line: rgba(30,31,34,0.12);
    --celadon-4:#4F7563;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    padding:24px;
  }
  .wrap{max-width:420px; text-align:center;}
  .code{font-size:13px; font-weight:600; letter-spacing:2px; color:var(--celadon-4); margin-bottom:10px;}
  h1{font-size:22px; margin:0 0 10px;}
  p{font-size:14.5px; line-height:1.5; color:var(--ink-soft); margin:0 0 22px;}
  .links{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  a.btn{
    display:inline-block; font-size:13.5px; font-weight:600; text-decoration:none;
    padding:9px 16px; border-radius:8px; border:1px solid var(--line); color:var(--ink);
  }
  a.btn:hover{background:rgba(30,31,34,0.05);}
  a.btn.primary{background:var(--celadon-4); border-color:var(--celadon-4); color:#fff;}
  a.btn.primary:hover{filter:brightness(1.08);}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>That page doesn't exist, or the link is out of date.</p>
  <div class="links">
    <a class="btn primary" href="/">Go home</a>
    <a class="btn" href="/resume/">View resume ↗</a>
  </div>
</div>
</body>
