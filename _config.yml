# This repo is BOTH the source repo and the web root: GitHub Pages serves it
# from the root of main, so anything committed here is also a public URL on
# kristoffergt.com. That is right for the app itself and wrong for everything
# around it. Before this file existed, kristoffergt.com/CLAUDE.md returned the
# whole 444 KB development log, and every RLS policy in "sql migrations" was a
# 200 as well.
#
# So the two questions are separated. Version control keeps all of it, because
# the migrations, the edge functions and the log are the project's own history.
# Pages publishes only what a browser has to fetch to run the app.
#
# Nothing listed here is referenced by index.html, so excluding it cannot break
# the site. Dotfiles (.claude, .gitignore) are already left out by Jekyll's own
# default, which is why kristoffergt.com/.claude/launch.json is a 404 today.
exclude:
  # The development log. Useful beside the code, not on the open web.
  - CLAUDE.md
  # Schema, row level security policies and admin functions. None of this is a
  # credential (the PIN and the service key live in Postgres and in a gitignored
  # .env), but it is a map of the database and there is no reason to hand it out.
  - "sql migrations"
  # Local automation that runs on the Mac, not in the browser.
  - scripts
  # Deno edge functions and the email templates. Deployed to Supabase, never
  # fetched from here.
  - supabase
  # Source artwork that nothing references. See the note in CLAUDE.md.
  - logos
  # Jekyll's own defaults, repeated because setting "exclude" replaces them
  # rather than adding to them. None of these is committed, so this is a guard
  # rather than a fix.
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
