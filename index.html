<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productivity Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F7563">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Productivity Tracker">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap');
:root{
  color-scheme: light;
  --paper:#F5F5F6;
  --paper-dim:#EAEAEC;
  --ink:#1E1F22;
  --ink-soft:#6B6D72;
  --celadon-1:#DCE7DA;
  --celadon-2:#AFC9AE;
  --celadon-3:#7FA694;
  --celadon-4:#4F7563;
  --seal:#B33B34;
  --seal-dark:#8C2C27;
  --line: rgba(30,31,34,0.12);
  --ink-hover:#000000;
  --c-listening:#6E8FB0;
  --c-speaking:#B37B4F;
  --c-reading:#7FA694;
  --c-writing:#9C7BB0;
  --c-grammar:#B0A46E;
  --c-vocabulary:#5C9E8C;
  --c-topik:#B33B34;
  --c-other:#8B8578;
}
body.dark{
  color-scheme: dark;
  --paper:#18191B;
  --paper-dim:#232427;
  --ink:#EDEDEF;
  --ink-soft:#9A9CA1;
  --celadon-1:#2E3A34;
  --celadon-2:#3C4F45;
  --line: rgba(237,237,239,0.14);
  --ink-hover:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Inter','Noto Sans KR',sans-serif;padding:32px 20px 60px;min-height:100vh;transition:background 0.2s,color 0.2s;}
.wrap{max-width:780px;margin:0 auto;}
.hidden{display:none !important;}
.topbar-controls{display:flex;gap:8px;align-items:center;}
.lang-switch{display:flex;gap:4px;background:var(--paper-dim);padding:4px;border-radius:8px;border:1px solid var(--line);}
.lang-switch button{background:transparent;color:var(--ink-soft);border:none;padding:5px 10px;font-size:11.5px;font-weight:600;border-radius:5px;}
.lang-switch button:hover{background:rgba(127,127,127,0.1);}
.lang-switch button.active{background:var(--ink);color:var(--paper);}
.icon-btn{background:var(--paper-dim);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:8px;font-size:14px;line-height:1;}
.icon-btn:hover{background:rgba(127,127,127,0.16);}
.auth-wrap{max-width:360px;margin:60px auto 0;}
.auth-topbar{display:flex;justify-content:flex-end;max-width:360px;margin:0 auto;}
.auth-card{background:var(--paper-dim);border:1px solid var(--line);border-radius:10px;padding:28px 26px;margin-top:14px;}
.auth-card h1{font-family:'Noto Serif KR',serif;font-size:24px;margin:0 0 4px;}
.auth-sub{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;}
.auth-tabs button{flex:1;background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:8px;font-size:13px;font-weight:600;}
.auth-tabs button.active{background:var(--ink);color:var(--paper);}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.auth-field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
.auth-field input{font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;}
.auth-field input:focus{outline:2px solid var(--celadon-3);outline-offset:1px;}
.auth-submit{width:100%;margin-top:6px;}
.auth-msg .auth-msg-inner{font-size:12.5px;margin-top:12px;padding:10px 12px;border-radius:6px;}
.auth-msg.error .auth-msg-inner{background:#F3D9D7;color:var(--seal-dark);border:1px solid var(--seal);}
.auth-msg.info .auth-msg-inner{background:var(--celadon-1);color:var(--celadon-4);border:1px solid var(--celadon-3);}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:18px;gap:16px;flex-wrap:wrap;}
h1{font-family:'Noto Serif KR',serif;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:0.5px;}
.sub{font-size:13px;color:var(--ink-soft);letter-spacing:0.3px;}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.who .name{font-size:13px;color:var(--ink-soft);}
.who button.textbtn{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:6px 12px;font-size:12px;font-weight:500;}
.who button.textbtn:hover{background:var(--paper-dim);color:var(--ink);}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.tabs button{flex:1;min-width:80px;background:var(--paper-dim);color:var(--ink-soft);border:1px solid var(--line);padding:10px;font-size:13px;font-weight:600;border-radius:8px;}
.tabs button:hover{background:rgba(127,127,127,0.22);}
.tabs button.active{background:var(--ink);color:var(--paper);}
.tabs button.active:hover{background:var(--ink);box-shadow:inset 0 0 0 2px var(--celadon-3);}
.card{background:var(--paper-dim);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:22px;}
.card h2{font-family:'Noto Serif KR',serif;font-size:15px;margin:0 0 14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.export-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:5px 10px;font-size:11px;font-weight:600;border-radius:6px;}
.export-btn:hover{background:var(--paper);color:var(--ink);}
.list-controls{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap;}
.page-btn{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:6px 10px;font-size:12px;font-weight:600;border-radius:5px;min-width:32px;}
.page-btn.active{background:var(--ink);color:var(--paper);}
.page-btn:disabled{opacity:0.35;cursor:default;}
.show-more-btn{width:100%;background:none;border:1px dashed var(--line);color:var(--ink-soft);padding:10px;font-size:12.5px;font-weight:600;border-radius:6px;margin-top:10px;}
.show-more-btn:hover{background:var(--paper);color:var(--ink);}
.lb-row{display:grid;grid-template-columns:22px 1fr 60px 70px 70px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:rgba(127,166,148,0.12);border-radius:6px;padding:10px 8px;margin:0 -8px;}
.lb-rank{color:var(--ink-soft);font-family:'Space Grotesk',monospace;}
.lb-name{font-weight:600;}
.lb-name .tag{font-size:10px;color:var(--celadon-4);font-weight:600;margin-left:5px;}
.lb-stat{text-align:right;font-family:'Space Grotesk',monospace;}
.lb-head{display:grid;grid-template-columns:22px 1fr 60px 70px 70px;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line);}
.lb-head span:not(:first-child){text-align:right;}
.lb-row-simple{display:grid;grid-template-columns:22px 1fr 70px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.lb-row-simple:last-child{border-bottom:none;}
.lb-row-simple.me{background:rgba(127,166,148,0.12);border-radius:6px;padding:10px 8px;margin:0 -8px;}
.lb-head-simple{display:grid;grid-template-columns:22px 1fr 70px;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line);}
.lb-head-simple span:last-child{text-align:right;}
.log-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
.field input, .field select, .field textarea{font-family:'Space Grotesk',monospace;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:150px;}
.field.wide input, .field.wide textarea{width:220px;}
.field select{font-family:'Inter',sans-serif;font-size:14px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--celadon-3);outline-offset:1px;}
button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:10px 20px;border:none;border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer;}
button:hover{background:var(--ink-hover);}
.hint{font-size:12px;color:var(--ink-soft);margin-top:10px;}
.cal{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;}
.cal-week{display:flex;flex-direction:column;gap:4px;}
.cal-cell{width:15px;height:15px;border-radius:3px;background:var(--paper);border:1px solid var(--line);position:relative;}
.cal-cell.l1{background:var(--celadon-1);border-color:transparent;}
.cal-cell.l2{background:var(--celadon-2);border-color:transparent;}
.cal-cell.l3{background:var(--celadon-3);border-color:transparent;}
.cal-cell.hit{background:var(--celadon-4);border-color:transparent;}
.cal-cell.hit::after{content:'';position:absolute;inset:-2px;border:1.5px solid var(--seal);border-radius:4px;transform:rotate(-6deg);opacity:0.9;}
.cal-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);margin-top:10px;flex-wrap:wrap;}
.cal-legend .cal-cell{width:12px;height:12px;}
.bd-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
.bd-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.bd-label{width:88px;flex-shrink:0;color:var(--ink-soft);}
.bd-track{flex:1;background:var(--paper);border-radius:4px;overflow:hidden;height:14px;border:1px solid var(--line);}
.bd-fill{height:100%;border-radius:3px 0 0 3px;}
.bd-val{width:48px;text-align:right;font-family:'Space Grotesk',monospace;font-weight:600;flex-shrink:0;}
.bd-toggle{display:flex;gap:8px;margin-bottom:14px;}
.bd-toggle button{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:5px 12px;font-size:12px;font-weight:500;}
.bd-toggle button.active{background:var(--ink);color:var(--paper);}
.bd-empty{color:var(--ink-soft);font-size:13px;}
.entries{list-style:none;margin:0;padding:0;}
.entries li{padding:12px 0;border-bottom:1px solid var(--line);}
.entries li:last-child{border-bottom:none;}
.e-top{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px;}
.e-date{font-family:'Space Grotesk',monospace;color:var(--ink-soft);}
.e-who{font-size:11px;background:var(--celadon-1);color:var(--celadon-4);padding:2px 8px;border-radius:10px;font-weight:600;margin-right:8px;}
.e-total{font-family:'Space Grotesk',monospace;font-weight:700;}
.e-total.hit{color:var(--seal);}
.e-seal{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--seal);border-radius:4px;color:var(--seal);font-family:'Noto Serif KR',serif;font-size:10px;font-weight:700;transform:rotate(-5deg);margin-right:5px;}
.e-chips{display:flex;flex-wrap:wrap;gap:6px;}
.e-chip{display:flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px 9px 3px 7px;font-size:11.5px;}
.e-chip .dot{width:7px;height:7px;border-radius:50%;}
.e-chip .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0 0 0 3px;line-height:1;}
.e-chip .del:hover{color:var(--seal);}
.empty{color:var(--ink-soft);font-size:13px;padding:10px 0;}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:0;}
.stat-mini{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 16px;text-align:center;flex:1;min-width:110px;}
.stat-mini .num{font-family:'Space Grotesk',monospace;font-size:18px;font-weight:700;color:var(--celadon-4);}
.stat-mini .label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-top:3px;}
.stat-mini.urgent .num{color:var(--seal);}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;}
.badge.applied, .badge.to_read{background:var(--ink-soft);}
.badge.interview, .badge.reading{background:var(--celadon-3);color:var(--ink);}
.badge.offer, .badge.finished{background:var(--celadon-4);}
.badge.rejected{background:var(--seal);}
.badge.withdrawn{background:#B0A79A;color:var(--ink);}
.item-row{padding:14px 0;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.item-title{font-weight:600;font-size:14.5px;}
.item-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
.item-meta select{font-family:'Inter',sans-serif;font-size:12px;padding:5px 8px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
.item-meta input[type=number]{width:70px;font-family:'Space Grotesk',monospace;font-size:12px;padding:5px 7px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
.item-meta a{font-size:12px;color:var(--celadon-4);}
.linkbtn{background:none;border:none;color:var(--celadon-4);font-size:12px;padding:0;text-decoration:underline;font-weight:600;cursor:pointer;}
.item-meta .linkbtn{background:none;border:none;color:var(--celadon-4);font-size:12px;padding:0;text-decoration:underline;font-weight:600;}
.item-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;}
.item-del:hover{color:var(--seal);}
.progress-track{background:var(--paper);border:1px solid var(--line);border-radius:4px;height:8px;overflow:hidden;margin-top:6px;width:160px;}
.progress-fill{height:100%;background:var(--celadon-3);}
.notes-panel{margin-top:10px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;}
.note-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.note-item:last-child{border-bottom:none;}
.note-item .note-page{font-size:10.5px;color:var(--ink-soft);margin-bottom:2px;}
.note-item .note-del{float:right;background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;}
.note-add{display:flex;gap:6px;margin-top:8px;align-items:flex-end;flex-wrap:wrap;}
.note-add textarea{flex:1;min-width:160px;height:44px;resize:vertical;font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper-dim);color:var(--ink);}
.note-add input{width:60px;font-family:'Space Grotesk',monospace;font-size:12px;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--paper-dim);color:var(--ink);}
.note-add button{padding:8px 14px;font-size:12px;}
.topik-row{display:flex;gap:14px;flex-wrap:wrap;}
.topik-box{flex:1;min-width:180px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.topik-box .tlabel{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:6px;}
.topik-box .tval{font-family:'Space Grotesk',monospace;font-size:22px;font-weight:700;color:var(--seal);}
.topik-box .tdate{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.deadline-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:10px;}
.deadline-row:last-child{border-bottom:none;}
.deadline-left{display:flex;flex-direction:column;}
.deadline-title{font-weight:600;}
.deadline-notes{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.deadline-right{display:flex;align-items:center;gap:10px;}
.deadline-days{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--celadon-4);}
.deadline-days.soon{color:var(--seal);}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.month-nav button{padding:6px 12px;font-size:13px;}
.month-nav .month-label{font-family:'Space Grotesk',monospace;font-weight:700;font-size:14px;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.month-dow{font-size:10px;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
.month-day{min-height:64px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:11px;padding:4px;position:relative;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.month-day.today{border-color:var(--celadon-4);border-width:2px;}
.month-day .dnum{font-family:'Space Grotesk',monospace;flex-shrink:0;}
.month-day .chip-stack{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.month-day .event-chip{font-size:8.5px;line-height:1.3;padding:1px 4px;border-radius:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.month-day .event-chip.topik{background:var(--seal);color:#fff;}
.month-day .more-count{font-size:8px;color:var(--ink-soft);}
.month-day.empty{visibility:hidden;}
.deadline-color{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block;margin-right:7px;}
.field input[type=color]{padding:2px;width:44px;height:38px;cursor:pointer;}
footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:30px;}
</style>
</head>
<body>
<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-topbar">
    <div class="topbar-controls">
      <button class="icon-btn" id="darkToggleAuth" title="Toggle dark mode">🌙</button>
      <div class="lang-switch" id="langSwitchAuth"></div>
    </div>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Productivity Tracker</h1>
      <div class="auth-sub" id="authTagline"></div>
      <div class="auth-tabs">
        <button id="tabSignIn" class="active"></button>
        <button id="tabSignUp"></button>
      </div>
      <div id="displayNameField" class="auth-field hidden">
        <label for="displayNameInput" id="lblDisplayName"></label>
        <input type="text" id="displayNameInput">
      </div>
      <div class="auth-field">
        <label for="emailInput" id="lblEmail"></label>
        <input type="email" id="emailInput">
      </div>
      <div class="auth-field">
        <label for="passwordInput" id="lblPassword"></label>
        <input type="password" id="passwordInput">
      </div>
      <button class="auth-submit" id="authSubmit"></button>
      <button class="linkbtn" id="forgotPasswordBtn" style="margin-top:10px;width:100%;text-align:center;"></button>
      <div id="authMsg" class="auth-msg"></div>
    </div>
  </div>
</div>

<!-- PASSWORD RESET SCREEN -->
<div class="auth-wrap hidden" id="resetScreen">
  <div class="auth-card">
    <h1>Productivity Tracker</h1>
    <div class="auth-sub" id="lblSetNewPassword"></div>
    <div class="auth-field">
      <label for="newPasswordInput" id="lblNewPassword"></label>
      <input type="password" id="newPasswordInput">
    </div>
    <button class="auth-submit" id="updatePasswordBtn"></button>
    <div id="resetMsg" class="auth-msg"></div>
  </div>
</div>
<!-- APP -->
<div class="wrap hidden" id="appScreen">
  <header>
    <div>
      <h1>Productivity Tracker</h1>
      <div class="sub" id="headerSub"></div>
    </div>
    <div class="who">
      <button class="icon-btn" id="darkToggleApp" title="Toggle dark mode">🌙</button>
      <div class="lang-switch" id="langSwitchApp"></div>
      <span class="name" id="whoName"></span>
      <button class="textbtn" id="signOutBtn"></button>
    </div>
  </header>
  <div class="tabs" id="tabNav">
    <button data-tab="study" class="active" id="tabBtnStudy"></button>
    <button data-tab="reading" id="tabBtnReading"></button>
    <button data-tab="jobs" id="tabBtnJobs"></button>
    <button data-tab="calendar" id="tabBtnCalendar"></button>
  </div>
  <!-- STUDY TAB -->
  <div class="tab-panel" id="panelStudy">
    <div class="card">
      <h2 id="hLeaderboard"></h2>
      <div class="lb-head"><span id="lbHeadRank"></span><span id="lbHeadName"></span><span id="lbHeadStreak"></span><span id="lbHeadWeek"></span><span id="lbHeadTotal"></span></div>
      <div id="leaderboard"></div>
    </div>
    <div class="card">
      <h2 id="hLogStudy"></h2>

/* ---------- STUDY HELPERS ---------- */
function dayTotal(userId, dateKey){
  const u = allEntries[userId];
  if(!u || !u[dateKey]) return 0;
  return Object.values(u[dateKey]).reduce((a,b)=>a+Number(b),0);
}
function computeStreak(userId){
  let streak = 0; let d = new Date();
  if(!(dayTotal(userId, todayStr(d)) >= GOAL)) d.setDate(d.getDate()-1);
  while(true){
    const key = todayStr(d);
    if(dayTotal(userId, key) >= GOAL){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function computeWeekTotal(userId){
  const now = new Date(); const day = now.getDay();
  const mondayOffset = day === 0 ? 6 : day - 1;
  const monday = new Date(now); monday.setDate(now.getDate() - mondayOffset);
  let sum = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d > now) break;
    sum += dayTotal(userId, todayStr(d));
  }
  return sum;
}
function computeTotal(userId){
  const u = allEntries[userId];
  if(!u) return 0;
  return Object.keys(u).reduce((a,k)=>a+dayTotal(userId,k),0);
}
function levelFor(hours){
  if(!hours) return '';
  if(hours >= GOAL) return 'hit';
  if(hours >= GOAL*0.66) return 'l3';
  if(hours >= GOAL*0.33) return 'l2';
  if(hours > 0) return 'l1';
  return '';
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCSV(rows, headers){
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(r[h])).join(',')));
  return lines.join('\r\n');
}

function icsEscape(s){ return String(s).replace(/[,;]/g, c=>'\\'+c).replace(/\n/g,'\\n'); }
function icsDateTimeUTC(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function icsRRule(ev){
  if(!ev.recur_freq) return null;
  const freqMap = { day:'DAILY', week:'WEEKLY', month:'MONTHLY' };
  let rule = `FREQ=${freqMap[ev.recur_freq]};INTERVAL=${ev.recur_interval||1}`;
  if(ev.recur_end_type === 'date' && ev.recur_end_date){
    rule += `;UNTIL=${ev.recur_end_date.replace(/-/g,'')}T235959Z`;
  }
  return rule;
}
function exportIcs(){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Korean Tracker//EN','CALSCALE:GREGORIAN'];
  lines.push('BEGIN:VEVENT');
  lines.push('UID:topik-registration@korean-tracker');
  lines.push('DTSTART:'+icsDateTimeUTC(TOPIK_REG));
  lines.push('SUMMARY:'+icsEscape('TOPIK Registration Opens'));
  lines.push('END:VEVENT');
  lines.push('BEGIN:VEVENT');
  lines.push('UID:topik-test@korean-tracker');
  lines.push('DTSTART:'+icsDateTimeUTC(TOPIK_TEST));
  lines.push('SUMMARY:'+icsEscape('TOPIK Test Day'));
  lines.push('END:VEVENT');
  (allEvents[currentUser.id]||[]).forEach(ev=>{
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+ev.id+'@korean-tracker');
    if(ev.event_time){
      const timeDigits = ev.event_time.replace(/:/g,'').padEnd(6,'0').slice(0,6);
      lines.push('DTSTART:'+ev.event_date.replace(/-/g,'')+'T'+timeDigits);
    } else {
      lines.push('DTSTART;VALUE=DATE:'+ev.event_date.replace(/-/g,''));
    }
    const rrule = icsRRule(ev);
    if(rrule) lines.push('RRULE:'+rrule);
    lines.push('SUMMARY:'+icsEscape(ev.title));
    if(ev.notes) lines.push('DESCRIPTION:'+icsEscape(ev.notes));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  downloadFile('korean-tracker.ics', lines.join('\r\n'), 'text/calendar');
}

/* ---------- ICS IMPORT ---------- */
function unfoldICS(text){
  return text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');
}
function unescapeICSText(s){
  return String(s||'').replace(/\\n/g,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
}
function parseICS(text){
  const unfolded = unfoldICS(text);
  const lines = unfolded.split('\n');
  const events = [];
  let cur = null;
  lines.forEach(rawLine=>{
    const line = rawLine.trim();
    if(line === 'BEGIN:VEVENT'){ cur = {}; return; }
    if(line === 'END:VEVENT'){ if(cur && cur.title && cur.date) events.push(cur); cur = null; return; }
    if(!cur) return;
    const idx = line.indexOf(':');
    if(idx === -1) return;
    const keyPart = line.slice(0, idx);
    const value = line.slice(idx+1);
    const key = keyPart.split(';')[0].toUpperCase();
    if(key === 'SUMMARY'){ cur.title = unescapeICSText(value); }
    else if(key === 'DESCRIPTION'){ cur.notes = unescapeICSText(value); }
    else if(key === 'DTSTART'){
      const digits = value.replace(/[^0-9T]/g,'');
      const datePart = digits.split('T')[0];
      if(datePart.length >= 8){
        cur.date = `${datePart.slice(0,4)}-${datePart.slice(4,6)}-${datePart.slice(6,8)}`;
      }
      const timePart = digits.includes('T') ? digits.split('T')[1] : '';
      if(timePart.length >= 4){
        cur.time = `${timePart.slice(0,2)}:${timePart.slice(2,4)}`;
      }
    }
  });
  return events;
}
async function importIcsFile(file){
  const text = await file.text();
  let parsed;
  try{ parsed = parseICS(text); }catch(e){ parsed = []; }
  if(parsed.length === 0){
    alert(t('importFail'));
    return;
  }
  const rows = parsed.map(ev => ({
    user_id: currentUser.id,
    title: ev.title || 'Untitled',
    kind: 'event',
    event_date: ev.date,
    event_time: ev.time || null,
    notes: ev.notes || null,
    color: '#6E8FB0'
  }));
  const { data, error } = await supabaseClient.from('events').insert(rows).select();
  if(!error && data){
    if(!allEvents[currentUser.id]) allEvents[currentUser.id] = [];
    allEvents[currentUser.id].push(...data);
    renderCalendarTab();
    alert(t('importSuccess').replace('{n}', data.length));
  } else {
    alert(t('importFail'));
  }
}

function formatCountdown(target){
  const diff = target - new Date();
  if(diff <= 0) return null;
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  return `${days}d ${hours}h ${mins}m`;
}

function formatTime12h(t){
  if(!t) return '';
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr,10);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${mStr} ${ampm}`;
}

function expandOccurrences(ev, rangeStartStr, rangeEndStr){
  const rangeStart = new Date(rangeStartStr);
  const rangeEnd = new Date(rangeEndStr);
  if(!ev.recur_freq){
    const d = new Date(ev.event_date);
    return (d >= rangeStart && d <= rangeEnd) ? [ev.event_date] : [];
  }
  const occ = [];
  let cur = new Date(ev.event_date);
  const interval = ev.recur_interval || 1;
  const recurEnd = (ev.recur_end_type === 'date' && ev.recur_end_date) ? new Date(ev.recur_end_date) : null;
  let safety = 0;
  while(cur <= rangeEnd && safety < 2000){
    safety++;
    if(recurEnd && cur > recurEnd) break;
    if(cur >= rangeStart && cur <= rangeEnd){ occ.push(todayStr(cur)); }
    if(ev.recur_freq === 'day') cur.setDate(cur.getDate() + interval);
    else if(ev.recur_freq === 'week') cur.setDate(cur.getDate() + interval*7);
    else if(ev.recur_freq === 'month') cur.setMonth(cur.getMonth() + interval);
    else break;
  }
  return occ;
}

function nextOccurrence(ev){
  const today = todayStr();
  const farFuture = todayStr(new Date(Date.now() + 1000*60*60*24*365*3));
  if(!ev.recur_freq){ return ev.event_date; }
  const occ = expandOccurrences(ev, today, farFuture);
  if(occ.length > 0) return occ[0];
  const recurEnd = (ev.recur_end_type === 'date' && ev.recur_end_date) ? ev.recur_end_date : null;
  return recurEnd || ev.event_date;
}

function recurBadgeText(ev){
  if(!ev.recur_freq) return '';
  const n = ev.recur_interval || 1;
  const unitKey = ev.recur_freq === 'day' ? 'repeatDay' : ev.recur_freq === 'week' ? 'repeatWeek' : 'repeatMonth';
  let text = t('recurBadge').replace('{n}', n).replace('{unit}', t(unitKey).toLowerCase());
  if(ev.recur_end_type === 'date' && ev.recur_end_date){
    text += ' · ' + t('recurUntil').replace('{date}', ev.recur_end_date);
  } else {
    text += ' · ' + t('recurForever');
  }
  return text;
}

const PAGE_SIZE = 10;
const PREVIEW_SIZE = 3;
const listState = {
  deadline: { expanded:false, page:1 },
  event: { expanded:false, page:1 }
};

function itemsOfKind(kind){
  const all = [];
  Object.values(allEvents).forEach(userEvents=>{
    userEvents.forEach(ev=>{
      if((ev.kind || 'deadline') === kind) all.push(ev);
    });
  });
  return all.sort((a,b)=> nextOccurrence(a).localeCompare(nextOccurrence(b)) || (a.event_time||'').localeCompare(b.event_time||''));
}

let expandedSubscribe = new Set();
let reminderDrafts = {};

function buildEventRowEl(ev){
  const today = new Date(todayStr());
  const nextDate = nextOccurrence(ev);
  const evDate = new Date(nextDate);
  const diffDays = Math.round((evDate - today) / 86400000);
  let daysText, soon = false;
  if(diffDays > 0){ daysText = diffDays + ' ' + pluralUnit(diffDays, t('dayLeftSingular'), t('daysLeft')); soon = diffDays <= 7; }
  else if(diffDays === 0){ daysText = t('today'); soon = true; }
  else { const od = Math.abs(diffDays); daysText = od + ' ' + pluralUnit(od, t('overdueSingular'), t('overdue')); soon = true; }

  const wrap = document.createElement('div');
  const timeText = ev.event_time ? ' · ' + formatTime12h(ev.event_time) : '';
  const recurText = recurBadgeText(ev);
  const sub = mySubscriptions[ev.id];
  const isOpen = expandedSubscribe.has(ev.id);
  const bellLabel = sub ? '🔔 ' + t('subscribed') : '🔕 ' + t('remindMe');
  const isMine = ev.user_id === currentUser.id;
  const ownerTag = !isMine ? `<span class="e-who">${nameFor(ev.user_id)}</span>` : '';

  if(!reminderDrafts[ev.id]){
    reminderDrafts[ev.id] = {
      appliesTo: sub ? sub.applies_to : 'all',
      reminders: (sub && sub.reminders && sub.reminders.length) ? JSON.parse(JSON.stringify(sub.reminders)) : [{value:24, unit:'hours'}]
    };
  }
  const draft = reminderDrafts[ev.id];

  const remRows = draft.reminders.map((r, idx) => `
    <span class="note-add" style="margin-top:6px;">
      <input type="number" min="1" value="${r.value}" data-idx="${idx}" class="rem-value-input" style="width:60px;">
      <select data-idx="${idx}" class="rem-unit-select">
        <option value="hours" ${r.unit==='hours'?'selected':''}>${t('unitHours')}</option>
        <option value="days" ${r.unit==='days'?'selected':''}>${t('unitDays')}</option>
      </select>
      <button class="item-del rem-remove-btn" data-idx="${idx}" title="Remove">✕</button>
    </span>`).join('');

  wrap.className = 'deadline-row';
  wrap.innerHTML =
    `<div class="deadline-left">
      <div class="deadline-title">${ownerTag}<span class="deadline-color" style="background:${ev.color||'#4F7563'}"></span>${ev.title}</div>
      <div class="deadline-notes">${nextDate}${timeText}${ev.notes ? ' · ' + ev.notes : ''}</div>
      ${recurText ? `<div class="deadline-notes">↻ ${recurText}</div>` : ''}
      <button class="linkbtn sub-toggle" data-id="${ev.id}" style="margin-top:6px;">${bellLabel}</button>
      <div class="notes-panel ${isOpen?'':'hidden'}" data-sub-for="${ev.id}">
        ${ev.recur_freq ? `
        <div class="field">
          <label>${t('applyToLabel')}</label>
          <select class="sub-applies-select" data-id="${ev.id}">
            <option value="all" ${draft.appliesTo==='all'?'selected':''}>${t('applyAll')}</option>
            <option value="once" ${draft.appliesTo==='once'?'selected':''}>${t('applyOnce')}</option>
          </select>
        </div>` : ''}
        ${remRows}
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="export-btn sub-add-reminder" data-id="${ev.id}">${t('addReminder')}</button>
          <button class="export-btn sub-save" data-id="${ev.id}">${t('saveReminders')}</button>
          ${sub ? `<button class="export-btn sub-remove" data-id="${ev.id}">${t('unsubscribe')}</button>` : ''}
        </div>
        <div class="hint">${t('reminderNote')}</div>
      </div>
    </div>
    <div class="deadline-right">
      <span class="deadline-days ${soon?'soon':''}">${daysText}</span>
      ${isMine ? `<button class="item-del del-event-btn" data-id="${ev.id}" title="Delete">✕</button>` : ''}
    </div>`;

  const delBtn = wrap.querySelector('.del-event-btn');
  if(delBtn) delBtn.addEventListener('click', ()=> deleteEvent(ev.id));
  wrap.querySelector('.sub-toggle').addEventListener('click', ()=>{
    if(expandedSubscribe.has(ev.id)) expandedSubscribe.delete(ev.id); else expandedSubscribe.add(ev.id);
    renderCalendarTab();
  });
  const appliesSel = wrap.querySelector('.sub-applies-select');
  if(appliesSel){
    appliesSel.addEventListener('change', ()=>{ draft.appliesTo = appliesSel.value; });
  }
  wrap.querySelectorAll('.rem-value-input').forEach(inp=>{
    inp.addEventListener('change', ()=>{ draft.reminders[parseInt(inp.dataset.idx)].value = parseInt(inp.value)||1; });
  });
  wrap.querySelectorAll('.rem-unit-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{ draft.reminders[parseInt(sel.dataset.idx)].unit = sel.value; });
  });
  wrap.querySelectorAll('.rem-remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      draft.reminders.splice(parseInt(btn.dataset.idx),1);
      if(draft.reminders.length === 0) draft.reminders.push({value:24,unit:'hours'});
      renderCalendarTab();
    });
  });
  const addBtn = wrap.querySelector('.sub-add-reminder');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    draft.reminders.push({value:24, unit:'hours'});
    renderCalendarTab();
  });
  const saveBtn = wrap.querySelector('.sub-save');
  if(saveBtn) saveBtn.addEventListener('click', ()=> saveSubscription(ev.id));
  const removeBtn = wrap.querySelector('.sub-remove');
  if(removeBtn) removeBtn.addEventListener('click', ()=> removeSubscription(ev.id));

  return wrap;
}

async function saveSubscription(eventId){
  const draft = reminderDrafts[eventId];
  if(!draft) return;
  const row = {
    event_id: eventId,
    user_id: currentUser.id,
    applies_to: draft.appliesTo,
    reminders: draft.reminders
  };
  const { data, error } = await supabaseClient.from('event_subscriptions')
    .upsert(row, { onConflict: 'event_id,user_id' }).select();
  if(!error && data && data[0]){
    mySubscriptions[eventId] = data[0];
  }
  expandedSubscribe.delete(eventId);
  renderCalendarTab();
}
async function removeSubscription(eventId){
  await supabaseClient.from('event_subscriptions').delete().eq('event_id', eventId).eq('user_id', currentUser.id);
  delete mySubscriptions[eventId];
  delete reminderDrafts[eventId];
  expandedSubscribe.delete(eventId);
  renderCalendarTab();
}

function renderKindList(kind, listId, controlsId){
  const list = document.getElementById(listId);
  const controls = document.getElementById(controlsId);
  list.innerHTML = '';
  controls.innerHTML = '';
  const items = itemsOfKind(kind);
  if(items.length === 0){ list.innerHTML = '<div class="empty">—</div>'; return; }

  const state = listState[kind];
  let toShow;

  if(!state.expanded){
    toShow = items.slice(0, PREVIEW_SIZE);
  } else {
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if(state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * PAGE_SIZE;
    toShow = items.slice(start, start + PAGE_SIZE);
  }
  toShow.forEach(ev => list.appendChild(buildEventRowEl(ev)));

  if(!state.expanded && items.length > PREVIEW_SIZE){
    const moreBtn = document.createElement('button');
    moreBtn.className = 'show-more-btn';
    moreBtn.textContent = `${t('showMore')} (${items.length - PREVIEW_SIZE})`;
    moreBtn.addEventListener('click', ()=>{ state.expanded = true; state.page = 1; renderCalendarTab(); });
    controls.appendChild(moreBtn);
  } else if(state.expanded){
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if(totalPages > 1){
      const nav = document.createElement('div');
      nav.className = 'list-controls';
      const mkBtn = (label, page, disabled)=>{
        const b = document.createElement('button');
        b.textContent = label;
        b.disabled = !!disabled;
        b.className = 'page-btn' + (page === state.page ? ' active' : '');
        b.addEventListener('click', ()=>{ state.page = page; renderCalendarTab(); });
        return b;
      };
      nav.appendChild(mkBtn('«', 1, state.page === 1));
      nav.appendChild(mkBtn('‹', Math.max(1, state.page - 1), state.page === 1));
      for(let p = 1; p <= totalPages; p++){ nav.appendChild(mkBtn(String(p), p, false)); }
      nav.appendChild(mkBtn('›', Math.min(totalPages, state.page + 1), state.page === totalPages));
      nav.appendChild(mkBtn('»', totalPages, state.page === totalPages));
      controls.appendChild(nav);
    }
    if(items.length > PREVIEW_SIZE){
      const lessBtn = document.createElement('button');
      lessBtn.className = 'show-more-btn';
      lessBtn.textContent = t('showLess');
      lessBtn.addEventListener('click', ()=>{ state.expanded = false; state.page = 1; renderCalendarTab(); });
      controls.appendChild(lessBtn);
    }
  }
}

function renderDeadlineList(){
  renderKindList('deadline', 'deadlineList', 'deadlineListControls');
  renderKindList('event', 'eventListKind', 'eventListControls');
}
function textColorFor(hex){
  if(!hex) return '#fff';
  const h = hex.replace('#','');
  if(h.length !== 6) return '#fff';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#1E1F22' : '#fff';
}
function renderMonthGrid(){
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';
  const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
  document.getElementById('monthLabel').textContent = calViewDate.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  ['S','M','T','W','T','F','S'].forEach(d=>{
    const el = document.createElement('div'); el.className = 'month-dow'; el.textContent = d;
    grid.appendChild(el);
  });
  const firstDay = new Date(y, m, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayKey = todayStr();
  const monthStart = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const monthEnd = `${y}-${String(m+1).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;

  const myEventsByDate = {};
  Object.values(allEvents).forEach(userEvents=>{
    userEvents.forEach(ev=>{
      const occ = expandOccurrences(ev, monthStart, monthEnd);
      occ.forEach(dateKey=>{
        if(!myEventsByDate[dateKey]) myEventsByDate[dateKey] = [];
        myEventsByDate[dateKey].push(ev);
      });
    });
  });
  const topikByDate = {};
  topikByDate[todayStr(TOPIK_REG)] = 'TOPIK reg.';
  topikByDate[todayStr(TOPIK_TEST)] = 'TOPIK test';

  for(let i=0;i<startOffset;i++){
    const el = document.createElement('div'); el.className='month-day empty';
    grid.appendChild(el);
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'month-day' + (dateKey===todayKey ? ' today' : '');
    const events = myEventsByDate[dateKey] || [];
    const maxShow = 3;
    let chips = '';
    if(topikByDate[dateKey]){
      chips += `<div class="event-chip topik" title="${topikByDate[dateKey]}">${topikByDate[dateKey]}</div>`;
    }
    events.slice(0, maxShow).forEach(ev=>{
      const bg = ev.color || '#4F7563';
      const recurPrefix = ev.recur_freq ? '↻ ' : '';
      const ownerSuffix = ev.user_id !== currentUser.id ? ` (${t('ownedBy')} ${nameFor(ev.user_id)})` : '';
      const tip = ev.event_time ? `${recurPrefix}${ev.title} · ${formatTime12h(ev.event_time)}${ownerSuffix}` : `${recurPrefix}${ev.title}${ownerSuffix}`;
      chips += `<div class="event-chip" style="background:${bg};color:${textColorFor(bg)}" title="${tip}">${recurPrefix}${ev.title}</div>`;
    });
    const extra = events.length - maxShow;
    if(extra > 0){ chips += `<div class="more-count">+${extra}</div>`; }
    cell.innerHTML = `<div class="dnum">${day}</div><div class="chip-stack">${chips}</div>`;
    grid.appendChild(cell);
  }
}
