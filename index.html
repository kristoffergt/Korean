<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>매일 5시간 — Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap');

:root{
  --paper:#F6F0E3;
  --paper-dim:#EDE4D0;
  --ink:#242019;
  --ink-soft:#6B6152;
  --celadon-1:#DCE7DA;
  --celadon-2:#AFC9AE;
  --celadon-3:#7FA694;
  --celadon-4:#4F7563;
  --seal:#B33B34;
  --seal-dark:#8C2C27;
  --line: rgba(36,32,25,0.12);

  --c-listening:#6E8FB0;
  --c-speaking:#B37B4F;
  --c-reading:#7FA694;
  --c-writing:#9C7BB0;
  --c-grammar:#B0A46E;
  --c-vocabulary:#5C9E8C;
  --c-topik:#B33B34;
  --c-other:#8B8578;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Inter','Noto Sans KR',sans-serif;padding:32px 20px 60px;min-height:100vh;}
.wrap{max-width:780px;margin:0 auto;}
.hidden{display:none !important;}

.lang-switch{display:flex;gap:4px;}
.lang-switch button{
  background:var(--paper);
  color:var(--ink-soft);
  border:1px solid var(--line);
  padding:5px 10px;
  font-size:11.5px;
  font-weight:600;
  border-radius:5px;
}
.lang-switch button.active{background:var(--ink);color:var(--paper);}

.auth-wrap{max-width:360px;margin:60px auto 0;}
.auth-topbar{display:flex;justify-content:flex-end;max-width:360px;margin:0 auto;}
.auth-card{background:var(--paper-dim);border:1px solid var(--line);border-radius:10px;padding:28px 26px;margin-top:14px;}
.auth-card h1{font-family:'Noto Serif KR',serif;font-size:24px;margin:0 0 4px;}
.auth-sub{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;}
.auth-tabs button{flex:1;background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:8px;font-size:13px;font-weight:600;}
.auth-tabs button.active{background:var(--ink);color:var(--paper);}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.auth-field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
.auth-field input{font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;}
.auth-field input:focus{outline:2px solid var(--celadon-3);outline-offset:1px;}
.auth-submit{width:100%;margin-top:6px;}
.auth-msg .auth-msg-inner{font-size:12.5px;margin-top:12px;padding:10px 12px;border-radius:6px;}
.auth-msg.error .auth-msg-inner{background:#F3D9D7;color:var(--seal-dark);border:1px solid var(--seal);}
.auth-msg.info .auth-msg-inner{background:var(--celadon-1);color:var(--celadon-4);border:1px solid var(--celadon-3);}

header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:18px;gap:16px;flex-wrap:wrap;}
h1{font-family:'Noto Serif KR',serif;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:0.5px;}
.sub{font-size:13px;color:var(--ink-soft);letter-spacing:0.3px;}
.who{display:flex;align-items:center;gap:12px;}
.who .name{font-size:13px;color:var(--ink-soft);}
.who button{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:6px 12px;font-size:12px;font-weight:500;}
.who button:hover{background:var(--paper-dim);color:var(--ink);}

.tabs{display:flex;gap:8px;margin-bottom:22px;}
.tabs button{flex:1;background:var(--paper-dim);color:var(--ink-soft);border:1px solid var(--line);padding:10px;font-size:13px;font-weight:600;border-radius:8px;}
.tabs button.active{background:var(--ink);color:var(--paper);}

.card{background:var(--paper-dim);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:22px;}
.card h2{font-family:'Noto Serif KR',serif;font-size:15px;margin:0 0 14px;color:var(--ink);}

.lb-row{display:grid;grid-template-columns:22px 1fr 60px 70px 70px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:rgba(127,166,148,0.12);border-radius:6px;padding:10px 8px;margin:0 -8px;}
.lb-rank{color:var(--ink-soft);font-family:'Space Grotesk',monospace;}
.lb-name{font-weight:600;}
.lb-name .tag{font-size:10px;color:var(--celadon-4);font-weight:600;margin-left:5px;}
.lb-stat{text-align:right;font-family:'Space Grotesk',monospace;}
.lb-head{display:grid;grid-template-columns:22px 1fr 60px 70px 70px;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line);}
.lb-head span:not(:first-child){text-align:right;}

.lb-row-simple{display:grid;grid-template-columns:22px 1fr 70px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.lb-row-simple:last-child{border-bottom:none;}
.lb-row-simple.me{background:rgba(127,166,148,0.12);border-radius:6px;padding:10px 8px;margin:0 -8px;}
.lb-head-simple{display:grid;grid-template-columns:22px 1fr 70px;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line);}
.lb-head-simple span:last-child{text-align:right;}

.log-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
.field input, .field select{font-family:'Space Grotesk',monospace;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:150px;}
.field.wide input{width:220px;}
.field select{font-family:'Inter',sans-serif;font-size:14px;}
.field input:focus, .field select:focus{outline:2px solid var(--celadon-3);outline-offset:1px;}
button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:10px 20px;border:none;border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer;}
button:hover{background:var(--celadon-4);}
.hint{font-size:12px;color:var(--ink-soft);margin-top:10px;}

.cal{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;}
.cal-week{display:flex;flex-direction:column;gap:4px;}
.cal-cell{width:15px;height:15px;border-radius:3px;background:var(--paper);border:1px solid var(--line);position:relative;}
.cal-cell.l1{background:var(--celadon-1);border-color:transparent;}
.cal-cell.l2{background:var(--celadon-2);border-color:transparent;}
.cal-cell.l3{background:var(--celadon-3);border-color:transparent;}
.cal-cell.hit{background:var(--celadon-4);border-color:transparent;}
.cal-cell.hit::after{content:'';position:absolute;inset:-2px;border:1.5px solid var(--seal);border-radius:4px;transform:rotate(-6deg);opacity:0.9;}
.cal-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);margin-top:10px;flex-wrap:wrap;}
.cal-legend .cal-cell{width:12px;height:12px;}

.bd-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
.bd-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.bd-label{width:88px;flex-shrink:0;color:var(--ink-soft);}
.bd-track{flex:1;background:var(--paper);border-radius:4px;overflow:hidden;height:14px;border:1px solid var(--line);}
.bd-fill{height:100%;border-radius:3px 0 0 3px;}
.bd-val{width:48px;text-align:right;font-family:'Space Grotesk',monospace;font-weight:600;flex-shrink:0;}
.bd-toggle{display:flex;gap:8px;margin-bottom:14px;}
.bd-toggle button{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:5px 12px;font-size:12px;font-weight:500;}
.bd-toggle button.active{background:var(--ink);color:var(--paper);}
.bd-empty{color:var(--ink-soft);font-size:13px;}

.entries{list-style:none;margin:0;padding:0;}
.entries li{padding:12px 0;border-bottom:1px solid var(--line);}
.entries li:last-child{border-bottom:none;}
.e-top{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px;}
.e-date{font-family:'Space Grotesk',monospace;color:var(--ink-soft);}
.e-who{font-size:11px;background:var(--celadon-1);color:var(--celadon-4);padding:2px 8px;border-radius:10px;font-weight:600;margin-right:8px;}
.e-total{font-family:'Space Grotesk',monospace;font-weight:700;}
.e-total.hit{color:var(--seal);}
.e-seal{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--seal);border-radius:4px;color:var(--seal);font-family:'Noto Serif KR',serif;font-size:10px;font-weight:700;transform:rotate(-5deg);margin-right:5px;}
.e-chips{display:flex;flex-wrap:wrap;gap:6px;}
.e-chip{display:flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px 9px 3px 7px;font-size:11.5px;}
.e-chip .dot{width:7px;height:7px;border-radius:50%;}
.e-chip .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0 0 0 3px;line-height:1;}
.e-chip .del:hover{color:var(--seal);}
.empty{color:var(--ink-soft);font-size:13px;padding:10px 0;}

.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:0;}
.stat-mini{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 16px;text-align:center;flex:1;min-width:80px;}
.stat-mini .num{font-family:'Space Grotesk',monospace;font-size:20px;font-weight:700;color:var(--celadon-4);}
.stat-mini .label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-top:3px;}

.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;}
.badge.applied, .badge.to_read{background:var(--ink-soft);}
.badge.interview, .badge.reading{background:var(--celadon-3);color:var(--ink);}
.badge.offer, .badge.finished{background:var(--celadon-4);}
.badge.rejected{background:var(--seal);}
.badge.withdrawn{background:#B0A79A;color:var(--ink);}

.item-row{padding:14px 0;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.item-title{font-weight:600;font-size:14.5px;}
.item-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
.item-meta select{font-family:'Inter',sans-serif;font-size:12px;padding:5px 8px;border-radius:5px;border:1px solid var(--line);background:var(--paper);}
.item-meta input[type=number]{width:70px;font-family:'Space Grotesk',monospace;font-size:12px;padding:5px 7px;border-radius:5px;border:1px solid var(--line);background:var(--paper);}
.item-meta a{font-size:12px;color:var(--celadon-4);}
.item-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;}
.item-del:hover{color:var(--seal);}
.progress-track{background:var(--paper);border:1px solid var(--line);border-radius:4px;height:8px;overflow:hidden;margin-top:6px;width:160px;}
.progress-fill{height:100%;background:var(--celadon-3);}

footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:30px;}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-topbar">
    <div class="lang-switch" id="langSwitchAuth"></div>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>매일 5시간</h1>
      <div class="auth-sub" id="authTagline"></div>
      <div class="auth-tabs">
        <button id="tabSignIn" class="active"></button>
        <button id="tabSignUp"></button>
      </div>
      <div id="displayNameField" class="auth-field hidden">
        <label for="displayNameInput" id="lblDisplayName"></label>
        <input type="text" id="displayNameInput" placeholder="e.g. Kristoffer">
      </div>
      <div class="auth-field">
        <label for="emailInput" id="lblEmail"></label>
        <input type="email" id="emailInput">
      </div>
      <div class="auth-field">
        <label for="passwordInput" id="lblPassword"></label>
        <input type="password" id="passwordInput">
      </div>
      <button class="auth-submit" id="authSubmit"></button>
      <div id="authMsg" class="auth-msg"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div class="wrap hidden" id="appScreen">

  <header>
    <div>
      <h1>매일 5시간</h1>
      <div class="sub" id="headerSub"></div>
    </div>
    <div class="who">
      <div class="lang-switch" id="langSwitchApp"></div>
      <span class="name" id="whoName"></span>
      <button id="signOutBtn"></button>
    </div>
  </header>

  <div class="tabs" id="tabNav">
    <button data-tab="study" class="active" id="tabBtnStudy"></button>
    <button data-tab="reading" id="tabBtnReading"></button>
    <button data-tab="jobs" id="tabBtnJobs"></button>
  </div>

  <!-- STUDY TAB -->
  <div class="tab-panel" id="panelStudy">
    <div class="card">
      <h2 id="hLeaderboard"></h2>
      <div class="lb-head"><span id="lbHeadRank"></span><span id="lbHeadName"></span><span id="lbHeadStreak"></span><span id="lbHeadWeek"></span><span id="lbHeadTotal"></span></div>
      <div id="leaderboard"></div>
    </div>

    <div class="card">
      <h2 id="hLogStudy"></h2>
      <div class="log-form">
        <div class="field">
          <label for="dateInput" id="lblDate"></label>
          <input type="date" id="dateInput">
        </div>
        <div class="field">
          <label for="activityInput" id="lblActivity"></label>
          <select id="activityInput"></select>
        </div>
        <div class="field">
          <label for="hoursInput" id="lblHours"></label>
          <input type="number" id="hoursInput" min="0" step="0.25" placeholder="1.5">
        </div>
        <button id="addBtn"></button>
      </div>
      <div class="hint" id="studyHint"></div>
    </div>

    <div class="card">
      <h2 id="hCalendar"></h2>
      <div class="cal" id="calGrid"></div>
      <div class="cal-legend">
        <span id="calLegendLess"></span>
        <div class="cal-cell"></div>
        <div class="cal-cell l1"></div>
        <div class="cal-cell l2"></div>
        <div class="cal-cell l3"></div>
        <div class="cal-cell hit"></div>
        <span id="calLegendHit"></span>
      </div>
    </div>

    <div class="card">
      <h2 id="hBreakdown"></h2>
      <div class="bd-toggle" id="bdToggle">
        <button data-range="7" id="bd7"></button>
        <button data-range="30" id="bd30"></button>
        <button data-range="all" class="active" id="bdAll"></button>
      </div>
      <div id="bdBars"></div>
    </div>

    <div class="card">
      <h2 id="hMyEntries"></h2>
      <ul class="entries" id="entryList"></ul>
    </div>

    <div class="card">
      <h2 id="hFeed"></h2>
      <ul class="entries" id="feedList"></ul>
    </div>
  </div>

  <!-- READING TAB -->
  <div class="tab-panel hidden" id="panelReading">
    <div class="card">
      <h2 id="hReadingStats"></h2>
      <div class="stat-row">
        <div class="stat-mini"><div class="num" id="rStatReading">0</div><div class="label" id="rLabelReading"></div></div>
        <div class="stat-mini"><div class="num" id="rStatToRead">0</div><div class="label" id="rLabelToRead"></div></div>
        <div class="stat-mini"><div class="num" id="rStatFinished">0</div><div class="label" id="rLabelFinished"></div></div>
      </div>
    </div>

    <div class="card">
      <h2 id="hAddBook"></h2>
      <div class="log-form">
        <div class="field wide">
          <label for="bookTitle" id="lblBookTitle"></label>
          <input type="text" id="bookTitle">
        </div>
        <div class="field wide">
          <label for="bookAuthor" id="lblBookAuthor"></label>
          <input type="text" id="bookAuthor">
        </div>
        <div class="field">
          <label for="bookStatus" id="lblBookStatus"></label>
          <select id="bookStatus"></select>
        </div>
        <div class="field">
          <label for="bookPages" id="lblBookPages"></label>
          <input type="number" id="bookPages" min="0">
        </div>
        <button id="addBookBtn"></button>
      </div>
    </div>

    <div class="card">
      <h2 id="hYourBooks"></h2>
      <div id="bookList"></div>
    </div>

    <div class="card">
      <h2 id="hBookLB"></h2>
      <div class="lb-head-simple"><span id="blbHeadRank"></span><span id="blbHeadName"></span><span id="blbHeadFinished"></span></div>
      <div id="bookLeaderboard"></div>
    </div>
  </div>

  <!-- JOBS TAB -->
  <div class="tab-panel hidden" id="panelJobs">
    <div class="card">
      <h2 id="hJobStats"></h2>
      <div class="stat-row">
        <div class="stat-mini"><div class="num" id="jStatApplied">0</div><div class="label" id="jLabelApplied"></div></div>
        <div class="stat-mini"><div class="num" id="jStatInterview">0</div><div class="label" id="jLabelInterview"></div></div>
        <div class="stat-mini"><div class="num" id="jStatOffer">0</div><div class="label" id="jLabelOffer"></div></div>
        <div class="stat-mini"><div class="num" id="jStatRejected">0</div><div class="label" id="jLabelRejected"></div></div>
      </div>
    </div>

    <div class="card">
      <h2 id="hAddJob"></h2>
      <div class="log-form">
        <div class="field wide">
          <label for="jobCompany" id="lblCompany"></label>
          <input type="text" id="jobCompany">
        </div>
        <div class="field wide">
          <label for="jobRole" id="lblRole"></label>
          <input type="text" id="jobRole">
        </div>
        <div class="field">
          <label for="jobStatus" id="lblJobStatus"></label>
          <select id="jobStatus"></select>
        </div>
        <div class="field">
          <label for="jobDate" id="lblJobDate"></label>
          <input type="date" id="jobDate">
        </div>
        <div class="field wide">
          <label for="jobLink" id="lblJobLink"></label>
          <input type="text" id="jobLink">
        </div>
        <button id="addJobBtn"></button>
      </div>
    </div>

    <div class="card">
      <h2 id="hYourJobs"></h2>
      <div id="jobList"></div>
    </div>

    <div class="card">
      <h2 id="hJobLB"></h2>
      <div class="lb-head-simple"><span id="jlbHeadRank"></span><span id="jlbHeadName"></span><span id="jlbHeadApplied"></span></div>
      <div id="jobLeaderboard"></div>
    </div>
  </div>

  <footer id="footerText"></footer>
</div>

function buildLangSwitch(container){
  container.innerHTML = '';
  [['en','EN'],['ko','한국어'],['vi','Tiếng Việt']].forEach(([code,label])=>{
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.dataset.lang = code;
    if(code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', ()=> applyLanguage(code));
    container.appendChild(btn);
  });
}

function rebuildActivitySelect(){

  const prev = sel.value;

  ACTIVITIES.forEach(a=>{

    sel.appendChild(opt);
  });
  if(prev) sel.value = prev;
}
function rebuildBookStatusSelect(){

  sel.value = prev;
}
function rebuildJobStatusSelect(){
  const sel = document.getElementById('jobStatus');
  const prev = sel.value || 'applied';
  sel.innerHTML = '';
  ['applied','interview','offer','rejected','withdrawn'].forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = jobStatusLabel(s);
    sel.appendChild(opt);

}

function applyLanguage(lang){
  currentLang = lang;
  localStorage.setItem('trackerLang', lang);

  Object.entries(STATIC_MAP).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.textContent = t(key);
  });

  document.getElementById('authSubmit').textContent = authMode === 'signin' ? t('signIn') : t('createAccount');

  buildLangSwitch(document.getElementById('langSwitchAuth'));
  buildLangSwitch(document.getElementById('langSwitchApp'));

  rebuildActivitySelect();
  rebuildBookStatusSelect();
  rebuildJobStatusSelect();

  if(currentUser){ renderAll(); }
}

  document.getElementById('tabSignUp').classList.toggle('active', mode==='signup');
  document.getElementById('displayNameField').classList.toggle('hidden', mode!=='signup');

document.getElementById('authSubmit').addEventListener('click', async ()=>{
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if(!email || !password){ showAuthMsg('Enter email and password.', 'error'); return; }

  if(authMode === 'signup'){
    const displayName = document.getElementById('displayNameInput').value.trim();
    if(!displayName){ showAuthMsg('Enter a name.', 'error'); return; }
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if(error){ showAuthMsg(error.message, 'error'); return; }
    if(data.user){
      await supabaseClient.from('profiles').upsert({ id: data.user.id, display_name: displayName });
    }
    if(data.session){ onAuthed(data.user); }
    else { showAuthMsg('Account created. Check your email to confirm, then sign in.', 'info'); }
  } else {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ showAuthMsg(error.message, 'error'); return; }
    onAuthed(data.user);
  }
});

/* ---------- STUDY HELPERS ---------- */
function dayTotal(userId, dateKey){
  const u = allEntries[userId];
  if(!u || !u[dateKey]) return 0;
  return Object.values(u[dateKey]).reduce((a,b)=>a+Number(b),0);
}
function computeStreak(userId){
  let streak = 0; let d = new Date();
  if(!(dayTotal(userId, todayStr(d)) >= GOAL)) d.setDate(d.getDate()-1);
  while(true){
    const key = todayStr(d);
    if(dayTotal(userId, key) >= GOAL){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function computeWeekTotal(userId){
  const now = new Date(); const day = now.getDay();
  const mondayOffset = day === 0 ? 6 : day - 1;
  const monday = new Date(now); monday.setDate(now.getDate() - mondayOffset);
  let sum = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d > now) break;
    sum += dayTotal(userId, todayStr(d));
  }
  return sum;
}
function computeTotal(userId){
  const u = allEntries[userId];
  if(!u) return 0;
  return Object.keys(u).reduce((a,k)=>a+dayTotal(userId,k),0);
}
function levelFor(hours){
  if(!hours) return '';
  if(hours >= GOAL) return 'hit';
  if(hours >= GOAL*0.66) return 'l3';
  if(hours >= GOAL*0.33) return 'l2';
  if(hours > 0) return 'l1';
  return '';
}

/* ---------- DATA LOAD ---------- */
async function loadAllData(){
  const { data: profileRows } = await supabaseClient.from('profiles').select('*');
  profiles = {};
  (profileRows||[]).forEach(p => profiles[p.id] = p.display_name);

  const { data: entryRows } = await supabaseClient.from('study_entries').select('*');
  allEntries = {};
  (entryRows||[]).forEach(row=>{
    if(!allEntries[row.user_id]) allEntries[row.user_id] = {};
    allEntries[row.user_id][row.entry_date] = row.activities || {};
  });

  const { data: bookRows } = await supabaseClient.from('books').select('*').order('created_at', {ascending:false});
  allBooks = {};
  (bookRows||[]).forEach(b=>{
    if(!allBooks[b.user_id]) allBooks[b.user_id] = [];
    allBooks[b.user_id].push(b);
  });

  const { data: jobRows } = await supabaseClient.from('job_applications').select('*').order('created_at', {ascending:false});
  allJobs = {};
  (jobRows||[]).forEach(j=>{
    if(!allJobs[j.user_id]) allJobs[j.user_id] = [];
    allJobs[j.user_id].push(j);
  });
}

async function upsertMyDay(dateVal, activities){
  await supabaseClient.from('study_entries').upsert(
    { user_id: currentUser.id, entry_date: dateVal, activities },
    { onConflict: 'user_id,entry_date' }
  );
}
async function deleteMyDay(dateVal){
  await supabaseClient.from('study_entries').delete().eq('user_id', currentUser.id).eq('entry_date', dateVal);
}

/* ---------- STUDY RENDER ---------- */
function renderLeaderboard(){
  const el = document.getElementById('leaderboard');
  el.innerHTML = '';
  const userIds = Object.keys(profiles);
  const rows = userIds.map(id=>({
    id, name: nameFor(id),
    streak: computeStreak(id), week: computeWeekTotal(id), total: computeTotal(id)
  })).sort((a,b)=> b.streak - a.streak || b.total - a.total);
  if(rows.length === 0){ el.innerHTML = '<div class="bd-empty">—</div>'; return; }
  rows.forEach((r,i)=>{
    const row = document.createElement('div');
    row.className = 'lb-row' + (r.id===currentUser.id ? ' me' : '');
    row.innerHTML =
      `<span class="lb-rank">${i+1}</span>` +
      `<span class="lb-name">${r.name}${r.id===currentUser.id ? '<span class="tag">YOU</span>' : ''}</span>` +
      `<span class="lb-stat">${r.streak}</span>` +
      `<span class="lb-stat">${fmt(r.week)}h</span>` +
      `<span class="lb-stat">${fmt(r.total)}h</span>`;
    el.appendChild(row);
  });
}
function renderCalendar(){
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const weeks = 12;
  const today = new Date();
  const end = new Date(today); end.setDate(end.getDate() + (6 - end.getDay()));
  const start = new Date(end); start.setDate(end.getDate() - weeks*7 + 1);
  for(let w=0; w<weeks; w++){
    const col = document.createElement('div'); col.className = 'cal-week';
    for(let d=0; d<7; d++){
      const date = new Date(start); date.setDate(start.getDate() + w*7 + d);
      const cell = document.createElement('div'); cell.className = 'cal-cell';
      if(date <= today){
        const key = todayStr(date);
        const hrs = dayTotal(currentUser.id, key);
        const lvl = levelFor(hrs);
        if(lvl) cell.classList.add(lvl);
        cell.title = key + ': ' + (hrs ? fmt(hrs) + ' hrs' : '—');
      } else { cell.style.visibility = 'hidden'; }
      col.appendChild(cell);
    }
    grid.appendChild(col);
  }
}
function renderBreakdown(){
  const container = document.getElementById('bdBars');
  container.innerHTML = '';
  const myEntries = allEntries[currentUser.id] || {};
  let dateKeys = Object.keys(myEntries);
  if(bdRange !== 'all'){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - Number(bdRange) + 1);
    dateKeys = dateKeys.filter(k => new Date(k) >= new Date(todayStr(cutoff)));
  }
  const totals = {}; ACTIVITIES.forEach(a => totals[a.key] = 0);
  dateKeys.forEach(k=>{
    Object.entries(myEntries[k]).forEach(([act,hrs])=>{ totals[act] = (totals[act]||0) + Number(hrs); });
  });
  const max = Math.max(...Object.values(totals), 0.001);
  const sorted = ACTIVITIES.slice().sort((a,b)=> totals[b.key]-totals[a.key]);
  const anyData = Object.values(totals).some(v=>v>0);
  if(!anyData){ container.innerHTML = '<div class="bd-empty">—</div>'; return; }
  sorted.forEach(a=>{
    const val = totals[a.key];
    const row = document.createElement('div'); row.className = 'bd-row';
    row.innerHTML =
      `<span class="bd-dot" style="background:${a.color}"></span>` +
      `<span class="bd-label">${actLabel(a.key)}</span>` +
      `<span class="bd-track"><span class="bd-fill" style="width:${(val/max*100).toFixed(1)}%;background:${a.color}"></span></span>` +
      `<span class="bd-val">${fmt(val)}h</span>`;
    container.appendChild(row);
  });
}
function chipHtml(dateKey, act, hrs, editable){
  const meta = ACT_MAP[act] || {color:'var(--c-other)'};
  const delBtn = editable ? `<button class="del" data-date="${dateKey}" data-act="${act}" title="Remove">✕</button>` : '';
  return `<span class="e-chip"><span class="dot" style="background:${meta.color}"></span>${actLabel(act)} ${fmt(hrs)}h${delBtn}</span>`;
}
function renderEntries(){
  const list = document.getElementById('entryList');
  list.innerHTML = '';
  const myEntries = allEntries[currentUser.id] || {};
  const dates = Object.keys(myEntries).sort((a,b)=> b.localeCompare(a)).slice(0,20);
  if(dates.length === 0){ list.innerHTML = '<li class="empty">—</li>'; return; }
  dates.forEach(key=>{
    const total = dayTotal(currentUser.id, key);
    const hit = total >= GOAL;
    const chips = Object.entries(myEntries[key]).sort((a,b)=>b[1]-a[1]).map(([act,hrs])=> chipHtml(key,act,hrs,true)).join('');
    const li = document.createElement('li');
    li.innerHTML =
      `<div class="e-top"><span class="e-date">${key}</span>` +
      `<span class="e-total ${hit?'hit':''}">${hit ? '<span class="e-seal">완</span>' : ''}${fmt(total)} hrs</span></div>` +
      `<div class="e-chips">${chips}</div>`;
    list.appendChild(li);
  });
  list.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const date = e.target.dataset.date; const act = e.target.dataset.act;
      const day = allEntries[currentUser.id][date];
      delete day[act];
      if(Object.keys(day).length === 0){ await deleteMyDay(date); delete allEntries[currentUser.id][date]; }
      else { await upsertMyDay(date, day); }
      renderAll();
    });
  });
}
function renderFeed(){
  const list = document.getElementById('feedList');
  list.innerHTML = '';
  const rows = [];
  Object.entries(allEntries).forEach(([userId, byDate])=>{
    Object.entries(byDate).forEach(([date, activities])=>{ rows.push({ userId, date, activities }); });
  });
  rows.sort((a,b)=> b.date.localeCompare(a.date));
  const top = rows.slice(0,15);
  if(top.length === 0){ list.innerHTML = '<li class="empty">—</li>'; return; }
  top.forEach(r=>{
    const total = Object.values(r.activities).reduce((a,b)=>a+Number(b),0);
    const hit = total >= GOAL;
    const chips = Object.entries(r.activities).sort((a,b)=>b[1]-a[1]).map(([act,hrs])=> chipHtml(r.date,act,hrs,false)).join('');
    const li = document.createElement('li');
    li.innerHTML =
      `<div class="e-top"><span><span class="e-who">${nameFor(r.userId)}</span><span class="e-date">${r.date}</span></span>` +
      `<span class="e-total ${hit?'hit':''}">${hit ? '<span class="e-seal">완</span>' : ''}${fmt(total)} hrs</span></div>` +
      `<div class="e-chips">${chips}</div>`;
    list.appendChild(li);
  });
}

async function addBook(){
  const title = document.getElementById('bookTitle').value.trim();
  const author = document.getElementById('bookAuthor').value.trim();
  const status = document.getElementById('bookStatus').value;
  const pages = parseInt(document.getElementById('bookPages').value) || null;
  if(!title) return;
  const row = { user_id: currentUser.id, title, author: author || null, status, total_pages: pages, pages_read: status==='finished' ? pages : 0, finished_at: status==='finished' ? todayStr() : null };
  const { data, error } = await supabaseClient.from('books').insert(row).select();
  if(!error && data){
    if(!allBooks[currentUser.id]) allBooks[currentUser.id] = [];
    allBooks[currentUser.id].unshift(data[0]);
  }
  document.getElementById('bookTitle').value = '';
  document.getElementById('bookAuthor').value = '';
  document.getElementById('bookPages').value = '';
  renderReading();
}
async function updateBookStatus(bookId, status){
  const patch = { status };
  if(status === 'finished') patch.finished_at = todayStr();
  await supabaseClient.from('books').update(patch).eq('id', bookId);
  const b = (allBooks[currentUser.id]||[]).find(x=>x.id===bookId);
  if(b){ b.status = status; if(status==='finished') b.finished_at = todayStr(); }
  renderReading();
}
async function updateBookPages(bookId, pages){
  await supabaseClient.from('books').update({ pages_read: pages }).eq('id', bookId);
  const b = (allBooks[currentUser.id]||[]).find(x=>x.id===bookId);
  if(b) b.pages_read = pages;
  renderReading();
}
async function deleteBook(bookId){
  await supabaseClient.from('books').delete().eq('id', bookId);
  allBooks[currentUser.id] = (allBooks[currentUser.id]||[]).filter(x=>x.id!==bookId);
  renderReading();
}
document.getElementById('addBookBtn').addEventListener('click', addBook);

function renderReading(){
  const mine = allBooks[currentUser.id] || [];
  document.getElementById('rStatReading').textContent = mine.filter(b=>b.status==='reading').length;
  document.getElementById('rStatToRead').textContent = mine.filter(b=>b.status==='to_read').length;
  document.getElementById('rStatFinished').textContent = mine.filter(b=>b.status==='finished').length;

  const list = document.getElementById('bookList');
  list.innerHTML = '';
  if(mine.length === 0){ list.innerHTML = '<div class="empty">—</div>'; }
  const order = {reading:0, to_read:1, finished:2};
  mine.slice().sort((a,b)=> order[a.status]-order[b.status]).forEach(b=>{
    const div = document.createElement('div');
    div.className = 'item-row';
    let progressHtml = '';
    if(b.status === 'reading' && b.total_pages){
      const pct = Math.min(100, ((b.pages_read||0)/b.total_pages*100)).toFixed(0);
      progressHtml = `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    }
    div.innerHTML =
      `<div class="item-top">
        <div><div class="item-title">${b.title}</div><div class="item-sub">${b.author || ''}</div></div>
        <button class="item-del" data-id="${b.id}" data-kind="book" title="Delete">✕</button>
      </div>
      <div class="item-meta">
        <span class="badge ${b.status}">${bookStatusLabel(b.status)}</span>
        <select data-id="${b.id}" class="book-status-select">
          <option value="to_read" ${b.status==='to_read'?'selected':''}>${bookStatusLabel('to_read')}</option>
          <option value="reading" ${b.status==='reading'?'selected':''}>${bookStatusLabel('reading')}</option>
          <option value="finished" ${b.status==='finished'?'selected':''}>${bookStatusLabel('finished')}</option>
        </select>
        ${b.total_pages ? `<input type="number" class="book-pages-input" data-id="${b.id}" min="0" max="${b.total_pages}" value="${b.pages_read||0}" title="Pages read"> / ${b.total_pages}p` : ''}
      </div>
      ${progressHtml}`;
    list.appendChild(div);
  });

  list.querySelectorAll('.item-del[data-kind="book"]').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteBook(btn.dataset.id));
  });
  list.querySelectorAll('.book-status-select').forEach(sel=>{
    sel.addEventListener('change', ()=> updateBookStatus(sel.dataset.id, sel.value));
  });
  list.querySelectorAll('.book-pages-input').forEach(inp=>{
    inp.addEventListener('change', ()=> updateBookPages(inp.dataset.id, parseInt(inp.value)||0));
  });

  const lb = document.getElementById('bookLeaderboard');
  lb.innerHTML = '';
  const rows = Object.keys(profiles).map(id=>({
    id, name: nameFor(id), finished: (allBooks[id]||[]).filter(b=>b.status==='finished').length
  })).sort((a,b)=> b.finished - a.finished);
  if(rows.length === 0){ lb.innerHTML = '<div class="bd-empty">—</div>'; }
  rows.forEach((r,i)=>{
    const row = document.createElement('div');
    row.className = 'lb-row-simple' + (r.id===currentUser.id ? ' me' : '');
    row.innerHTML = `<span class="lb-rank">${i+1}</span><span class="lb-name">${r.name}${r.id===currentUser.id?'<span class="tag">YOU</span>':''}</span><span class="lb-stat">${r.finished}</span>`;
    lb.appendChild(row);
  });
}

/* ---------- JOBS ---------- */
async function addJob(){
  const company = document.getElementById('jobCompany').value.trim();
  const role = document.getElementById('jobRole').value.trim();
  const status = document.getElementById('jobStatus').value;
  const dateApplied = document.getElementById('jobDate').value || todayStr();
  const link = document.getElementById('jobLink').value.trim();
  if(!company) return;
  const row = { user_id: currentUser.id, company, role: role || null, status, date_applied: dateApplied, link: link || null };
  const { data, error } = await supabaseClient.from('job_applications').insert(row).select();
  if(!error && data){
    if(!allJobs[currentUser.id]) allJobs[currentUser.id] = [];
    allJobs[currentUser.id].unshift(data[0]);
  }
  document.getElementById('jobCompany').value = '';
  document.getElementById('jobRole').value = '';
  document.getElementById('jobLink').value = '';
  renderJobs();
}
async function updateJobStatus(jobId, status){
  await supabaseClient.from('job_applications').update({ status }).eq('id', jobId);
  const j = (allJobs[currentUser.id]||[]).find(x=>x.id===jobId);
  if(j) j.status = status;
  renderJobs();
}
async function deleteJob(jobId){
  await supabaseClient.from('job_applications').delete().eq('id', jobId);
  allJobs[currentUser.id] = (allJobs[currentUser.id]||[]).filter(x=>x.id!==jobId);
  renderJobs();
}
document.getElementById('addJobBtn').addEventListener('click', addJob);

function renderJobs(){
  const mine = allJobs[currentUser.id] || [];
  document.getElementById('jStatApplied').textContent = mine.filter(j=>j.status==='applied').length;
  document.getElementById('jStatInterview').textContent = mine.filter(j=>j.status==='interview').length;
  document.getElementById('jStatOffer').textContent = mine.filter(j=>j.status==='offer').length;
  document.getElementById('jStatRejected').textContent = mine.filter(j=>j.status==='rejected').length;

  const list = document.getElementById('jobList');
  list.innerHTML = '';
  if(mine.length === 0){ list.innerHTML = '<div class="empty">—</div>'; }
  mine.slice().sort((a,b)=> (b.date_applied||'').localeCompare(a.date_applied||'')).forEach(j=>{
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML =
      `<div class="item-top">
        <div><div class="item-title">${j.company}</div><div class="item-sub">${j.role || ''} ${j.date_applied ? '· ' + j.date_applied : ''}</div></div>
        <button class="item-del" data-id="${j.id}" data-kind="job" title="Delete">✕</button>
      </div>
      <div class="item-meta">
        <span class="badge ${j.status}">${jobStatusLabel(j.status)}</span>
        <select data-id="${j.id}" class="job-status-select">
          <option value="applied" ${j.status==='applied'?'selected':''}>${jobStatusLabel('applied')}</option>
          <option value="interview" ${j.status==='interview'?'selected':''}>${jobStatusLabel('interview')}</option>
          <option value="offer" ${j.status==='offer'?'selected':''}>${jobStatusLabel('offer')}</option>
          <option value="rejected" ${j.status==='rejected'?'selected':''}>${jobStatusLabel('rejected')}</option>
          <option value="withdrawn" ${j.status==='withdrawn'?'selected':''}>${jobStatusLabel('withdrawn')}</option>
        </select>
        ${j.link ? `<a href="${j.link}" target="_blank" rel="noopener">${t('linkOpen')}</a>` : ''}
      </div>`;
    list.appendChild(div);
  });

  list.querySelectorAll('.item-del[data-kind="job"]').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteJob(btn.dataset.id));
  });
  list.querySelectorAll('.job-status-select').forEach(sel=>{
    sel.addEventListener('change', ()=> updateJobStatus(sel.dataset.id, sel.value));
  });

  const lb = document.getElementById('jobLeaderboard');
  lb.innerHTML = '';
  const rows = Object.keys(profiles).map(id=>({
    id, name: nameFor(id), count: (allJobs[id]||[]).length
  })).sort((a,b)=> b.count - a.count);
  if(rows.length === 0){ lb.innerHTML = '<div class="bd-empty">—</div>'; }
  rows.forEach((r,i)=>{
    const row = document.createElement('div');
    row.className = 'lb-row-simple' + (r.id===currentUser.id ? ' me' : '');
    row.innerHTML = `<span class="lb-rank">${i+1}</span><span class="lb-name">${r.name}${r.id===currentUser.id?'<span class="tag">YOU</span>':''}</span><span class="lb-stat">${r.count}</span>`;
    lb.appendChild(row);
  });
}

/* ---------- GLOBAL RENDER ---------- */
function renderAll(){
  renderLeaderboard();
  renderCalendar();
  renderBreakdown();
  renderEntries();
  renderFeed();
  renderReading();
  renderJobs();
}

function initForm(){
  document.getElementById('dateInput').value = todayStr();
  document.getElementById('jobDate').value = todayStr();
}

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const dateVal = document.getElementById('dateInput').value;
  const actVal = document.getElementById('activityInput').value;
  const hoursVal = parseFloat(document.getElementById('hoursInput').value);
  if(!dateVal || !actVal || isNaN(hoursVal) || hoursVal <= 0) return;
  if(!allEntries[currentUser.id]) allEntries[currentUser.id] = {};
  const day = allEntries[currentUser.id][dateVal] || {};
  day[actVal] = (day[actVal] || 0) + hoursVal;
  allEntries[currentUser.id][dateVal] = day;
  await upsertMyDay(dateVal, day);
  document.getElementById('hoursInput').value = '';
  renderAll();
});

document.getElementById('bdToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  bdRange = btn.dataset.range;
  document.querySelectorAll('#bdToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBreakdown();
});

(async function init(){
  initForm();
  applyLanguage(currentLang);
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){ await onAuthed(session.user); }
})();
</script>
