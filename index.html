<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productivity Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F7563">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Productivity Tracker">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.snow.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap');
:root{
  color-scheme: light;
  --paper:#F5F5F6;
  --paper-dim:#EAEAEC;
  --ink:#1E1F22;
  --ink-soft:#6B6D72;
  --celadon-1:#DCE7DA;
  --celadon-2:#AFC9AE;
  --celadon-3:#7FA694;
  --celadon-4:#4F7563;
  --seal:#B33B34;
  --seal-dark:#8C2C27;
  --line: rgba(30,31,34,0.12);
  --ink-hover:#000000;
  --c-listening:#6E8FB0;
  --c-speaking:#B37B4F;
  --c-reading:#7FA694;
  --c-writing:#9C7BB0;
  --c-grammar:#B0A46E;
  --c-vocabulary:#5C9E8C;
  --c-topik:#B33B34;
  --c-other:#8B8578;
}
body.dark{
  color-scheme: dark;
  --paper:#18191B;
  --paper-dim:#232427;
  --ink:#EDEDEF;
  --ink-soft:#9A9CA1;
  --celadon-1:#2E3A34;
  --celadon-2:#3C4F45;
  --line: rgba(237,237,239,0.14);
  --ink-hover:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Inter','Noto Sans KR',sans-serif;padding:32px 20px 60px;min-height:100vh;transition:background 0.2s,color 0.2s;}
.wrap{max-width:780px;margin:0 auto;}
.hidden{display:none !important;}
.topbar-controls{display:flex;gap:8px;align-items:center;}
.lang-switch{display:flex;gap:4px;background:var(--paper-dim);padding:4px;border-radius:8px;border:1px solid var(--line);}
.lang-switch button{background:transparent;color:var(--ink-soft);border:none;padding:5px 10px;font-size:11.5px;font-weight:600;border-radius:5px;}
.lang-switch button:hover{background:rgba(127,127,127,0.1);}
.lang-switch button.active{background:var(--ink);color:var(--paper);}
.lang-switch-select{background:var(--paper-dim);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;}
.icon-btn{background:var(--paper-dim);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:8px;font-size:14px;line-height:1;}
.icon-btn:hover{background:rgba(127,127,127,0.16);}
.auth-wrap{max-width:360px;margin:60px auto 0;}
.auth-topbar{display:flex;justify-content:flex-end;max-width:360px;margin:0 auto;}
.auth-card{background:var(--paper-dim);border:1px solid var(--line);border-radius:10px;padding:28px 26px;margin-top:14px;}
.auth-card h1{font-family:'Noto Serif KR',serif;font-size:24px;margin:0 0 4px;}
.auth-sub{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;}
.auth-tabs button{flex:1;background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:8px;font-size:13px;font-weight:600;}
.auth-tabs button.active{background:var(--ink);color:var(--paper);}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.auth-field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
.auth-field input{font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;}
.auth-field input:focus{outline:2px solid var(--celadon-3);outline-offset:1px;}
.auth-submit{width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
.auth-submit:disabled{opacity:0.65;cursor:default;}
.btn-spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:btn-spin 0.7s linear infinite;display:inline-block;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.linkbtn:disabled{opacity:0.45;cursor:default;text-decoration:none;}
.auth-msg .auth-msg-inner{font-size:13px;margin-top:12px;padding:10px 14px;border-radius:8px;font-weight:600;line-height:1.4;}
.auth-msg-inner.error{background:#F3D9D7;color:var(--seal-dark);border:1px solid var(--seal);border-left:4px solid var(--seal);}
.auth-msg-inner.info{background:var(--celadon-1);color:var(--celadon-4);border:1px solid var(--celadon-3);border-left:4px solid var(--celadon-3);}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:18px;gap:16px;flex-wrap:nowrap;}
h1{font-family:'Noto Serif KR',serif;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:0.5px;}
.sub{font-size:13px;color:var(--ink-soft);letter-spacing:0.3px;}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.who .name{font-size:13px;color:var(--ink-soft);}
.who button.textbtn{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:6px 12px;font-size:12px;font-weight:500;}
.who button.textbtn:hover{background:var(--paper-dim);color:var(--ink);}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.tabs button{flex:1;min-width:80px;background:var(--paper-dim);color:var(--ink-soft);border:1px solid var(--line);padding:10px;font-size:13px;font-weight:600;border-radius:8px;}
.tabs button:hover{background:rgba(127,127,127,0.22);}
.tabs button.active{background:var(--ink);color:var(--paper);}
.tabs button.active:hover{background:var(--ink);box-shadow:inset 0 0 0 2px var(--celadon-3);}
.card{background:var(--paper-dim);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:22px;}
.card h2{font-family:'Noto Serif KR',serif;font-size:15px;margin:0 0 14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.export-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:5px 10px;font-size:11px;font-weight:600;border-radius:6px;}
.export-btn:hover{background:var(--paper);color:var(--ink);}
.list-controls{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap;}
.page-btn{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:6px 10px;font-size:12px;font-weight:600;border-radius:5px;min-width:32px;}
.page-btn.active{background:var(--ink);color:var(--paper);}
.page-btn:disabled{opacity:0.35;cursor:default;}
.show-more-btn{width:100%;background:none;border:1px dashed var(--line);color:var(--ink-soft);padding:10px;font-size:12.5px;font-weight:600;border-radius:6px;margin-top:10px;}
.show-more-btn:hover{background:var(--paper);color:var(--ink);}
.lb-row{display:grid;grid-template-columns:22px 1fr 60px 70px 70px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:rgba(127,166,148,0.12);border-radius:6px;padding:10px 0;}
.lb-rank{color:var(--ink-soft);font-family:'Space Grotesk',monospace;}
.lb-name{font-weight:600;}
.tag{font-size:10px;color:var(--celadon-4);font-weight:700;margin-left:5px;text-transform:uppercase;letter-spacing:0.3px;}
.tag.admin-tag{color:var(--ink-soft);text-transform:none;}
.lb-name .lb-hidden-tag{font-size:10px;color:var(--ink-soft);font-weight:600;margin-left:5px;}
.lb-stat{text-align:right;font-family:'Space Grotesk',monospace;}
.lb-head{display:grid;grid-template-columns:22px 1fr 60px 70px 70px;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line);}
.lb-head span:not(:first-child):not(:nth-child(2)){text-align:right;}
.lb-row-simple{display:grid;grid-template-columns:22px 1fr 70px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.lb-row-simple:last-child{border-bottom:none;}
.lb-row-simple.me{background:rgba(127,166,148,0.12);border-radius:6px;padding:10px 0;}
.lb-head-simple{display:grid;grid-template-columns:22px 1fr 70px;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line);}
.lb-head-simple span:last-child{text-align:right;}
.log-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
.field input, .field select, .field textarea{font-family:'Space Grotesk',monospace;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:150px;}
.field input[type="checkbox"], .field input[type="radio"]{width:16px !important;height:16px !important;min-width:16px;min-height:16px;padding:0 !important;margin:0;border-radius:3px;flex-shrink:0;}
.field.wide input, .field.wide textarea{width:220px;}
.field select{font-family:'Inter',sans-serif;font-size:14px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--celadon-3);outline-offset:1px;}
button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:10px 20px;border:none;border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer;}
button:hover{background:var(--ink-hover);}
.hint{font-size:12px;color:var(--ink-soft);margin-top:10px;}
.cal{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;}
.cal-week{display:flex;flex-direction:column;gap:4px;}
.cal-cell{width:15px;height:15px;border-radius:3px;background:var(--paper);border:1px solid var(--line);position:relative;}
.cal-cell.l1{background:var(--celadon-1);border-color:transparent;}
.cal-cell.l2{background:var(--celadon-2);border-color:transparent;}
.cal-cell.l3{background:var(--celadon-3);border-color:transparent;}
.cal-cell.hit{background:var(--celadon-4);border-color:transparent;}
.cal-cell.hit::after{content:'';position:absolute;inset:-2px;border:1.5px solid var(--seal);border-radius:4px;transform:rotate(-6deg);opacity:0.9;}
.cal-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);margin-top:10px;flex-wrap:wrap;}
.cal-legend .cal-cell{width:12px;height:12px;}
.bd-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
.bd-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.bd-label{width:88px;flex-shrink:0;color:var(--ink-soft);}
.bd-track{flex:1;background:var(--paper);border-radius:4px;overflow:hidden;height:14px;border:1px solid var(--line);}
.bd-fill{height:100%;border-radius:3px 0 0 3px;}
.bd-val{width:48px;text-align:right;font-family:'Space Grotesk',monospace;font-weight:600;flex-shrink:0;}
.bd-toggle{display:flex;gap:8px;margin-bottom:14px;}
.bd-toggle button{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:5px 12px;font-size:12px;font-weight:500;}
.bd-toggle button.active{background:var(--ink);color:var(--paper);}
.bd-empty{color:var(--ink-soft);font-size:13px;}
.entries{list-style:none;margin:0;padding:0;}
.entries li{padding:12px 0;border-bottom:1px solid var(--line);}
.entries li:last-child{border-bottom:none;}
.e-top{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px;}
.e-date{font-family:'Space Grotesk',monospace;color:var(--ink-soft);}
.e-who{font-size:11px;background:var(--celadon-1);color:var(--celadon-4);padding:2px 8px;border-radius:10px;font-weight:800;margin-right:8px;}
.e-total{font-family:'Space Grotesk',monospace;font-weight:700;}
.e-total.hit{color:var(--seal);}
.e-seal{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--seal);border-radius:4px;color:var(--seal);font-family:'Noto Serif KR',serif;font-size:10px;font-weight:700;transform:rotate(-5deg);margin-right:5px;}
.e-chips{display:flex;flex-wrap:wrap;gap:6px;}
.e-chip{display:flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px 9px 3px 7px;font-size:11.5px;}
.e-chip .dot{width:7px;height:7px;border-radius:50%;}
.e-chip .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0 0 0 3px;line-height:1;}
.e-chip .del:hover{color:var(--seal);}
.empty{color:var(--ink-soft);font-size:13px;padding:10px 0;}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:0;}
.stat-mini{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 16px;text-align:center;flex:1;min-width:110px;}
.stat-mini .num{font-family:'Space Grotesk',monospace;font-size:18px;font-weight:700;color:var(--celadon-4);}
.stat-mini .label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-top:3px;}
.stat-mini.urgent .num{color:var(--seal);}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;}
.badge.applied, .badge.to_read{background:var(--ink-soft);}
.badge.interview, .badge.reading{background:var(--celadon-3);color:var(--ink);}
.badge.offer, .badge.finished{background:var(--celadon-4);}
.badge.rejected{background:var(--seal);}
.badge.withdrawn{background:#B0A79A;color:var(--ink);}
.item-row{padding:14px 0;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.item-title{font-weight:600;font-size:14.5px;}
.item-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
.item-meta select{font-family:'Inter',sans-serif;font-size:12px;padding:5px 8px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
.item-meta input[type=number]{width:70px;font-family:'Space Grotesk',monospace;font-size:12px;padding:5px 7px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
.item-meta a{font-size:12px;color:var(--celadon-4);}
.linkbtn{background:none;border:none;color:var(--celadon-4);font-size:12px;padding:0;text-decoration:underline;font-weight:600;cursor:pointer;}
.item-meta .linkbtn{background:none;border:none;color:var(--celadon-4);font-size:12px;padding:0;text-decoration:underline;font-weight:600;}
.item-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;}
.item-del:hover{color:var(--seal);}
.progress-track{background:var(--paper);border:1px solid var(--line);border-radius:4px;height:8px;overflow:hidden;margin-top:6px;width:160px;}
.progress-fill{height:100%;background:var(--celadon-3);}
.notes-panel{margin-top:10px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;}
.note-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.note-item:last-child{border-bottom:none;}
.note-item .note-page{font-size:10.5px;color:var(--ink-soft);margin-bottom:2px;}
.note-item .note-del{float:right;background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;}
.note-add{display:flex;gap:6px;margin-top:8px;align-items:flex-end;flex-wrap:wrap;}
.note-add textarea{flex:1;min-width:160px;height:44px;resize:vertical;font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper-dim);color:var(--ink);}
.note-add input{width:60px;font-family:'Space Grotesk',monospace;font-size:12px;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--paper-dim);color:var(--ink);}
.note-add button{padding:8px 14px;font-size:12px;}
.topik-row{display:flex;gap:14px;flex-wrap:wrap;}
.topik-box{flex:1;min-width:180px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.topik-box .tlabel{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:6px;}
.topik-box .tval{font-family:'Space Grotesk',monospace;font-size:22px;font-weight:700;color:var(--seal);}
.topik-box .tdate{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.deadline-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:10px;}
.deadline-row:last-child{border-bottom:none;}
.deadline-left{display:flex;flex-direction:column;align-items:flex-start;}
.deadline-title{font-weight:600;}
.deadline-notes{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.deadline-right{display:flex;align-items:center;gap:10px;}
.deadline-days{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--celadon-4);}
.deadline-days.soon{color:var(--seal);}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.month-nav button{padding:6px 12px;font-size:13px;}
.month-nav .month-label{font-family:'Space Grotesk',monospace;font-weight:700;font-size:14px;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.month-dow{font-size:10px;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
.month-day{min-height:64px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:11px;padding:4px;position:relative;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.month-day.today{border-color:var(--celadon-4);border-width:2px;}
.month-day .dnum{font-family:'Space Grotesk',monospace;flex-shrink:0;}
.month-day .chip-stack{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.month-day .event-chip{font-size:8.5px;line-height:1.3;padding:1px 4px;border-radius:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.month-day .event-chip.topik{background:var(--seal);color:#fff;}
.chip-bell{cursor:pointer;margin-right:2px;filter:brightness(1.4);}
.chip-bell:hover{transform:scale(1.15);}
.chip-edit{cursor:pointer;margin-right:2px;filter:brightness(1.4);}
.chip-edit:hover{transform:scale(1.15);}
.event-chip{position:relative;padding-right:12px !important;}
.chip-initial{position:absolute;top:1px;right:1px;font-size:6.5px;min-width:9px;height:9px;line-height:9px;padding:0 2px;text-align:center;border-radius:5px;background:rgba(255,255,255,0.4);color:inherit;font-weight:800;box-sizing:border-box;}
.month-day .more-count{font-size:8px;color:var(--ink-soft);}
.month-day.empty{visibility:hidden;}
.cal-view-toggle{display:flex;gap:8px;margin-bottom:12px;}
.cal-view-toggle button{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);padding:6px 14px;font-size:12px;font-weight:600;border-radius:6px;}
.cal-view-toggle button.active{background:var(--ink);color:var(--paper);}
.week-grid-wrap{margin-top:4px;}
.week-header-row{display:flex;}
.week-corner{width:44px;flex-shrink:0;}
.week-day-header{flex:1;text-align:center;font-size:11px;font-weight:700;padding:6px 2px;border-left:1px solid var(--line);color:var(--ink-soft);}
.week-day-header.today{color:var(--celadon-4);}
.week-header-topik{margin-top:3px;font-size:8.5px;font-weight:700;background:var(--seal);color:#fff;border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.week-body-scroll{max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:0 0 8px 8px;}
.week-body{display:flex;}
.week-label-col{width:44px;flex-shrink:0;}
.week-hour-label{font-size:9.5px;color:var(--ink-soft);text-align:right;padding-right:4px;box-sizing:border-box;border-top:1px solid var(--line);}

.week-event-bar{position:absolute;left:2px;right:2px;border-radius:4px;font-size:10px;padding:2px 4px;overflow:hidden;cursor:pointer;line-height:1.2;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.week-bar-initial{position:absolute;top:2px;right:2px;font-size:8px;min-width:12px;height:12px;line-height:12px;padding:0 3px;text-align:center;border-radius:6px;background:rgba(255,255,255,0.4);color:inherit;font-weight:800;box-sizing:border-box;}
.deadline-color{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block;margin-right:7px;}
.field input[type=color]{padding:2px;width:44px;height:38px;cursor:pointer;}
.ql-toolbar.ql-snow{border-color:var(--line) !important;background:var(--paper-dim);border-radius:8px 8px 0 0;}
.ql-container.ql-snow{border-color:var(--line) !important;border-radius:0 0 8px 8px;min-height:220px;font-size:14px;}
#quillContainer .ql-editor{color:var(--note-author-color, var(--ink));background:transparent !important;min-height:220px;}
#writingQuillContainer .ql-editor{color:var(--writing-author-color, var(--ink));background:transparent !important;min-height:220px;max-height:min(46vh, 460px);overflow-y:auto;}
#writingMockQ53QuillContainer .ql-editor, #writingMockQ54QuillContainer .ql-editor{color:var(--writing-author-color, var(--ink));background:transparent !important;min-height:220px;max-height:min(40vh, 400px);overflow-y:auto;}
/* Only the "head" (title + task prompt) needs its height matched between
   the two columns. Plain flexbox with the default align-items:stretch does
   this natively — the taller head's height becomes the row height, and each
   task box (flex:1 inside its own column-flex head) grows to absorb the
   extra space, with the title staying its natural size. No grid/subgrid
   involved, so there's nothing here that can force the row wider than the
   card (min-width:0 on the flex items still guards against that).
   The "body" (editor, char count, save button) is a completely separate,
   plain 2-column flex row with no stretching at all, so the Quill editor
   and the buttons below it keep their normal block-flow sizing/stacking
   and are never affected by the head's layout. */
.writing-mock-head-row{display:flex;gap:16px;align-items:stretch;margin-top:10px;}
.writing-mock-pane-head{min-width:0;flex:1 1 0;display:flex;flex-direction:column;}
.writing-mock-pane-head h3{font-size:13px;margin:0 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;flex:0 0 auto;}
.writing-mock-pane-head .writing-task-box{flex:1 1 auto;margin-top:0;}
.writing-mock-grid{display:flex;gap:16px;margin-top:16px;align-items:flex-start;}
.writing-mock-pane{min-width:0;flex:1 1 0;}
@media (max-width: 900px){
  .writing-mock-head-row{flex-direction:column;}
  .writing-mock-grid{flex-direction:column;}
}
@media (max-width: 640px){
  /* Everything above the header's black divider line gets smaller on
     mobile so the title, tagline, language control, and account controls
     all fit comfortably without crowding or wrapping awkwardly. */

  header .sub{font-size:10.5px;}
  header{padding-bottom:10px;margin-bottom:14px;gap:8px;}
  .who{gap:6px;justify-content:flex-end;}

  .lang-switch-select{font-size:11px;padding:5px 6px;}
}

// Builds the name cell for a leaderboard row: your own name gets the "YOU"
// tag, plus a muted "(hidden from others)" note if you've turned on the
// hide-from-leaderboards setting — so you can always see your own rank/stats
// (and your core partner still sees you too), and it's clear at a glance
// that strangers currently can't.
function lbNameCell(r){
  const isMe = currentUser && r.id === currentUser.id;
  const youTag = isMe ? '<span class="tag">YOU</span>' : '';

}

/* ---------- GENERALIZED LINKING ---------- */
// Kristoffer & Roxy stay on the separate hardcoded coreMembers/amICore path
// (unchanged, always full sharing). Everyone else can link up via
// link_group_members/link_sharing_settings — see link_groups_migration.sql.
function myLinkRow(){ return currentUser ? linkGroupRows.find(r=>r.user_id===currentUser.id) : null; }
function myLinkStatus(){ const r = myLinkRow(); return r ? r.status : 'none'; }
// Everyone accepted in my group besides me.
function linkedPartnerIds(){
  const mine = myLinkRow();
  if(!mine || mine.status !== 'accepted') return [];
  return linkGroupRows.filter(r=> r.group_id===mine.group_id && r.status==='accepted' && r.user_id!==currentUser.id).map(r=>r.user_id);
}
// Roster of everyone in my group (any status), besides me.
function linkGroupRoster(){
  const mine = myLinkRow();
  if(!mine) return [];
  return linkGroupRows.filter(r=> r.group_id===mine.group_id && r.user_id!==currentUser.id);
}
// Does `uid` currently share `category` with me specifically? Checks their
// per-partner override for me first, then their own default, then true —
// mirrors shared_circle_cat()'s SQL precedence exactly.
function isSharingWithMe(uid, category){
  if(!currentUser) return true;
  const override = linkSharingRows.find(r=> r.user_id===uid && r.target_user_id===currentUser.id && r.category===category);
  if(override) return !!override.enabled;
  const def = linkSharingRows.find(r=> r.user_id===uid && r.target_user_id===uid && r.category===category);
  if(def) return !!def.enabled;
  return true;
}
// My own default setting for a category (applies to anyone I link with who
// doesn't have a specific override). This is what the top-level "What
// you're sharing" checkboxes read/write.
function mySharingSetting(category){
  if(!currentUser) return true;
  const row = linkSharingRows.find(r=> r.user_id===currentUser.id && r.target_user_id===currentUser.id && r.category===category);
  return row ? !!row.enabled : true;
}
// My per-partner override for a specific linked person, falling back to my
// default when no override exists yet (what the gear-icon panel shows).
function mySharingSettingFor(targetUid, category){
  if(!currentUser) return true;
  const override = linkSharingRows.find(r=> r.user_id===currentUser.id && r.target_user_id===targetUid && r.category===category);
  if(override) return !!override.enabled;
  return mySharingSetting(category);
}
// True if I have ANY per-category override saved for this specific person
// (as opposed to just following my default) — drives the "Reset to
// default" button in their gear panel.
function myHasAnyOverrideFor(targetUid){
  return linkSharingRows.some(r=> r.user_id===currentUser.id && r.target_user_id===targetUid);
}
// Combined "who else can I see [category] data for" list: hardcoded core
// partner (always, no toggle) plus any linked partners who haven't turned
// that category off.
function visiblePartnersFor(category){
  const ids = new Set();
  if(amICore()) Object.keys(profiles).filter(uid=>coreMembers[uid] && uid!==currentUser.id).forEach(uid=>ids.add(uid));
  linkedPartnerIds().filter(uid=> isSharingWithMe(uid, category)).forEach(uid=>ids.add(uid));
  return Array.from(ids);
}
// For tables gated by the blanket shared_circle() (no per-category toggle,
// e.g. notebook_notes): core partner (always) + any linked partner
// (linking itself is the opt-in; there's no finer per-category control).
function visibleCircleMembers(){
  const ids = new Set();
  if(amICore()) Object.keys(profiles).filter(uid=>coreMembers[uid] && uid!==currentUser.id).forEach(uid=>ids.add(uid));
  linkedPartnerIds().forEach(uid=>ids.add(uid));
  return Array.from(ids);
}

function buildLangSwitch(container){
  container.innerHTML = '';
  const langs = [['en','English'],['ko','한국어'],['vi','Tiếng Việt']];
  // On mobile the 3-button switch takes up too much header width, so it
  // collapses into a single dropdown there instead — same options, same
  // applyLanguage() call, just a different control.
  if(isMobileDevice()){
    const sel = document.createElement('select');
    sel.className = 'lang-switch-select';
    langs.forEach(([code,label])=>{
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = label;
      if(code === currentLang) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', (e)=> applyLanguage(e.target.value));
    container.appendChild(sel);
    return;
  }
  langs.forEach(([code,label])=>{
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.dataset.lang = code;
    if(code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', ()=> applyLanguage(code));
    container.appendChild(btn);
  });
}

// Disables the submit button and swaps in a spinner while a sign-in/sign-up
// request is in flight, so clicking "Create account" gives instant feedback
// instead of appearing to do nothing until the network call resolves.
function setAuthSubmitLoading(loading){
  const btn = document.getElementById('authSubmit');
  btn.disabled = loading;
  if(loading){
    const label = authMode==='signup' ? t('creatingAccountLabel') : t('signingInLabel');

// After a signup that requires email confirmation, arms a "Send again" link
// for the given address — hidden for 30s (to avoid spamming the mail
// provider / getting flagged), then becomes clickable.
function armResendConfirm(email){
  pendingConfirmEmail = email;
  const btn = document.getElementById('resendConfirmBtn');
  btn.textContent = t('resendConfirmBtn');
  btn.disabled = true;
  btn.classList.add('hidden');
  if(resendConfirmTimer) clearTimeout(resendConfirmTimer);
  resendConfirmTimer = setTimeout(()=>{
    btn.disabled = false;
    btn.classList.remove('hidden');
  }, 30000);
}
function hideResendConfirm(){
  pendingConfirmEmail = null;
  if(resendConfirmTimer){ clearTimeout(resendConfirmTimer); resendConfirmTimer = null; }
  document.getElementById('resendConfirmBtn').classList.add('hidden');
}
document.getElementById('resendConfirmBtn').addEventListener('click', async ()=>{
  if(!pendingConfirmEmail) return;
  const btn = document.getElementById('resendConfirmBtn');
  btn.disabled = true;
  const { error } = await supabaseClient.auth.resend({ type: 'signup', email: pendingConfirmEmail });
  if(error){ showAuthMsg(error.message, 'error'); btn.disabled = false; return; }
  showAuthMsg(t('resendConfirmSent'), 'info');
  armResendConfirm(pendingConfirmEmail);
});
document.getElementById('tabSignIn').addEventListener('click', ()=>setAuthMode('signin'));
document.getElementById('tabSignUp').addEventListener('click', ()=>setAuthMode('signup'));
document.getElementById('authSubmit').addEventListener('click', async ()=>{
  const rawInput = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if(!rawInput || !password){ showAuthMsg('Enter email and password.', 'error'); return; }
  setAuthSubmitLoading(true);
  try {
  if(authMode === 'signup'){
    const email = rawInput;
    const displayName = document.getElementById('displayNameInput').value.trim();
    if(!displayName){ showAuthMsg('Enter a name.', 'error'); return; }
    if(displayName.length > 12){ showAuthMsg(t('settingsNameTooLong'), 'error'); return; }
    const { data: available, error: availError } = await supabaseClient.rpc('display_name_available', { dname: displayName });
    if(!availError && available === false){ showAuthMsg(t('duplicateName'), 'error'); return; }
    // Note: the display name is NOT written to `profiles` here. Supabase
    // returns a user object as soon as signUp() is called even when email
    // confirmation is still pending (data.session is null in that case), so
    // writing the name immediately would let an abandoned/never-confirmed
    // signup permanently squat on it. Instead the name rides along as auth
    // metadata and only gets claimed in `profiles` once someone actually
    // completes a real, confirmed sign-in — see ensureProfileExists(), called
    // from onAuthed().
    const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { display_name: displayName } } });
    if(error){ showAuthMsg(error.message, 'error'); return; }
    if(data.session){ hideResendConfirm(); checkMfaAndProceed(data.user); }
    else { showAuthMsg(t('signupCheckEmail'), 'info'); armResendConfirm(email); }
  } else {
    let email = rawInput;
    if(!email.includes('@')){
      const { data: resolvedEmail, error: lookupError } = await supabaseClient.rpc('email_for_display_name', { dname: rawInput });
      if(lookupError || !resolvedEmail){ showAuthMsg('No account found with that name.', 'error'); return; }
      email = resolvedEmail;
    }
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ showAuthMsg(error.message, 'error'); return; }
    checkMfaAndProceed(data.user);
  }
  } finally {
    setAuthSubmitLoading(false);
  }
});

// If the account has an enrolled TOTP factor, a fresh password sign-in only
// grants aal1 — route through the MFA challenge screen before handing off to
// onAuthed(). Accounts with no factor enrolled sail straight through.
async function checkMfaAndProceed(user){
  const { data: aal } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2'){
    const { data: factorsData } = await supabaseClient.auth.mfa.listFactors();
    const factor = factorsData && factorsData.totp && factorsData.totp[0];
    if(factor){
      pendingMfaUser = user;
      pendingMfaFactorId = factor.id;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('resetScreen').classList.add('hidden');
      document.getElementById('mfaCodeInput').value = '';
      document.getElementById('mfaMsg').innerHTML = '';
      document.getElementById('mfaScreen').classList.remove('hidden');
      return;
    }
  }
  onAuthed(user);
}
document.getElementById('mfaVerifyBtn').addEventListener('click', async ()=>{
  const code = document.getElementById('mfaCodeInput').value.trim();
  if(!code || !pendingMfaFactorId) return;
  const { error } = await supabaseClient.auth.mfa.challengeAndVerify({ factorId: pendingMfaFactorId, code });
  if(error){
    document.getElementById('mfaMsg').innerHTML = `<div class="auth-msg-inner error">${t('mfaWrongCode')}</div>`;
    return;
  }
  const user = pendingMfaUser;
  pendingMfaUser = null;
  pendingMfaFactorId = null;
  document.getElementById('mfaScreen').classList.add('hidden');
  onAuthed(user);
});

// Claims this user's display name in `profiles` the first time they ever
// reach a real, confirmed session. Safe to call every sign-in — it's a
// no-op once the row exists. If the desired name got taken by someone else
// in the meantime (rare), falls back to a still-unique variant rather than
// blocking access to an account the person already proved they own.
async function ensureProfileExists(user){
  if(profiles[user.id]) return;
  const desiredName = (user.user_metadata && user.user_metadata.display_name) || (user.email||'').split('@')[0] || 'User';
  const { data: available } = await supabaseClient.rpc('display_name_available', { dname: desiredName });
  const finalName = available === false ? (desiredName + '-' + user.id.slice(0,4)) : desiredName;
  const { error } = await supabaseClient.from('profiles').upsert({ id: user.id, display_name: finalName });
  if(!error) profiles[user.id] = finalName;
}
async function onAuthed(user){
  currentUser = { id: user.id, email: user.email };
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('resetScreen').classList.add('hidden');
  document.getElementById('mfaScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  await loadAllData();
  await ensureProfileExists(user);
  rebuildForUserSelect();
  rebuildGramLevelFilterSelect();
  rebuildGramReviewedFilterSelect();
  rebuildCourseForUserSelect();
  document.getElementById('whoName').textContent = profiles[user.id] || user.email;
  document.getElementById('whoEmail').textContent = user.email;
  const myColor = colorForUser(user.id);
  document.getElementById('myColorPicker').value = myColor;
  document.getElementById('whoName').style.color = myColor;
  updateLinkNotifyDot();
  renderAll();

  // and laid out, which just happened above — re-run it now that it can
  // measure real offsets (the earlier call from applyLanguage(), while still
  // on the auth screen, was a no-op).
  reorderMobileTabs();
}

              <div class="hint" style="margin-bottom:6px;">${escapeHtml(t('linkOverrideHint').replace('{name}', nameFor(r.user_id)))}</div>
              ${LINK_CATEGORIES.map(cat=>{
                const enabled = mySharingSettingFor(r.user_id, cat);
                return `<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer;">
                  <input type="checkbox" class="link-partner-cat-toggle" data-uid="${r.user_id}" data-cat="${cat}" ${enabled?'checked':''} style="width:16px;height:16px;">
                  <span>${linkCatLabel(cat)}</span>

              }).join('')}
              ${myHasAnyOverrideFor(r.user_id) ? `<button id="linkResetOverridesBtn" data-uid="${r.user_id}" class="linkbtn" style="margin-top:4px;">${t('linkResetOverridesBtn')}</button>` : ''}
            </div>` : '';
          return rowHtml + panelHtml;
        }).join('')}
      </div>`;
  }
  if(mine && mine.status === 'accepted'){
    html += `<button id="linkLeaveBtn" style="margin-bottom:14px;">${t('linkLeaveBtn')}</button>`;
    const acceptedCount = roster.filter(r=>r.status==='accepted').length + 1;
    html += acceptedCount >= 10 ? `<div class="hint">${t('linkGroupFullMsg')}</div>` : linkInviteSearchHtml();
  } else if(!mine || mine.status === 'declined'){
    if(!hasAnyCircle){
      html += `<div class="hint" style="margin-bottom:8px;">${t('linkNotLinkedYet')}</div>`;
    }
    html += linkInviteSearchHtml();
  }
  el.innerHTML = html;
  bindLinkedCircleEvents();
}
function bindLinkedCircleEvents(){
  const acceptBtn = document.getElementById('linkAcceptBtn');
  if(acceptBtn) acceptBtn.addEventListener('click', async ()=>{
    acceptBtn.disabled = true;
    const { error } = await supabaseClient.rpc('link_accept_invite');
    if(error){ alert(error.message || t('linkErrorGeneric')); acceptBtn.disabled = false; return; }
    await refreshLinkData();
    renderLinkedCircle();
    renderRecap();
    renderGrammarReadiness();
  });
  const declineBtn = document.getElementById('linkDeclineBtn');
  if(declineBtn) declineBtn.addEventListener('click', async ()=>{
    declineBtn.disabled = true;
    const { error } = await supabaseClient.rpc('link_decline_invite');
    if(error){ alert(error.message || t('linkErrorGeneric')); declineBtn.disabled = false; return; }
    await refreshLinkData();
    renderLinkedCircle();
  });
  const leaveBtn = document.getElementById('linkLeaveBtn');
  if(leaveBtn) leaveBtn.addEventListener('click', async ()=>{
    if(!confirm(t('linkLeaveBtn') + '?')) return;
    leaveBtn.disabled = true;
    const { error } = await supabaseClient.rpc('link_leave_group');
    if(error){ alert(error.message || t('linkErrorGeneric')); leaveBtn.disabled = false; return; }
    await refreshLinkData();
    renderLinkedCircle();
    renderRecap();
    renderGrammarReadiness();
  });
  document.querySelectorAll('.link-cat-toggle').forEach(cb=>{
    cb.addEventListener('change', ()=> saveSharingSetting(currentUser.id, cb.dataset.cat, cb.checked));
  });
  document.querySelectorAll('.link-partner-gear').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const uid = btn.dataset.uid;
      linkOverridePanelOpenFor = (linkOverridePanelOpenFor === uid) ? null : uid;
      renderLinkedCircle();
    });
  });
  document.querySelectorAll('.link-partner-cat-toggle').forEach(cb=>{
    cb.addEventListener('change', ()=> saveSharingSetting(cb.dataset.uid, cb.dataset.cat, cb.checked));
  });
  const resetBtn = document.getElementById('linkResetOverridesBtn');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    const uid = resetBtn.dataset.uid;
    await supabaseClient.from('link_sharing_settings').delete()
      .eq('user_id', currentUser.id).eq('target_user_id', uid);
    linkSharingRows = linkSharingRows.filter(r=> !(r.user_id===currentUser.id && r.target_user_id===uid));
    renderLinkedCircle();
  });
  const searchInput = document.getElementById('linkInviteSearchInput');
  if(searchInput){
    let searchTimeout = null;
    searchInput.addEventListener('input', ()=>{
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async ()=>{
        const q = searchInput.value.trim();
        const resultsEl = document.getElementById('linkInviteResults');
        if(!resultsEl) return;
        if(q.length < 1){ resultsEl.innerHTML = ''; return; }
        const { data, error } = await supabaseClient.rpc('link_search_users', { query: q });
        if(error || !data || data.length === 0){
          resultsEl.innerHTML = `<div class="hint">${t('linkNoResults')}</div>`;
          return;
        }
        resultsEl.innerHTML = data.map(u=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;">
            <span>${escapeHtml(u.display_name || '')}</span>
            <button class="link-invite-send-btn" data-uid="${u.id}" style="font-size:12px;padding:5px 10px;">${t('linkInviteBtn')}</button>
          </div>`).join('');
        resultsEl.querySelectorAll('.link-invite-send-btn').forEach(btn=>{
          btn.addEventListener('click', async ()=>{
            btn.disabled = true;
            const { error: inviteErr } = await supabaseClient.rpc('link_invite', { invitee_id: btn.dataset.uid });
            if(inviteErr){ alert(inviteErr.message || t('linkErrorGeneric')); btn.disabled = false; return; }
            resultsEl.innerHTML = `<div class="hint">${t('linkInviteSentMsg')}</div>`;
            await refreshLinkData();
            renderLinkedCircle();
          });
        });
      }, 300);
    });
  }
}

async function refreshMfaStatus(){
  const { data, error } = await supabaseClient.auth.mfa.listFactors();
  const enrolled = !error && data && data.totp && data.totp.length > 0;
  const statusEl = document.getElementById('settings2faStatus');
  statusEl.textContent = enrolled ? t('settings2faStatusEnabled') : t('settings2faStatusDisabled');
  statusEl.style.color = enrolled ? 'var(--celadon-4)' : 'var(--seal)';
  document.getElementById('enable2faBtn').classList.toggle('hidden', enrolled);
  document.getElementById('disable2faBtn').classList.toggle('hidden', !enrolled);
  return enrolled;
}
document.getElementById('enable2faBtn').addEventListener('click', async ()=>{
  // Explicit issuer so the authenticator app always labels this "kristoffergt.com"
  // regardless of what the Supabase project's Site URL happens to be set to.
  const { data, error } = await supabaseClient.auth.mfa.enroll({ factorType: 'totp', issuer: 'kristoffergt.com' });
  if(error){
    console.error('mfa.enroll failed:', error);
    showSettingsMsg('settings2faMsg', t('settings2faEnrollFailed') + (error.message ? ' (' + error.message + ')' : ''), true);
    return;
  }
  mfaEnrollFactorId = data.id;
  document.getElementById('settings2faQrImg').src = data.totp.qr_code;
  document.getElementById('settings2faSecretText').textContent = data.totp.secret;
  document.getElementById('settings2faCodeInput').value = '';
  document.getElementById('settings2faEnrollPanel').classList.remove('hidden');
});
document.getElementById('cancel2faEnrollBtn').addEventListener('click', async ()=>{
  if(mfaEnrollFactorId){
    await supabaseClient.auth.mfa.unenroll({ factorId: mfaEnrollFactorId });
    mfaEnrollFactorId = null;
  }
  document.getElementById('settings2faEnrollPanel').classList.add('hidden');
});
document.getElementById('confirm2faBtn').addEventListener('click', async ()=>{
  const code = document.getElementById('settings2faCodeInput').value.trim();
  if(!mfaEnrollFactorId || !code) return;
  const { error } = await supabaseClient.auth.mfa.challengeAndVerify({ factorId: mfaEnrollFactorId, code });
  if(error){ showSettingsMsg('settings2faMsg', t('settings2faInvalidCode'), true); return; }
  mfaEnrollFactorId = null;
  document.getElementById('settings2faEnrollPanel').classList.add('hidden');
  showSettingsMsg('settings2faMsg', t('settings2faEnabled'), false);
  await refreshMfaStatus();
});
document.getElementById('disable2faBtn').addEventListener('click', async ()=>{
  const { data } = await supabaseClient.auth.mfa.listFactors();
  const factors = (data && data.totp) || [];
  for(const f of factors){ await supabaseClient.auth.mfa.unenroll({ factorId: f.id }); }
  showSettingsMsg('settings2faMsg', t('settings2faDisabled'), false);
  await refreshMfaStatus();
});

let moderatorUsersCache = [];

function rebuildModeratorSortSelect(){

  list.innerHTML = '<div class="empty">—</div>';
  rebuildModeratorSortSelect();
  const { data, error } = await supabaseClient.rpc('admin_list_users');
  if(error){ list.innerHTML = `<div class="empty">${t('modActionFailed')}</div>`; return; }
  moderatorUsersCache = data || [];

function renderModeratorUserList(){
  const list = document.getElementById('moderatorUserList');
  const term = moderatorSearchTerm.trim().toLowerCase();
  let rows = moderatorUsersCache.filter(u=>{
    if(!term) return true;
    return (u.display_name||'').toLowerCase().includes(term) || (u.email||'').toLowerCase().includes(term);
  });
  // Kristoffer (the admin) always pins to the top, no matter the sort/search.
  const adminRows = rows.filter(u=> u.email === ADMIN_EMAIL);
  const rest = rows.filter(u=> u.email !== ADMIN_EMAIL);
  const sorters = {
    date: (a,b)=> new Date(a.created_at||0) - new Date(b.created_at||0),
    name: (a,b)=> (a.display_name||a.email||'').localeCompare(b.display_name||b.email||''),
    mfa: (a,b)=> (b.mfa_enrolled?1:0) - (a.mfa_enrolled?1:0),
    confirmed: (a,b)=> (a.email_confirmed?1:0) - (b.email_confirmed?1:0),
  };
  rest.sort(sorters[moderatorSortVal] || sorters.date);
  const finalRows = [...adminRows, ...rest];
  list.innerHTML = '';
  if(finalRows.length === 0){ list.innerHTML = '<div class="empty">—</div>'; return; }
  finalRows.forEach(u=>{
    const isSelf = u.id === currentUser.id;
    const isAdminRow = u.email === ADMIN_EMAIL;
    const nameColor = colorForUser(u.id);
    const confirmedColor = u.email_confirmed ? 'var(--celadon-4)' : 'var(--seal)';
    const mfaColor = u.mfa_enrolled ? 'var(--celadon-4)' : 'var(--seal)';
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div class="item-top">
        <div>
          <div class="item-title"><span style="color:${nameColor};">${escapeHtml(u.display_name || u.email)}</span> ${isSelf ? `<span class="tag">${t('modYou')}</span>` : ''}${isAdminRow ? `<span class="tag admin-tag">${t('modAdmin')}</span>` : ''}</div>
          <div class="item-sub">${escapeHtml(u.email)} · <span style="color:${confirmedColor};font-weight:600;">${u.email_confirmed ? t('modConfirmed') : t('modUnconfirmed')}</span> · <span style="color:${mfaColor};font-weight:600;">${u.mfa_enrolled ? t('modMfaOn') : t('modMfaOff')}</span>${u.created_at ? ' · ' + new Date(u.created_at).toLocaleDateString() : ''}</div>
        </div>
      </div>
      ${isAdminRow ? '' : `
      <div class="item-meta">
        <button class="linkbtn mod-reset-pw" data-id="${u.id}">${t('modResetPw')}</button>
        ${u.email_confirmed ? '' : `<button class="linkbtn mod-confirm-email" data-id="${u.id}">${t('modConfirmEmail')}</button>`}
        ${u.mfa_enrolled ? `<button class="linkbtn mod-disable-mfa" data-id="${u.id}">${t('modDisableMfa')}</button>` : ''}
        <button class="linkbtn mod-delete-user" data-id="${u.id}" style="color:var(--seal);">${t('modDeleteUser')}</button>
      </div>`}`;
    list.appendChild(row);
  });
  list.querySelectorAll('.mod-reset-pw').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('modConfirmResetPw'))) return;
      const pw = prompt(t('modNewPasswordPrompt'));
      if(!pw) return;
      const { error } = await supabaseClient.rpc('admin_reset_user_password', { target_user_id: btn.dataset.id, new_password: pw });
      alert(error ? t('modActionFailed') : t('modActionDone'));
    });
  });
  list.querySelectorAll('.mod-confirm-email').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('modConfirmConfirmEmail'))) return;
      const { error } = await supabaseClient.rpc('admin_confirm_user_email', { target_user_id: btn.dataset.id });
      if(error) alert(t('modActionFailed')); else loadModeratorUsers();
    });
  });
  list.querySelectorAll('.mod-disable-mfa').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('modConfirmDisableMfa'))) return;
      const { error } = await supabaseClient.rpc('admin_disable_user_mfa', { target_user_id: btn.dataset.id });
      if(error) alert(t('modActionFailed')); else loadModeratorUsers();
    });
  });
  list.querySelectorAll('.mod-delete-user').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('modConfirmDeleteUser'))) return;
      const { error } = await supabaseClient.rpc('admin_delete_user', { target_user_id: btn.dataset.id });
      if(error) alert(t('modActionFailed')); else loadModeratorUsers();
    });
  });
}

/* ---------- STUDY HELPERS ---------- */
function dayTotal(userId, dateKey){
  const u = allEntries[userId];
  if(!u || !u[dateKey]) return 0;
  return Object.values(u[dateKey]).reduce((a,b)=>a+Number(b),0);
}
function computeStreak(userId){
  const goal = goalFor(userId);
  let streak = 0; let d = new Date();
  if(!(dayTotal(userId, todayStr(d)) >= goal)) d.setDate(d.getDate()-1);
  while(true){
    const key = todayStr(d);
    if(dayTotal(userId, key) >= goal){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function computeWeekTotal(userId){
  const now = new Date(); const day = now.getDay();
  const mondayOffset = day === 0 ? 6 : day - 1;
  const monday = new Date(now); monday.setDate(now.getDate() - mondayOffset);
  let sum = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d > now) break;
    sum += dayTotal(userId, todayStr(d));
  }
  return sum;
}
function computeTotal(userId){
  const u = allEntries[userId];
  if(!u) return 0;
  return Object.keys(u).reduce((a,k)=>a+dayTotal(userId,k),0);
}
function levelFor(hours, goal){
  goal = goal || DEFAULT_GOAL;
  if(!hours) return '';
  if(hours >= goal) return 'hit';
  if(hours >= goal*0.66) return 'l3';
  if(hours >= goal*0.33) return 'l2';
  if(hours > 0) return 'l1';
  return '';
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCSV(rows, headers){
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.join(',')];

  return lines.join('\r\n');
}

function icsEscape(s){ return String(s).replace(/[,;]/g, c=>'\\'+c).replace(/\n/g,'\\n'); }
function icsDateTimeUTC(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function icsRRule(ev){
  if(!ev.recur_freq) return null;
  const freqMap = { day:'DAILY', week:'WEEKLY', month:'MONTHLY' };
  let rule = `FREQ=${freqMap[ev.recur_freq]};INTERVAL=${ev.recur_interval||1}`;
  if(ev.recur_end_type === 'date' && ev.recur_end_date){
    rule += `;UNTIL=${ev.recur_end_date.replace(/-/g,'')}T235959Z`;
  }
  return rule;
}

/* ---------- ICS IMPORT ---------- */
function unfoldICS(text){
  return text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');
}
function unescapeICSText(s){
  return String(s||'').replace(/\\n/g,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
}
function parseICS(text){
  const unfolded = unfoldICS(text);
  const lines = unfolded.split('\n');
  const events = [];
  let cur = null;
  lines.forEach(rawLine=>{
    const line = rawLine.trim();
    if(line === 'BEGIN:VEVENT'){ cur = {}; return; }
    if(line === 'END:VEVENT'){ if(cur && cur.title && cur.date) events.push(cur); cur = null; return; }
    if(!cur) return;
    const idx = line.indexOf(':');
    if(idx === -1) return;
    const keyPart = line.slice(0, idx);
    const value = line.slice(idx+1);
    const key = keyPart.split(';')[0].toUpperCase();
    if(key === 'SUMMARY'){ cur.title = unescapeICSText(value); }
    else if(key === 'DESCRIPTION'){ cur.notes = unescapeICSText(value); }
    else if(key === 'RRULE'){ cur.rrule = value; }
    else if(key === 'DTSTART'){
      const digits = value.replace(/[^0-9T]/g,'');
      const datePart = digits.split('T')[0];
      if(datePart.length >= 8){
        cur.date = `${datePart.slice(0,4)}-${datePart.slice(4,6)}-${datePart.slice(6,8)}`;
      }
      const timePart = digits.includes('T') ? digits.split('T')[1] : '';
      if(timePart.length >= 4){
        cur.time = `${timePart.slice(0,2)}:${timePart.slice(2,4)}`;
      }
    }
  });
  return events;
}
function parseRRule(rrule){
  const parts = {};
  rrule.split(';').forEach(p=>{
    const kv = p.split('=');
    if(kv[0]) parts[kv[0].toUpperCase()] = kv[1];
  });
  return parts;
}
function isBirthdayTitle(title){
  const s = (title||'').toLowerCase();
  return s.includes('birthday') || s.includes('fødselsdag');
}
function classifyImportedEvents(parsed){
  const results = [];
  const consumed = new Set();
  const byTitle = {};
  parsed.forEach((ev, idx)=>{
    const key = (ev.title||'').trim();
    if(!byTitle[key]) byTitle[key] = [];
    byTitle[key].push(Object.assign({}, ev, { idx }));
  });

  parsed.forEach((ev, idx)=>{
    if(consumed.has(idx)) return;

    if(isBirthdayTitle(ev.title)){
      results.push({
        title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
        kind: 'birthday', recur_freq: 'year', recur_interval: 1, recur_end_type: 'never', recur_end_date: null
      });
      consumed.add(idx);
      return;
    }

    if(ev.rrule){
      const rr = parseRRule(ev.rrule);
      let endDate = null;
      if(rr.UNTIL){
        const d = rr.UNTIL.replace(/[^0-9]/g,'').slice(0,8);
        endDate = `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
      }
      if(rr.FREQ === 'WEEKLY'){
        results.push({
          title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
          kind: 'course', recur_freq: 'week', recur_interval: parseInt(rr.INTERVAL)||1,
          recur_end_type: endDate ? 'date' : 'never', recur_end_date: endDate
        });
        consumed.add(idx);
        return;
      }
      const freqMap = {DAILY:'day', WEEKLY:'week', MONTHLY:'month', YEARLY:'year'};
      results.push({
        title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
        kind: 'imported', recur_freq: freqMap[rr.FREQ] || null, recur_interval: parseInt(rr.INTERVAL)||1,
        recur_end_type: endDate ? 'date' : 'never', recur_end_date: endDate
      });
      consumed.add(idx);
      return;
    }

    const group = (byTitle[(ev.title||'').trim()] || []).filter(g => !consumed.has(g.idx));
    if(group.length >= 4){
      const sorted = group.slice().sort((a,b)=> a.date.localeCompare(b.date));
      let bestStart=0, bestLen=1, curStart=0, curLen=1;
      for(let i=1;i<sorted.length;i++){
        const prev = new Date(sorted[i-1].date);
        const curD = new Date(sorted[i].date);
        const diffDays = Math.round((curD-prev)/86400000);
        if(diffDays === 7){ curLen++; }
        else { if(curLen>bestLen){bestLen=curLen;bestStart=curStart;} curStart=i; curLen=1; }
      }
      if(curLen>bestLen){bestLen=curLen;bestStart=curStart;}
      if(bestLen >= 4){
        const runItems = sorted.slice(bestStart, bestStart+bestLen);
        results.push({
          title: ev.title, date: runItems[0].date, time: runItems[0].time || null, notes: runItems[0].notes || null,
          kind: 'course', recur_freq: 'week', recur_interval: 1,
          recur_end_type: 'date', recur_end_date: runItems[runItems.length-1].date
        });
        runItems.forEach(ri => consumed.add(ri.idx));
        return;
      }
    }

    results.push({
      title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
      kind: 'imported', recur_freq: null, recur_interval: 1, recur_end_type: 'never', recur_end_date: null
    });
    consumed.add(idx);
  });

  return results;
}
async function importIcsFile(file){
  const text = await file.text();
  let parsed;
  try{ parsed = parseICS(text); }catch(e){ parsed = []; }
  if(parsed.length === 0){

/* ---------- STUDY RENDER ---------- */
// Every leaderboard on the site (study streaks, books finished, job
// applications) shares this same shape: everyone signed up appears (unless
// they've opted out via the "hide me from leaderboards" account setting),
// showing only the top 3 by default with a "Show more" control that expands
// into normal 10-per-page pagination. This one state object + renderer is
// shared by all three so that behavior stays in sync across them.
const lbState = {
  study: { expanded:false, page:1 },
  reading: { expanded:false, page:1 },
  jobs: { expanded:false, page:1 }
};
function renderLeaderboardPage(listId, controlsId, stateKey, rows, rowBuilder){
  const list = document.getElementById(listId);
  const controls = document.getElementById(controlsId);
  if(!list) return;
  list.innerHTML = '';
  if(controls) controls.innerHTML = '';
  if(rows.length === 0){ list.innerHTML = '<div class="bd-empty">—</div>'; return; }
  const state = lbState[stateKey];
  let toShow, rankOffset;
  if(!state.expanded){
    toShow = rows.slice(0, PREVIEW_SIZE);
    rankOffset = 0;
  } else {
    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if(state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * PAGE_SIZE;
    toShow = rows.slice(start, start + PAGE_SIZE);
    rankOffset = start;
  }
  toShow.forEach((r, i)=> list.appendChild(rowBuilder(r, rankOffset + i + 1)));
  if(!controls) return;
  if(!state.expanded && rows.length > PREVIEW_SIZE){
    const moreBtn = document.createElement('button');
    moreBtn.className = 'show-more-btn';
    moreBtn.textContent = `${t('showMore')} (${rows.length - PREVIEW_SIZE})`;
    moreBtn.addEventListener('click', ()=>{ state.expanded = true; state.page = 1; renderAllLeaderboards(); });
    controls.appendChild(moreBtn);
  } else if(state.expanded){
    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    const nav = document.createElement('div');
    nav.className = 'list-controls';
    const mkBtn = (label, page, disabled)=>{
      const b = document.createElement('button');
      b.textContent = label;
      b.disabled = !!disabled;
      b.className = 'page-btn' + (page === state.page ? ' active' : '');
      b.addEventListener('click', ()=>{ state.page = page; renderAllLeaderboards(); });
      return b;
    };
    if(totalPages > 1){
      nav.appendChild(mkBtn('«', 1, state.page === 1));
      nav.appendChild(mkBtn('‹', Math.max(1, state.page - 1), state.page === 1));
      for(let p = 1; p <= totalPages; p++){ nav.appendChild(mkBtn(String(p), p, false)); }
      nav.appendChild(mkBtn('›', Math.min(totalPages, state.page + 1), state.page === totalPages));
      nav.appendChild(mkBtn('»', totalPages, state.page === totalPages));
    }
    const lessBtn = document.createElement('button');
    lessBtn.className = 'show-more-btn';
    lessBtn.textContent = t('showLess');
    lessBtn.addEventListener('click', ()=>{ state.expanded = false; renderAllLeaderboards(); });
    nav.appendChild(lessBtn);
    controls.appendChild(nav);
  }
}

function renderCalendar(){
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const weeks = 12;
  const today = new Date();
  const myGoal = goalFor(currentUser.id);
  const end = new Date(today); end.setDate(end.getDate() + (6 - end.getDay()));
  const start = new Date(end); start.setDate(end.getDate() - weeks*7 + 1);
  for(let w=0; w<weeks; w++){
    const col = document.createElement('div'); col.className = 'cal-week';
    for(let d=0; d<7; d++){
      const date = new Date(start); date.setDate(start.getDate() + w*7 + d);
      const cell = document.createElement('div'); cell.className = 'cal-cell';
      if(date <= today){
        const key = todayStr(date);
        const hrs = dayTotal(currentUser.id, key);
        const lvl = levelFor(hrs, myGoal);
        if(lvl) cell.classList.add(lvl);
        cell.title = key + ': ' + (hrs ? fmt(hrs) + ' ' + pluralUnit(hrs, 'hr', 'hrs') : '—');
      } else { cell.style.visibility = 'hidden'; }
      col.appendChild(cell);
    }
    grid.appendChild(col);
  }
  document.getElementById('calLegendHit').textContent = t('goalHit') + ' (' + fmt(myGoal) + ' ' + pluralUnit(myGoal, 'hour', 'hours') + ')';
  const goalInput = document.getElementById('dailyGoalInput');
  if(document.activeElement !== goalInput) goalInput.value = fmt(myGoal);
}
function renderBreakdown(){
  const container = document.getElementById('bdBars');
  container.innerHTML = '';

  let dateKeys = Object.keys(myEntries);
  if(bdRange !== 'all'){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - Number(bdRange) + 1);
    dateKeys = dateKeys.filter(k => new Date(k) >= new Date(todayStr(cutoff)));
  }
  const totals = {}; ACTIVITIES.forEach(a => totals[a.key] = 0);
  dateKeys.forEach(k=>{
    Object.entries(myEntries[k]).forEach(([act,hrs])=>{ totals[act] = (totals[act]||0) + Number(hrs); });
  });
  const max = Math.max(...Object.values(totals), 0.001);
  const sorted = ACTIVITIES.slice().sort((a,b)=> totals[b.key]-totals[a.key]);
  const anyData = Object.values(totals).some(v=>v>0);
  if(!anyData){ container.innerHTML = '<div class="bd-empty">—</div>'; return; }
  sorted.forEach(a=>{
    const val = totals[a.key];
    const row = document.createElement('div'); row.className = 'bd-row';
    row.innerHTML =
      `<span class="bd-dot" style="background:${a.color}"></span>` +
      `<span class="bd-label">${actLabel(a.key)}</span>` +
      `<span class="bd-track"><span class="bd-fill" style="width:${(val/max*100).toFixed(1)}%;background:${a.color}"></span></span>` +
      `<span class="bd-val">${fmt(val)}h</span>`;
    container.appendChild(row);
  });

async function addBook(){

  const author = document.getElementById('bookAuthor').value.trim();
  const status = document.getElementById('bookStatus').value;
  const pages = parseInt(document.getElementById('bookPages').value) || null;
  if(!title) return;
  const row = { user_id: currentUser.id, title, author: author || null, status, total_pages: pages, pages_read: status==='finished' ? pages : 0, finished_at: status==='finished' ? todayStr() : null, notes: [] };

// The reading leaderboard is intentionally public — anyone signed in can see
// the finished-book counts and ranking, even a non-core-member who can't see
// Roxy/Kristoffer's actual book rows (those stay shared_circle-only, see
// privacy_rls_migration.sql). It's backed by the reading_leaderboard() SQL
// function (SECURITY DEFINER, reading_jobs_leaderboard_migration.sql), which
// returns only aggregate counts, never titles or authors.
let readingLeaderboardCache = [];
async function refreshReadingLeaderboard(){
  if(!currentUser) return;
  const { data, error } = await supabaseClient.rpc('reading_leaderboard');
  if(error) return;
  const counts = {};
  (data||[]).forEach(r=>{ counts[r.user_id] = r.finished_count; });
  // Show every signed-up (non-hidden) account, defaulting to 0 for anyone
  // the aggregate RPC didn't return a row for (i.e. no finished books yet).
  readingLeaderboardCache = Object.keys(profiles)
    .filter(visibleOnLeaderboard)
    .map(uid=>({ id: uid, name: nameFor(uid), finished: counts[uid] || 0 }))
    .sort((a,b)=> b.finished - a.finished);
  renderReadingLeaderboardList();
}
function renderReadingLeaderboardList(){
  renderLeaderboardPage('bookLeaderboard', 'bookLeaderboardControls', 'reading', readingLeaderboardCache, (r, rank)=>{
    const row = document.createElement('div');

    row.innerHTML = `<span class="lb-rank">${rank}</span><span class="lb-name">${lbNameCell(r)}</span><span class="lb-stat">${r.finished}</span>`;

  });
}

function formatCountdown(target){
  const diff = target - new Date();
  if(diff <= 0) return null;
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  return `${days}d ${hours}h ${mins}m`;
}

function formatTime12h(t){
  if(!t) return '';
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr,10);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${mStr} ${ampm}`;
}

function expandOccurrences(ev, rangeStartStr, rangeEndStr){
  const rangeStart = new Date(rangeStartStr);
  const rangeEnd = new Date(rangeEndStr);
  const excluded = new Set(ev.excluded_dates || []);
  if(!ev.recur_freq){
    if(excluded.has(ev.event_date)) return [];
    const d = new Date(ev.event_date);
    return (d >= rangeStart && d <= rangeEnd) ? [ev.event_date] : [];
  }
  const occ = [];
  let cur = new Date(ev.event_date);
  const interval = ev.recur_interval || 1;
  const recurEnd = (ev.recur_end_type === 'date' && ev.recur_end_date) ? new Date(ev.recur_end_date) : null;
  let safety = 0;
  while(cur <= rangeEnd && safety < 2000){
    safety++;
    if(recurEnd && cur > recurEnd) break;
    const dateKey = todayStr(cur);
    if(cur >= rangeStart && cur <= rangeEnd && !excluded.has(dateKey)){ occ.push(dateKey); }
    if(ev.recur_freq === 'day') cur.setDate(cur.getDate() + interval);
    else if(ev.recur_freq === 'week') cur.setDate(cur.getDate() + interval*7);
    else if(ev.recur_freq === 'month') cur.setMonth(cur.getMonth() + interval);
    else if(ev.recur_freq === 'year') cur.setFullYear(cur.getFullYear() + interval);
    else break;
  }
  return occ;
}

function nextOccurrence(ev){
  const today = todayStr();
  const farFuture = todayStr(new Date(Date.now() + 1000*60*60*24*365*3));
  if(!ev.recur_freq){ return ev.event_date; }
  const occ = expandOccurrences(ev, today, farFuture);
  if(occ.length > 0) return occ[0];
  const recurEnd = (ev.recur_end_type === 'date' && ev.recur_end_date) ? ev.recur_end_date : null;
  return recurEnd || ev.event_date;
}

function recurBadgeText(ev){
  if(!ev.recur_freq) return '';
  const n = ev.recur_interval || 1;
  const unitKey = ev.recur_freq === 'day' ? 'repeatDay' : ev.recur_freq === 'week' ? 'repeatWeek' : ev.recur_freq === 'year' ? 'repeatYear' : 'repeatMonth';
  let text = t('recurBadge').replace('{n}', n).replace('{unit}', t(unitKey).toLowerCase());
  if(ev.recur_end_type === 'date' && ev.recur_end_date){
    text += ' · ' + t('recurUntil').replace('{date}', ev.recur_end_date);
  } else {
    text += ' · ' + t('recurForever');
  }
  return text;
}

function itemsOfKind(kind){
  const all = [];
  Object.values(allEvents).forEach(userEvents=>{
    userEvents.forEach(ev=>{
      if((ev.kind || 'deadline') === kind) all.push(ev);
    });
  });
  // Upcoming items first (soonest first). Past items sink to the bottom,
  // ordered so the most-recently-past comes right after the upcoming ones
  // and the longer ago an item is, the further down it sits. Uses the same
  // "target" moment (date + time, defaulting to end of day) as the
  // left/ago text in buildEventRowEl, so the sort order always matches
  // what's displayed.
  const now = new Date();
  const withTiming = all.map(ev=>{
    const nextDate = nextOccurrence(ev);
    const target = new Date(nextDate + 'T' + (ev.event_time || '23:59:59'));
    return { ev, target, isPast: target < now };
  });
  withTiming.sort((a,b)=>{
    if(a.isPast !== b.isPast) return a.isPast ? 1 : -1;
    return a.isPast ? (b.target - a.target) : (a.target - b.target);
  });
  return withTiming.map(x=>x.ev);
}

function fineCountdownText(targetMs, nowMs){
  const diffMs = targetMs - nowMs;
  const absMs = Math.abs(diffMs);
  const h = Math.floor(absMs/3600000);
  const m = Math.floor((absMs%3600000)/60000);
  const s = Math.floor((absMs%60000)/1000);
  const parts = [];
  if(h>0) parts.push(h+'h');
  parts.push(m+'m');
  if(h===0) parts.push(s+'s');
  const fine = parts.join(' ');
  return diffMs >= 0 ? `${fine} ${t('fineLeft')}` : `${fine} ${t('fineAgo')}`;
}

function buildEventRowEl(ev){

  if(Math.abs(diffMsExact) < 86400000){

    soon = true;
  }
  else if(diffDays > 0){ daysText = diffDays + ' ' + pluralUnit(diffDays, t('dayLeftSingular'), t('daysLeft')); soon = diffDays <= 7; }
  else if(diffDays === 0){ daysText = t('today'); soon = true; }
  else { const od = Math.abs(diffDays); daysText = od + ' ' + pluralUnit(od, t('overdueSingular'), t('overdue')); soon = true; }

async function saveSubscription(eventId){
  const draft = reminderDrafts[eventId];
  if(!draft) return;
  const existing = allSubsByEvent[eventId] || {};
  const recipients = Array.from(draft.recipients);
  if(recipients.length > 0){
    const rows = recipients.map(uid => ({
      event_id: eventId, user_id: uid, applies_to: draft.appliesTo, reminders: draft.reminders
    }));
    await supabaseClient.from('event_subscriptions').upsert(rows, { onConflict: 'event_id,user_id' });
  }
  const toRemove = Object.keys(existing).filter(uid => !draft.recipients.has(uid));
  for(const uid of toRemove){
    await supabaseClient.from('event_subscriptions').delete().eq('event_id', eventId).eq('user_id', uid);
  }
  const { data: freshRows } = await supabaseClient.from('event_subscriptions').select('*').eq('event_id', eventId);
  allSubsByEvent[eventId] = {};
  (freshRows||[]).forEach(s=>{ allSubsByEvent[eventId][s.user_id] = s; });
  mySubscriptions[eventId] = allSubsByEvent[eventId][currentUser.id];
  if(!mySubscriptions[eventId]) delete mySubscriptions[eventId];
  expandedSubscribe.delete(eventId);
  renderCalendarTab();
}
async function removeSubscription(eventId){
  await supabaseClient.from('event_subscriptions').delete().eq('event_id', eventId).eq('user_id', currentUser.id);
  delete mySubscriptions[eventId];
  if(allSubsByEvent[eventId]) delete allSubsByEvent[eventId][currentUser.id];
  delete reminderDrafts[eventId];
  expandedSubscribe.delete(eventId);
  renderCalendarTab();
}

function renderKindList(kind, listId, controlsId){
  const list = document.getElementById(listId);
  const controls = document.getElementById(controlsId);
  list.innerHTML = '';
  controls.innerHTML = '';
  const items = itemsOfKind(kind);
  if(items.length === 0){ list.innerHTML = '<div class="empty">—</div>'; return; }

  const state = listState[kind];
  let toShow;

  if(!state.expanded){
    toShow = items.slice(0, PREVIEW_SIZE);
  } else {
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if(state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * PAGE_SIZE;
    toShow = items.slice(start, start + PAGE_SIZE);
  }
  toShow.forEach(ev => list.appendChild(buildEventRowEl(ev)));

  if(!state.expanded && items.length > PREVIEW_SIZE){
    const moreBtn = document.createElement('button');
    moreBtn.className = 'show-more-btn';
    moreBtn.textContent = `${t('showMore')} (${items.length - PREVIEW_SIZE})`;
    moreBtn.addEventListener('click', ()=>{ state.expanded = true; state.page = 1; renderCalendarTab(); });
    controls.appendChild(moreBtn);
  } else if(state.expanded){
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if(totalPages > 1){
      const nav = document.createElement('div');
      nav.className = 'list-controls';
      const mkBtn = (label, page, disabled)=>{
        const b = document.createElement('button');
        b.textContent = label;
        b.disabled = !!disabled;
        b.className = 'page-btn' + (page === state.page ? ' active' : '');
        b.addEventListener('click', ()=>{ state.page = page; renderCalendarTab(); });
        return b;
      };
      nav.appendChild(mkBtn('«', 1, state.page === 1));
      nav.appendChild(mkBtn('‹', Math.max(1, state.page - 1), state.page === 1));
      for(let p = 1; p <= totalPages; p++){ nav.appendChild(mkBtn(String(p), p, false)); }
      nav.appendChild(mkBtn('›', Math.min(totalPages, state.page + 1), state.page === totalPages));
      nav.appendChild(mkBtn('»', totalPages, state.page === totalPages));
      controls.appendChild(nav);
    }
    if(items.length > PREVIEW_SIZE){
      const lessBtn = document.createElement('button');
      lessBtn.className = 'show-more-btn';
      lessBtn.textContent = t('showLess');
      lessBtn.addEventListener('click', ()=>{ state.expanded = false; state.page = 1; renderCalendarTab(); });
      controls.appendChild(lessBtn);
    }
  }
}

function textColorFor(hex){
  if(!hex) return '#fff';
  const h = hex.replace('#','');
  if(h.length !== 6) return '#fff';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#1E1F22' : '#fff';
}

function isMobileDevice(){ return window.innerWidth <= 640; }
// On mobile the main tab nav (.tabs, flex-wrap) wraps into rows using the
// browser's default greedy fill, which packs as many tabs as fit into row 1
// and leaves the leftover on row 2 (e.g. 6 tabs at 4-per-row -> 4 on top,
// 2 big ones on the bottom). The tab order must stay identical to desktop
// (Calendar, Study, Courses, Notes, Reading, Jobs) — nothing is ever moved —
// but the TOP row should be the bigger one. So instead of reordering tabs,
// the line break is forced EARLY, right after the first `remainder` tabs
// (the same count that would otherwise be left dangling on the last row),
// so fewer tabs share the top row and it renders bigger: 6 tabs -> first 2
// big on top, remaining 4 smaller below; 7 tabs -> first 3 big on top,
// remaining 4 below; etc. A flex-basis:100% spacer is what forces that real
// line break (plain CSS `order` can't do this — it doesn't create an actual
// row boundary, so items just slide up to fill available space).
let tabNavCanonicalOrder = null;
function reorderMobileTabs(){
  const nav = document.getElementById('tabNav');
  if(!nav) return;
  if(!tabNavCanonicalOrder){
    tabNavCanonicalOrder = Array.from(nav.querySelectorAll('button')).map(b=> b.id);
  }
  const buttons = tabNavCanonicalOrder.map(id=> document.getElementById(id)).filter(Boolean);
  if(buttons.length === 0) return;
  // Always restore the original left-to-right tab order first (also drops
  // any spacer from a previous call) so re-measuring is never based on an
  // already-modified state, and tab identity order never changes.
  const oldSpacer = nav.querySelector('.tabs-break');
  if(oldSpacer) oldSpacer.remove();
  buttons.forEach(b=> nav.appendChild(b));
  if(!isMobileDevice()) return;
  const total = buttons.length;
  const firstTop = buttons[0].offsetTop;
  const rowCapacity = buttons.filter(b=> b.offsetTop === firstTop).length;
  if(rowCapacity === 0 || rowCapacity >= total) return; // already fits on one row
  const remainder = total % rowCapacity;
  if(remainder === 0) return; // rows already divide evenly, nothing to rebalance
  const spacer = document.createElement('div');
  spacer.className = 'tabs-break';
  spacer.style.cssText = 'flex-basis:100%;height:0;';
  nav.insertBefore(spacer, buttons[remainder]);
}

window.addEventListener('resize', ()=>{
  clearTimeout(tabReorderResizeTimer);
  tabReorderResizeTimer = setTimeout(()=>{

function shortenTitleForMobile(title){
  if(!title) return title;
  const fillers = new Set(['the','in','to','from','of','and']);
  const words = title.split(/\s+/).filter(Boolean);
  const clusters = [];
  let current = '';
  words.forEach(w=>{
    const clean = w.toLowerCase().replace(/[^a-z]/g,'');
    if(w === '&' || fillers.has(clean)){
      if(current){ clusters.push(current); current = ''; }
      return;
    }
    current += w.charAt(0).toUpperCase();
  });
  if(current) clusters.push(current);
  if(clusters.length === 0) return title;
  return clusters.join(' ');
}
