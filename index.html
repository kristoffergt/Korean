<script>
const GRAMMAR_DATA = [{"pattern": "-더니", "level": "advanced", "senses": [{"label": "Cause & result", "definition": "Connects a past observed situation with a natural consequence that followed: 'X was happening, and as a result Y.' The subject is usually a third person being observed.", "formation": "Verb/Adj stem + -더니 (cause-result reading)", "examples": [["그 친구가 매일 운동을 하더니 살이 많이 빠졌어요.", "That friend exercised every day, and as a result they lost a lot of weight."], ["친구는 전화를 받더니 수업 중간에 나가 버렸어요.", "My friend got a call, and then left in the middle of class."]], "notes": "The second clause is a natural/logical outcome of the first — this differs from the contrastive reading of -더니."}, {"label": "Contrast", "definition": "Connects two opposite or contradictory situations, often with surprise or irony: 'X was the case (before), but now Y.'", "formation": "Verb/Adj stem + -더니 (contrastive reading)", "examples": [["아까는 울더니 지금은 잘 웃네요.", "A little while ago they were crying, but now they're laughing happily."], ["전에는 한국어를 못하더니 이제는 유창하게 하네요.", "Before, they couldn't speak Korean at all, but now they speak it fluently."]], "notes": "The contrast is between what the speaker previously observed and what is now true; subject is often a third party."}], "commonality": 3, "difficulty": 4, "formality": 45, "politeness": 50, "id": "더니", "matchStrings": ["더니"], "finalOnly": false}, {"pattern": "-는 대로", "level": "intermediate", "senses": [{"label": "As soon as", "definition": "Means 'as soon as X happens' — the second action follows immediately after the first.", "formation": "Verb stem + -는 대로", "examples": [["수업이 끝나는 대로 바로 식당으로 오세요.", "Come to the restaurant as soon as class ends."]], "notes": "Similar to -자마자 but slightly more neutral/planned in tone."}, {"label": "Exactly as / in accordance with", "definition": "Means 'exactly as / in accordance with X' — an action is performed in the same manner or following the same standard as described.", "formation": "Verb stem + -는 대로", "examples": [["선생님이 가르쳐 주는 대로 공부하면 시험을 잘 볼 수 있어요.", "If you study exactly the way the teacher taught you, you can do well on the test."]], "notes": "A separate meaning from the 'as soon as' sense above, despite the identical form — context determines which applies."}], "commonality": 5, "difficulty": 2, "formality": 50, "politeness": 50, "id": "는-대로", "matchStrings": ["는 대로"], "finalOnly": false}, {"pattern": "-는지/은지/ㄴ지", "level": "advanced", "senses": [{"label": "Degree ('so X that...') — with 어찌나/얼마나", "definition": "Expresses an extreme degree of something that caused or explains a result: 'it was so X that...'. 어찌나/얼마나 both mean 'so much / to such a degree,' with 얼마나 more neutral and 어찌나 more exclamatory.", "formation": "어찌나/얼마나 + Verb/Adj + -는지/은지/ㄴ지 (+ result clause)", "examples": [["어찌나 피곤한지 앉자마자 잠이 들었어요.", "I was so exhausted that I fell asleep the moment I sat down."], ["얼마나 반가운지 눈물이 날 뻔했어요.", "I was so glad to see them that I nearly burst into tears."]], "notes": "The result clause often describes a natural or surprising consequence; can also be used as a rhetorical exclamation with no explicit result."}, {"label": "Indirect question ('whether/if X')", "definition": "Embeds an indirect question or expresses uncertainty: 'whether X,' 'I wonder if X,' or 'I'm not sure X.' Turns a clause into an indirect question, often the object of 모르다, 알다, 궁금하다.", "formation": "Verb/Adj modifier form + -는지/은지/ㄴ지", "examples": [["왜 그런지 이해가 안 돼요.", "I can't understand why that is."], ["그 사람이 괜찮은지 걱정이 돼요.", "I'm worried about whether that person is okay."]], "notes": "Distinct from the degree construction with 얼마나/어찌나; alone, it signals uncertainty or an embedded question rather than intensity."}], "commonality": 4, "difficulty": 4, "formality": 50, "politeness": 50, "id": "는지-은지-ㄴ지", "matchStrings": ["는지", "은지", "ㄴ지"], "finalOnly": false}, {"pattern": "-거든(요)", "level": "intermediate", "senses": [{"label": "Connective — sets up a condition/precondition ('if/when X, then...')", "definition": "Gives a reason or precondition for what follows, often used to set up a request, instruction, or plan: 'if/when X (happens/is the case), then...'. Very common in casual spoken Korean.", "formation": "Verb/Adj stem + -거든 (+ instruction or follow-up clause)", "examples": [["고향에 도착하거든 이메일 보내 주세요.", "When you arrive home, please send me an email."]], "notes": "Also used sentence-finally (-거든요) simply to give a reason/explanation for something just said, without a following instruction — see the separate -거든요 entry for that use."}, {"label": "Sentence-final — gives a reason/explanation ('you see, because X')", "definition": "A sentence-final ending that gives a reason or explanation for something just said or observed, without necessarily setting up an instruction: 'you see, because X.'", "formation": "Verb/Adj stem (or Noun+이) + -거든요", "examples": [["배가 고파요. 아침부터 아무것도 안 먹었거든요.", "I'm hungry — you see, I haven't eaten anything since this morning."]], "notes": "Distinct from the connective -거든 (which sets up a following instruction) — this sentence-final use simply explains or justifies."}], "commonality": 5, "difficulty": 2, "formality": 25, "politeness": 45, "id": "거든-요", "matchStrings": ["거든요", "거든"], "finalOnly": false}, {"pattern": "-(으)ㄹ걸(요)", "level": "advanced", "senses": [{"label": "Regret about a past choice ('should have done X')", "definition": "Expresses regret about something the speaker didn't do but wishes they had: 'I should have done X.' Without 그랬다, it trails off with implied regret.", "formation": "Verb stem + -(으)ㄹ걸 (그랬다)", "examples": [["미리 예약할걸 그랬어요. 이제 자리가 없네요.", "I should have made a reservation in advance. Now there are no seats left."], ["돈이 있을 때 좀 아껴서 쓸걸 그랬어요.", "I should have been more frugal while I had money."]], "notes": "Without 그랬다 and with falling intonation, -(으)ㄹ걸 alone can instead express a guess about the present/future."}, {"label": "Confident guess/speculation ('I bet X')", "definition": "A sentence-final ending expressing a confident guess or speculation: 'I bet X' or 'it's probably X,' often when the speaker knows something the listener doesn't.", "formation": "Verb/Adj stem + -(으)ㄹ걸요", "examples": [["영미 씨는 감기에 걸려서 오늘 학교에 못 올걸요.", "Yeong-mi has a cold, so she probably won't be able to come to school today."]], "notes": "Distinct from -(으)ㄹ걸 그랬다 (regret about a past choice) — this is a present/future guess, not regret."}], "commonality": 3, "difficulty": 4, "formality": 20, "politeness": 40, "id": "으-ㄹ걸-요", "matchStrings": ["을걸요", "ㄹ걸요", "을걸", "ㄹ걸"], "finalOnly": true}, {"pattern": "-도록", "level": "intermediate", "senses": [{"label": "Purpose / extent ('so that X' / 'to the point of X')", "definition": "Two main uses: (1) purpose — 'so that X / in order that X'; (2) extent — 'to the point of X / so much that X.' Also used in directives: 'make sure to do X.'", "formation": "Verb stem + -도록", "examples": [["모두가 이해할 수 있도록 천천히 설명해 주세요.", "Please explain slowly so that everyone can understand."], ["밤이 늦도록 딸이 돌아오지 않아서 걱정이에요.", "I'm worried because my daughter hasn't come home even though it's gotten late."]], "notes": "Context determines the reading: with effort/instruction verbs it signals purpose; with degree expressions it signals extreme extent. The related -도록 하다 softens it into an imperative ('make sure to...')."}, {"label": "+ 하다: softened imperative ('make sure to do X')", "definition": "A softened imperative meaning 'make sure to do X' or 'be sure that X happens' — a gentler, more formal way of giving an instruction.", "formation": "Verb stem + -도록 하다", "examples": [["여러분, 지각하지 말고 일찍 오도록 하세요.", "Everyone, please make sure not to be late and come early."]], "notes": "Closely related to plain -도록; adding 하다 turns it into a polite command/instruction."}], "commonality": 4, "difficulty": 3, "formality": 55, "politeness": 55, "id": "도록", "matchStrings": ["도록"], "finalOnly": false}, {"pattern": "-게", "level": "intermediate", "senses": [{"label": "Adverbializer / manner-purpose ('in an X way', 'so that X')", "definition": "Turns a descriptive verb (adjective) into an adverb, or expresses the manner/purpose/degree of the following action: 'in an X way' or 'so that X'.", "formation": "Adjective stem + -게 (+ following verb)", "examples": [["아이가 알아듣게 천천히 말해 주세요.", "Please speak slowly so the child can understand."], ["예쁘게 꾸몄어요.", "I decorated it nicely."]], "notes": "One of the most basic and versatile connective endings; combines with 하다 to form the causative -게 하다."}, {"label": "+ 하다: causative ('to make/let someone do X')", "definition": "The productive (long-form) causative: 'to make/let someone do X' or 'to cause X to happen.'", "formation": "Verb/Adj stem + -게 하다", "examples": [["오래 기다리게 해서 미안해요.", "I'm sorry for making you wait so long."]], "notes": "Works with virtually any verb, unlike the irregular short causative suffixes (이/히/리/기/우/구/추)."}], "commonality": 5, "difficulty": 1, "formality": 50, "politeness": 50, "id": "게", "matchStrings": ["게"], "finalOnly": false}, {"pattern": "-만 못하다", "level": "intermediate", "senses": [{"label": null, "definition": "Expresses that one thing is inferior to or not as good as another: 'X is not as good as Y / X falls short of Y.'", "formation": "Noun + 만 못하다", "examples": [["전망은 이 방만 못하지만 밝고 깨끗해요.", "The view isn't as good as this room's, but it's bright and clean."]], "notes": "The compared noun (Y) takes 만; 못하다 conjugates like a regular adjective."}], "commonality": 3, "difficulty": 3, "formality": 55, "politeness": 50, "id": "만-못하다", "matchStrings": ["만 못하다"], "finalOnly": false}, {"pattern": "-고 해서", "level": "intermediate", "senses": [{"label": null, "definition": "Gives one reason among possibly several for an action, implying 'partly because X (and other reasons too)'. Softer and less definitive than stating a single direct cause.", "formation": "Verb/Adj stem + -고 해서", "examples": [["여름도 되고 해서 머리 모양을 좀 바꿔 봤어요.", "Since it's become summer (among other reasons), I decided to change my hairstyle a bit."]], "notes": "Implies there were other unstated reasons too — contrast with -아/어서, which states a single direct cause."}], "commonality": 3, "difficulty": 3, "formality": 30, "politeness": 50, "id": "고-해서", "matchStrings": ["고 해서"], "finalOnly": false}, {"pattern": "간접화법 축약형 (Abbreviated Indirect Speech)", "level": "advanced", "senses": [{"label": null, "definition": "Casual, contracted forms of reported (indirect quotation) speech used in everyday conversation, replacing the fuller -다고 해요 / -냐고 해요 / -라고 해요 / -자고 해요 patterns.", "formation": "Statement: -대(요) ← -다고 해요 · Question: -냬(요) ← -냐고 해요 · Command: -래(요) ← -라고 해요 · Suggestion: -재(요) ← -자고 해요", "examples": [["음식이 싸고 맛있대요.", "They say the food is cheap and delicious. (← 맛있다고 해요)"], ["같이 가재요.", "They're suggesting we go together. (← 같이 가자고 해요)"]], "notes": "Purely a spoken-register contraction; the meaning is identical to the full indirect-speech form, just shorter and more casual."}], "commonality": 5, "difficulty": 4, "formality": 15, "politeness": 35, "id": "간접화법-축약형-abbreviated-indirect-speech", "matchStrings": [], "finalOnly": false}, {"pattern": "-기는요", "level": "intermediate", "senses": [{"label": null, "definition": "A dismissive or modest response used to downplay a compliment, deny an assumption, or contradict what was just said: 'Not really,' 'Far from it,' 'What are you talking about.'", "formation": "Verb/Adj stem (or Noun+이) + -기는요", "examples": [["A: 한국어를 참 잘하시네요! B: 잘하기는요. 아직 멀었어요.", "A: You're really good at Korean! B: Not really — I still have a long way to go."]], "notes": "Almost always a direct reaction to something the other person just said; rarely used to open a new topic."}], "commonality": 4, "difficulty": 2, "formality": 15, "politeness": 45, "id": "기는요", "matchStrings": ["기는요"], "finalOnly": true}, {"pattern": "피동 (Passive Voice)", "level": "advanced", "senses": [{"label": null, "definition": "The Korean passive voice, expressing that the subject receives the action rather than performs it: 'is done / gets done (to something) by something.'", "formation": "Short passive: verb stem + 이/히/리/기 · Long passive: verb stem + -아/어지다", "examples": [["소리가 잘 안 들려요.", "The sound isn't heard well (I can't hear it well)."], ["문제가 잘 풀렸어요.", "The problem got solved well."]], "notes": "Only a fixed set of verbs take the short passive suffixes (이/히/리/기); most others use -아/어지다 instead. Not every active verb has a corresponding passive form."}], "commonality": 4, "difficulty": 4, "formality": 50, "politeness": 50, "id": "피동-passive-voice", "matchStrings": [], "finalOnly": false}, {"pattern": "-고(요)", "level": "intermediate", "senses": [{"label": null, "definition": "Adds a supplementary or additional piece of information at the end of a sentence, in a soft, conversational tone: 'and also...', 'oh, and...'", "formation": "Verb/Adj stem (or sentence-final form) + -고(요)", "examples": [["오늘 날씨가 좋네요. 바람도 시원하고요.", "The weather's nice today. And the breeze is cool too."]], "notes": "The 요 is optional and simply adds politeness; without it, it's plain/casual speech."}], "commonality": 3, "difficulty": 2, "formality": 35, "politeness": 55, "id": "고-요", "matchStrings": ["고요", "고"], "finalOnly": true}, {"pattern": "-는 대신(에)", "level": "intermediate", "senses": [{"label": null, "definition": "Indicates that one thing is done, given, or true 'in place of' or 'in exchange for' another: 'instead of X' or 'in return for X.'", "formation": "Verb (present) -는 대신(에) · Adjective -(으)ㄴ 대신(에) · Noun 대신(에)", "examples": [["내가 한국어를 가르쳐 주는 대신에 너는 중국어를 가르쳐 줘.", "I'll teach you Korean, and in exchange you teach me Chinese."], ["요즘은 현금을 내는 대신에 교통카드를 많이 써요.", "These days, instead of paying cash, people mostly use transit cards."]], "notes": "Can express either a trade-off (mutual exchange) or a simple substitution, depending on context."}], "commonality": 4, "difficulty": 2, "formality": 50, "politeness": 50, "id": "는-대신-에", "matchStrings": ["는 대신", "은 대신", "ㄴ 대신"], "finalOnly": false}, {"pattern": "-을/ㄹ 뿐(만) 아니라", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'not only X, but also Y' — adds a second, often more significant, fact on top of the first.", "formation": "Verb/Adj stem + -을/ㄹ 뿐만 아니라 (also -는 것뿐만 아니라 for nouns/nominalized clauses)", "examples": [["내 친구는 운동도 잘할 뿐만 아니라 공부도 잘한다.", "My friend is not only good at sports but also good at studying."]], "notes": "만 is optional and adds emphasis; the core meaning is the same with or without it."}], "commonality": 4, "difficulty": 3, "formality": 60, "politeness": 55, "id": "을-ㄹ-뿐-만-아니라", "matchStrings": ["뿐만 아니라", "뿐 아니라"], "finalOnly": false}, {"pattern": "-자마자", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'as soon as X' — the second action happens immediately after the first, with no gap in between.", "formation": "Verb stem + -자마자", "examples": [["나는 방학을 하자마자 고향으로 돌아갈 생각이에요.", "As soon as school lets out, I plan to go back to my hometown."], ["개봉하자마자 관객 수가 20만 명을 넘었대요.", "As soon as it was released, it apparently drew over 200,000 viewers."]], "notes": "Both clauses must have a very short time gap between them; not used for actions separated by a longer interval."}], "commonality": 5, "difficulty": 2, "formality": 50, "politeness": 50, "id": "자마자", "matchStrings": ["자마자"], "finalOnly": false}, {"pattern": "-느라고", "level": "intermediate", "senses": [{"label": null, "definition": "Gives the reason for a negative or unfortunate result, where the cause is a time-consuming or effortful action: 'because I was busy doing X (something bad resulted).'", "formation": "Verb stem + -느라고", "examples": [["친구들이랑 노느라고 숙제를 못 했어요.", "I was busy hanging out with friends, so I couldn't do my homework."]], "notes": "The result clause is almost always negative (couldn't do something, was late, etc.); both clauses must share the same subject."}], "commonality": 4, "difficulty": 3, "formality": 40, "politeness": 50, "id": "느라고", "matchStrings": ["느라고"], "finalOnly": false}, {"pattern": "사동 (Causative Voice)", "level": "advanced", "senses": [{"label": null, "definition": "The Korean causative voice, expressing that the subject makes or lets someone/something else perform an action: '(subject) makes/has X do Y.'", "formation": "Short causative: verb stem + 이/히/리/기/우/구/추 · Long causative: verb stem + -게 하다", "examples": [["밥도 먹이고 같이 놀아주기도 해요.", "I feed them and also play with them."], ["아이를 일찍 자게 했어요.", "I made the child go to sleep early."]], "notes": "Like the passive, only certain verbs take the short causative suffixes; -게 하다 works productively with almost any verb."}], "commonality": 4, "difficulty": 4, "formality": 50, "politeness": 50, "id": "사동-causative-voice", "matchStrings": [], "finalOnly": false}, {"pattern": "-을/ㄹ까 봐", "level": "intermediate", "senses": [{"label": null, "definition": "Expresses worry or concern that something (usually unwanted) might happen, and often explains a precaution taken because of that worry: 'because I was worried that X might happen.'", "formation": "Verb/Adj stem + -을/ㄹ까 봐", "examples": [["아이가 다칠까 봐 걱정이에요.", "I'm worried the child might get hurt."], ["대학교 입학시험에 떨어질까 봐 걱정이에요.", "I'm worried I might fail the university entrance exam."]], "notes": "Frequently paired with 걱정이다/걱정하다, but can also stand alone before an action taken as a precaution."}], "commonality": 5, "difficulty": 2, "formality": 35, "politeness": 50, "id": "을-ㄹ까-봐", "matchStrings": ["을까 봐", "ㄹ까 봐"], "finalOnly": false}, {"pattern": "-는/ㄴ다는 것이", "level": "advanced", "senses": [{"label": null, "definition": "Describes an unintended slip or mistake: the speaker meant to do one thing but ended up doing something else instead — 'I meant to do X, but (ended up doing Y).'", "formation": "Verb stem + -는/ㄴ다는 것이 (+ unintended result)", "examples": [["전화를 끊는다는 것이 실수로 다른 사람한테 걸었어요.", "I meant to hang up the phone, but I accidentally called someone else instead."]], "notes": "Almost always followed by a clause describing the unintended slip; conveys mild embarrassment or apology."}], "commonality": 2, "difficulty": 4, "formality": 45, "politeness": 50, "id": "는-ㄴ다는-것이", "matchStrings": ["다는 것이"], "finalOnly": false}, {"pattern": "-는, 은/ㄴ 모양이다", "level": "intermediate", "senses": [{"label": null, "definition": "Expresses an inference based on visible evidence or circumstances: 'it looks like X / it seems that X (based on what I can see).'", "formation": "Verb (present) -는 모양이다 · Verb (past) -은/ㄴ 모양이다 · Adjective -(으)ㄴ 모양이다", "examples": [["수업 시간에 조는 걸 보니 피곤한 모양이에요.", "Seeing them dozing off in class, they seem to be tired."], ["집에 불이 꺼진 걸 보니 아무도 없는 모양이다.", "Seeing the lights off at home, it seems like no one's there."]], "notes": "Grounded specifically in observable evidence, similar in spirit to -는/은 것 같다 but slightly more formal/written in tone."}], "commonality": 4, "difficulty": 3, "formality": 45, "politeness": 55, "id": "는-은-ㄴ-모양이다", "matchStrings": ["모양이다", "모양이에요", "모양이야"], "finalOnly": true}, {"pattern": "-아/어/여 놓다/두다", "level": "intermediate", "senses": [{"label": null, "definition": "Indicates that an action was completed and its result is intentionally being kept/maintained, often as preparation for something later: 'to do X (and leave it that way) / to do X in advance.'", "formation": "Verb stem + -아/어/여 놓다 or -아/어/여 두다", "examples": [["비자를 연장하려고 예약해 놓았거든요.", "You see, I made the reservation in advance to extend my visa."], ["문을 열어 두세요.", "Please leave the door open."]], "notes": "놓다 and 두다 are largely interchangeable; both emphasize that the resulting state is being deliberately preserved, often for future convenience."}], "commonality": 5, "difficulty": 2, "formality": 40, "politeness": 50, "id": "아-어-여-놓다-두다", "matchStrings": ["놓다", "놓았", "놓을", "두다", "두었"], "finalOnly": false}, {"pattern": "-다(가) 보면", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'if you keep doing X, you will eventually find / it will turn out that Y' — a gradual process where a continuous action leads naturally to an outcome over time.", "formation": "Action verb stem + -다(가) 보면", "examples": [["계속 연습하다 보면 실력이 늘 거예요.", "If you keep on practicing, your skills will improve over time."], ["같이 생활하다 보면 서로 더 잘 이해하게 될 거예요.", "As you keep living together, you'll come to understand each other better."]], "notes": "-다가 emphasizes the ongoing nature of the action; -보면 adds the sense of 'discovering through experience.'"}], "commonality": 5, "difficulty": 2, "formality": 40, "politeness": 50, "id": "다-가-보면", "matchStrings": ["다 보면", "다가 보면"], "finalOnly": false}, {"pattern": "-을/ㄹ 뻔하다", "level": "intermediate", "senses": [{"label": null, "definition": "Describes a near-miss: something almost happened but ultimately did not. 'Almost did X,' 'nearly X-ed,' 'came close to X-ing' — the event did NOT actually happen.", "formation": "Verb stem + -(으)ㄹ 뻔하다", "examples": [["길을 건너다가 차에 치일 뻔했어요.", "I was crossing the street and nearly got hit by a car."], ["아침에 급하게 뛰어오다가 넘어질 뻔했어요.", "I was rushing over this morning and almost tripped and fell."]], "notes": "Crucial: the event did not happen. Contrast with -았/었는데 which can set up a related follow-up clause."}], "commonality": 5, "difficulty": 2, "formality": 35, "politeness": 50, "id": "을-ㄹ-뻔하다", "matchStrings": ["뻔했", "뻔하다", "뻔할"], "finalOnly": true}, {"pattern": "-았/었/였더니", "level": "advanced", "senses": [{"label": null, "definition": "Connects a past action the speaker personally performed with a result or discovery that followed: 'I did X, and then (as a result) Y' or 'when I did X, I found that Y.'", "formation": "Verb stem + -았/었/였더니", "examples": [["매일 일찍 일어났더니 생활이 규칙적이 됐어요.", "I got up early every day, and as a result my routine became much more regular."], ["그 식당에 가 봤더니 이미 문을 닫았더라고요.", "I went to that restaurant, only to find it had already closed."]], "notes": "The first-person subject requirement distinguishes this from plain -더니 (third-person observation)."}], "commonality": 3, "difficulty": 4, "formality": 35, "politeness": 50, "id": "았-었-였더니", "matchStrings": ["았더니", "었더니", "였더니"], "finalOnly": false}, {"pattern": "-기에는", "level": "advanced", "senses": [{"label": null, "definition": "Means 'for the purpose of X-ing, [something falls short / is too much / is just right].' Evaluates whether something is suitable, excessive, or insufficient relative to a purpose.", "formation": "Verb stem + -기에는", "examples": [["이 방은 혼자 쓰기에는 너무 넓어요.", "This room is too big for one person to use alone."], ["하루 만에 끝내기에는 할 일이 너무 많아요.", "There's too much to do to finish it all in just one day."]], "notes": "Often paired with 너무 or 충분히: 'too [adj] to do X' / 'not [adj] enough to do X.'"}], "commonality": 3, "difficulty": 4, "formality": 45, "politeness": 50, "id": "기에는", "matchStrings": ["기에는"], "finalOnly": false}, {"pattern": "-다니 / (이)라니", "level": "advanced", "senses": [{"label": null, "definition": "Expresses strong surprise, disbelief, or emotional reaction to something just heard: 'I can't believe that…,' 'to think that…!'", "formation": "Verb/Adj plain form + -다니 · Noun + -(이)라니", "examples": [["그 사람이 이미 결혼을 했다니 정말 놀라워요.", "I can't believe they're already married — that's really shocking."], ["이 가격에 이런 서비스라니, 너무 좋다!", "To think you get this kind of service at this price — this is amazing!"]], "notes": "The sentence often ends without a main predicate — the expression of emotion is the point."}], "commonality": 3, "difficulty": 3, "formality": 30, "politeness": 45, "id": "다니-이-라니", "matchStrings": ["다니", "라니"], "finalOnly": false}, {"pattern": "-을/ㄹ 수가 있어야지(요)", "level": "advanced", "senses": [{"label": null, "definition": "A rhetorical negative: 'there's no way one can X' or 'how could anyone possibly X?' Emphasizes that something is completely out of the question.", "formation": "Verb stem + -(으)ㄹ 수가 있어야지(요)", "examples": [["이렇게 시끄러운데 잠을 잘 수가 있어야지요.", "With all this noise, there's no way anyone could sleep."]], "notes": "The -야지 ending signals a condition that isn't met; combined with 있어야, the phrase rhetorically denies possibility."}], "commonality": 2, "difficulty": 4, "formality": 15, "politeness": 35, "id": "을-ㄹ-수가-있어야지-요", "matchStrings": ["수가 있어야지"], "finalOnly": true}, {"pattern": "-을/ㄹ 뿐이다", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'it is merely / only X; nothing more.' Limits the scope of something and can express resigned acceptance: 'all one can do is X.'", "formation": "Verb stem + -(으)ㄹ 뿐이다", "examples": [["저는 그냥 제 의견을 말했을 뿐이에요.", "I merely expressed my own opinion — nothing more than that."], ["그는 아무 말도 없이 웃고만 있을 뿐이다.", "He's just smiling without saying anything."]], "notes": "More formal/reflective in tone than -만; excludes anything beyond what is stated."}], "commonality": 4, "difficulty": 3, "formality": 55, "politeness": 55, "id": "을-ㄹ-뿐이다", "matchStrings": ["뿐이다", "뿐이에요", "뿐이야"], "finalOnly": true}, {"pattern": "-았/었/였더라면", "level": "advanced", "senses": [{"label": null, "definition": "A past counterfactual conditional: 'if X had been the case (but it wasn't), then Y would have happened.' Expresses regret, relief, or speculation about the past.", "formation": "Verb/Adj stem + -았/었/였더라면", "examples": [["더 열심히 공부했더라면 좋은 결과를 얻었을 거예요.", "If I had studied harder, I would have gotten better results."], ["시험 준비를 열심히 했더라면 합격했을 텐데.", "If I had prepared hard for the exam, I would have passed."]], "notes": "Both clauses refer to the past and the condition is contrary to fact; often paired with -았/었을 텐데 or -았/었을 거예요."}], "commonality": 3, "difficulty": 4, "formality": 55, "politeness": 50, "id": "았-었-였더라면", "matchStrings": ["더라면"], "finalOnly": false}, {"pattern": "-다가는", "level": "advanced", "senses": [{"label": null, "definition": "Warns that if the current behavior continues, a negative consequence will result: 'if you keep on doing X, Y (bad thing) will happen.'", "formation": "Verb stem + -다가는", "examples": [["그렇게 무리하다가는 건강을 해칠 거예요.", "If you keep pushing yourself like that, you'll ruin your health."]], "notes": "The result clause is almost always negative — different from -다 보면, which is neutral or positive about gradual outcomes."}], "commonality": 3, "difficulty": 3, "formality": 35, "politeness": 45, "id": "다가는", "matchStrings": ["다가는"], "finalOnly": false}, {"pattern": "-는/은/ㄴ/을/ㄹ 듯(이)", "level": "advanced", "senses": [{"label": null, "definition": "Means 'as if X' or 'as though X' — describes the manner of an action by comparing it to something else. 듯이 is adverbial; 듯 alone can modify a noun.", "formation": "Verb/Adj modifier + 듯(이)", "examples": [["날아갈 듯이 기뻤어요.", "I was so happy it felt like I could fly."], ["그 사람은 돈을 물 쓰듯이 쓴다.", "That person spends money like water."]], "notes": "Similar to -는 것처럼 but slightly more literary/poetic in tone."}], "commonality": 3, "difficulty": 4, "formality": 55, "politeness": 50, "id": "는-은-ㄴ-을-ㄹ-듯-이", "matchStrings": ["듯이", "듯"], "finalOnly": false}, {"pattern": "-아/어/여 버리다", "level": "intermediate", "senses": [{"label": null, "definition": "Indicates an action was completed fully and decisively, often with a sense of relief, regret, or finality — the action is done and there's no going back.", "formation": "Verb stem + -아/어/여 버리다", "examples": [["오래된 옷들을 전부 버려 버렸어요.", "I just went ahead and threw out all my old clothes."], ["실수로 중요한 파일을 삭제해 버렸어요.", "I accidentally deleted the important file — and now it's gone."]], "notes": "The emotional nuance (relief vs. regret) is determined by context, not by the grammar itself."}], "commonality": 5, "difficulty": 2, "formality": 30, "politeness": 50, "id": "아-어-여-버리다", "matchStrings": ["버리다", "버렸", "버릴"], "finalOnly": false}, {"pattern": "-으라고/라고", "level": "advanced", "senses": [{"label": null, "definition": "Reports an indirect command, instruction, or request: 'X told/asked/said [for someone] to do Y.' Can also express purpose with motion verbs: 'in order to do Y.'", "formation": "Verb stem + -(으)라고 (indirect command)", "examples": [["선생님이 내일까지 제출하라고 하셨어요.", "The teacher said to submit it by tomorrow."], ["조용히 하라고 했는데 왜 계속 떠들어요?", "I told you to be quiet — why do you keep making noise?"]], "notes": "Distinguish from -라고 (quoting declarative sentences) and plain -고 (quoting statements) — this specifically quotes commands."}], "commonality": 4, "difficulty": 4, "formality": 45, "politeness": 50, "id": "으라고-라고", "matchStrings": ["으라고", "라고"], "finalOnly": false}, {"pattern": "-는/ㄴ, -다 싶다", "level": "advanced", "senses": [{"label": null, "definition": "Expresses the speaker's internal impression or fleeting thought at a moment: 'I thought/felt/it seemed to me that X.' Captures an intuitive impression rather than deliberate reasoning.", "formation": "Verb/Adj modifier or plain form + 싶다", "examples": [["이러다가 늦겠다 싶어서 서둘렀어요.", "I had the feeling I was going to be late, so I hurried."], ["그 사람 말이 맞는 것 같다 싶었어요.", "I had the impression that what that person said might actually be right."]], "notes": "The present modifier (-는/ㄴ 싶다) describes current impressions; the plain form (-다 싶다) quotes a thought more directly."}], "commonality": 3, "difficulty": 4, "formality": 35, "politeness": 45, "id": "는-ㄴ-다-싶다", "matchStrings": ["다 싶", "나 싶"], "finalOnly": false}, {"pattern": "-는가, 은/ㄴ가 하면", "level": "advanced", "senses": [{"label": null, "definition": "Introduces one item in a contrasting or listing pair: 'while on the one hand X, on the other hand Y.' Presents two contrasting or complementary examples.", "formation": "Verb/Adj modifier + -는가/은가/ㄴ가 하면", "examples": [["전통을 중요시하는가 하면, 변화를 원하는 사람도 많아요.", "While some value tradition highly, there are also many people who want change."]], "notes": "Common in expository writing/speech when surveying different aspects of a topic."}], "commonality": 2, "difficulty": 4, "formality": 70, "politeness": 55, "id": "는가-은-ㄴ가-하면", "matchStrings": ["가 하면"], "finalOnly": false}, {"pattern": "-긴 -나 봐요", "level": "advanced", "senses": [{"label": null, "definition": "Concedes a point while signaling something else is also true or an inference: 'I'll grant you X, but apparently/it seems Y.'", "formation": "Verb/Adj stem + -긴 하다 / -긴 -나 봐요", "examples": [["바쁘긴 바쁜데 그래도 운동은 해야 하나 봐요.", "Admittedly I am busy, but it seems I still need to find time to exercise."], ["맵긴 하나 봐요. 그래도 사람들이 줄을 서서 먹더라고요.", "It does seem to be spicy, yet people were lining up to eat it."]], "notes": "The -긴 portion must repeat the same verb stem: 가긴 가다, 좋긴 좋다."}], "commonality": 2, "difficulty": 4, "formality": 20, "politeness": 40, "id": "긴-나-봐요", "matchStrings": ["나 봐요", "긴 하"], "finalOnly": false}, {"pattern": "(아무리) -기로서니", "level": "advanced", "senses": [{"label": null, "definition": "Used to rebuke or express disbelief: 'even granting that X is the case, how could you possibly do Y?' Often paired with 아무리 for intensity.", "formation": "Verb/Adj stem + -기로서니", "examples": [["아무리 바쁘기로서니 식사도 건너뛰면 안 되죠.", "No matter how busy you are, skipping meals entirely is just not okay."]], "notes": "Conveys mild reproach or surprise; the result clause is almost always negative in tone."}], "commonality": 1, "difficulty": 5, "formality": 65, "politeness": 40, "id": "아무리-기로서니", "matchStrings": ["기로서니"], "finalOnly": false}, {"pattern": "-기는커녕", "level": "advanced", "senses": [{"label": null, "definition": "A strong negative concession meaning 'far from doing X, not even Y.' Not only did the greater thing not happen, but even the lesser thing didn't either.", "formation": "Verb/Adj/Noun + -기는커녕", "examples": [["감사하기는커녕 오히려 화를 내더라고요.", "Far from being thankful, she actually got angry at me."]], "notes": "The clause after -기는커녕 typically describes something worse or lesser than the first clause."}], "commonality": 3, "difficulty": 4, "formality": 40, "politeness": 45, "id": "기는커녕", "matchStrings": ["기는커녕"], "finalOnly": false}, {"pattern": "-는 둥 마는 둥 하다", "level": "advanced", "senses": [{"label": null, "definition": "Describes doing something so half-heartedly or carelessly that one can hardly say it was done at all: 'barely going through the motions.'", "formation": "Action verb stem + -는 둥 마는 둥 하다", "examples": [["밥을 먹는 둥 마는 둥 하고 바로 나가 버렸어요.", "He barely touched his food and then left right away."]], "notes": "Always describes a volitional action; cannot be used with states or adjectives."}], "commonality": 2, "difficulty": 4, "formality": 20, "politeness": 40, "id": "는-둥-마는-둥-하다", "matchStrings": ["둥 마는 둥"], "finalOnly": false}, {"pattern": "-(으)랴 -(으)랴", "level": "advanced", "senses": [{"label": null, "definition": "Enumerates two or more demanding actions happening at once, conveying that the subject is overwhelmed: 'what with X-ing and Y-ing.'", "formation": "Verb stem + -(으)랴 … -(으)랴 (two different verbs)", "examples": [["애들 돌보랴 집안일 하랴 정신이 없어요.", "What with looking after the kids and keeping up with the housework, I'm completely frazzled."]], "notes": "Usually spoken/informal, expressing being pulled in multiple directions."}], "commonality": 1, "difficulty": 5, "formality": 25, "politeness": 40, "id": "으-랴-으-랴", "matchStrings": [], "finalOnly": false}, {"pattern": "-(으)면 몰라도", "level": "advanced", "senses": [{"label": null, "definition": "Introduces the only condition under which the main clause might be acceptable, implying that since it doesn't hold, the main clause is unreasonable: 'unless X, Y is out of the question.'", "formation": "Verb/Adj stem + -(으)면 몰라도 · Noun + -(이)면 몰라도", "examples": [["전문가면 몰라도 초보자가 그 일을 하기는 어려워요.", "Unless you're an expert, it's really hard for a beginner to do that kind of work."]], "notes": "The speaker typically implies the condition is unlikely or counterfactual."}], "commonality": 2, "difficulty": 4, "formality": 45, "politeness": 50, "id": "으-면-몰라도", "matchStrings": ["면 몰라도"], "finalOnly": false}, {"pattern": "-건만 (-건마는)", "level": "advanced", "senses": [{"label": null, "definition": "A literary/formal connective expressing disappointment or lament: 'even though X, unfortunately Y.' Stronger and more poetic than -지만.", "formation": "Verb/Adj stem + -건만", "examples": [["열심히 준비했건만 결과는 좋지 않았어요.", "I prepared so hard for it, and yet the results were disappointing."]], "notes": "Common in literature, song lyrics, and formal essays; the longer form -건마는 is also correct."}], "commonality": 1, "difficulty": 5, "formality": 80, "politeness": 50, "id": "건만-건마는", "matchStrings": ["건만"], "finalOnly": false}, {"pattern": "같아선 (같아서는)", "level": "advanced", "senses": [{"label": null, "definition": "Means 'judging from the perspective of / if things stay as they are with X.' Often used for predictions or fears based on a current state.", "formation": "Noun/pronoun + 같아선 / 같아서는", "examples": [["이 속도 같아선 마감을 맞추기가 힘들 것 같아요.", "At this rate, it looks like we'll have trouble meeting the deadline."]], "notes": "Short for -과 같아서는; frequently combined with future tense or a warning tone."}], "commonality": 1, "difficulty": 4, "formality": 25, "politeness": 40, "id": "같아선-같아서는", "matchStrings": ["같아선", "같아서는"], "finalOnly": true}, {"pattern": "-은/ㄴ 채(로)", "level": "advanced", "senses": [{"label": null, "definition": "Describes a state that remains unchanged while a second action takes place: 'with X still in place,' 'while remaining X.'", "formation": "Action verb past modifier (-은/ㄴ) + 채(로)", "examples": [["신발을 신은 채로 방에 들어오지 마세요.", "Please don't come into the room with your shoes still on."], ["불을 켠 채로 잠이 들어 버렸어요.", "I fell asleep with the lights still on."]], "notes": "The condition must result from a previous action, so the verb must be an action verb, not a descriptive adjective."}], "commonality": 3, "difficulty": 3, "formality": 50, "politeness": 50, "id": "은-ㄴ-채-로", "matchStrings": ["은 채로", "ㄴ 채로", "은 채", "ㄴ 채"], "finalOnly": false}, {"pattern": "(으)련만 ((으)련마는)", "level": "advanced", "senses": [{"label": null, "definition": "Expresses a wistful, regretful, or counterfactual wish: 'if only X were the case, Y would be true — but it isn't.'", "formation": "Verb/Adj stem + -(으)련만", "examples": [["시간이 있으련만, 요즘은 너무 바빠서 힘드네요.", "If only I had the time — but lately I've been so busy it's just not possible."]], "notes": "More formal/literary than -면 좋겠는데; closely related to -건만 in tone."}], "commonality": 1, "difficulty": 5, "formality": 80, "politeness": 50, "id": "으-련만-으-련마는", "matchStrings": ["련만"], "finalOnly": true}, {"pattern": "-거니와", "level": "advanced", "senses": [{"label": null, "definition": "A formal connective meaning 'not only X, but also Y,' adding a second piece of information with escalating weight. More formal than -뿐만 아니라.", "formation": "Verb/Adj stem + -거니와", "examples": [["그분은 실력이 뛰어나거니와 인품도 훌륭합니다.", "Not only is she highly skilled, but her character is also admirable."]], "notes": "Common in speeches, academic writing, and news; both clauses typically share a similar sentiment."}], "commonality": 1, "difficulty": 5, "formality": 85, "politeness": 60, "id": "거니와", "matchStrings": ["거니와"], "finalOnly": false}, {"pattern": "-더라도", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'even if X is or were the case, Y still holds.' A strong concessive: the speaker grants the hypothetical truth of the first clause but insists the second still applies.", "formation": "Verb/Adj stem + -더라도", "examples": [["힘들더라도 포기하지 마세요.", "Even if it gets hard, please don't give up."], ["비가 오더라도 행사는 예정대로 진행됩니다.", "Even if it rains, the event will proceed as scheduled."]], "notes": "Can refer to real or hypothetical situations; does not specify whether the condition is actually true."}], "commonality": 4, "difficulty": 3, "formality": 55, "politeness": 55, "id": "더라도", "matchStrings": ["더라도"], "finalOnly": false}, {"pattern": "-더라고(요)", "level": "intermediate", "senses": [{"label": null, "definition": "Reports a first-hand observation the speaker discovered in the past, now shared as new information: 'I saw/found/noticed that X.' Expresses evidentiality — direct sensory evidence.", "formation": "Verb/Adj stem + -더라고(요)", "examples": [["그 식당 음식이 정말 맛있더라고요.", "I noticed (tried it and found) that the food at that restaurant was really delicious."]], "notes": "Cannot be used for things you couldn't directly observe; the -고요 ending softens it into a conversational tone."}], "commonality": 5, "difficulty": 2, "formality": 30, "politeness": 50, "id": "더라고-요", "matchStrings": ["더라고요", "더라고"], "finalOnly": true}, {"pattern": "-음으로써", "level": "advanced", "senses": [{"label": null, "definition": "Expresses the means or method by which a result is achieved: 'by doing X, Y is accomplished.' More formal/written than -해서.", "formation": "Verb stem + -음으로써", "examples": [["꾸준히 연습함으로써 실력을 키울 수 있어요.", "By practicing consistently, you can build up your skills."]], "notes": "The full form is -음으로써; -음으로 alone is used but is slightly less emphatic about the means."}], "commonality": 2, "difficulty": 4, "formality": 80, "politeness": 55, "id": "음으로써", "matchStrings": ["음으로써", "ㅁ으로써"], "finalOnly": false}, {"pattern": "-길래", "level": "intermediate", "senses": [{"label": null, "definition": "A causal connective (spoken) introducing an observed reason that prompted the speaker's reaction: 'because I saw/noticed that X, (so) I did Y.'", "formation": "Verb/Adj stem + -길래", "examples": [["세일을 하길래 충동적으로 사 버렸어요.", "I saw there was a sale going on, so I impulsively bought it."]], "notes": "Unlike -니까, often carries a slightly defensive or explanatory nuance about a reaction to a directly perceived stimulus."}], "commonality": 4, "difficulty": 2, "formality": 25, "politeness": 45, "id": "길래", "matchStrings": ["길래"], "finalOnly": false}, {"pattern": "-는 데", "level": "advanced", "senses": [{"label": null, "definition": "데 is a bound noun meaning 'a place,' 'a matter,' or 'a point.' -는 데 lets a verb clause function as a noun phrase referring to a situation, task, or location.", "formation": "Verb modifier + 데 (bound noun)", "examples": [["전통 문화를 보존하는 데 많은 노력이 필요해요.", "It takes a great deal of effort when it comes to preserving traditional culture."]], "notes": "Must be distinguished from the conjunctive -는데 (no space, meaning 'but/and') — as a bound noun, there is a space before 데."}], "commonality": 4, "difficulty": 4, "formality": 50, "politeness": 50, "id": "는-데", "matchStrings": ["는 데"], "finalOnly": false}, {"pattern": "-기 나름이다 / N 나름이다", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'it all depends on X' or 'it's entirely up to X' — the outcome varies entirely according to the factor mentioned.", "formation": "Verb stem + -기 나름이다 · Noun + 나름이다", "examples": [["취미 생활도 어떻게 하기 나름이에요.", "Hobbies, too — it all depends on how you approach them."]], "notes": "Comes from 나름대로 ('in its own way'); often used as encouragement or to reject a fixed view."}], "commonality": 3, "difficulty": 3, "formality": 40, "politeness": 50, "id": "기-나름이다-n-나름이다", "matchStrings": ["나름이다", "나름이에요"], "finalOnly": true}, {"pattern": "-을/ㄹ 줄만 알았지", "level": "advanced", "senses": [{"label": null, "definition": "Expresses that the speaker mistakenly assumed only X would happen, but something else occurred: 'I only thought/expected X — I didn't realize Y.'", "formation": "Verb stem + -(으)ㄹ 줄만 알았지", "examples": [["쉬울 줄만 알았지, 막상 해 보니 정말 어렵네요.", "I only thought it would be easy — but now that I'm actually doing it, it's really hard."]], "notes": "Carries a self-reproaching or mildly regretful nuance; implies 'but in fact Y happened.'"}], "commonality": 2, "difficulty": 4, "formality": 25, "politeness": 45, "id": "을-ㄹ-줄만-알았지", "matchStrings": ["줄만 알았지"], "finalOnly": true}, {"pattern": "-는 한", "level": "advanced", "senses": [{"label": null, "definition": "Means 'as long as X, Y holds' — Y is affirmed to be true for as long as X remains true. Common in promises and strong assertions.", "formation": "Verb modifier + 한 (bound noun: as long as)", "examples": [["내가 있는 한 절대로 포기하지 않을 거예요.", "As long as I am here, I will absolutely never give up."]], "notes": "Should not be confused with -ㄴ 한이 있더라도 ('even if it comes to that'); -는 한 expresses a sustaining condition."}], "commonality": 3, "difficulty": 4, "formality": 60, "politeness": 55, "id": "는-한", "matchStrings": ["는 한"], "finalOnly": false}, {"pattern": "-되", "level": "advanced", "senses": [{"label": null, "definition": "A formal connective meaning 'but,' 'however,' or 'while doing X, with the condition that Y.' Introduces a limiting proviso, common in legal/official Korean.", "formation": "Verb/Adj stem + -되", "examples": [["지원은 가능하되, 서류를 먼저 제출해야 합니다.", "Applications are accepted; however, documents must be submitted first."]], "notes": "Mostly written/formal; relatively rare in everyday speech. Often seen in regulations and contracts."}], "commonality": 1, "difficulty": 5, "formality": 90, "politeness": 60, "id": "되", "matchStrings": [], "finalOnly": false}, {"pattern": "-거나", "level": "intermediate", "senses": [{"label": null, "definition": "Connects two or more alternatives, meaning 'or': one option or the other (possibly both) applies.", "formation": "Verb/Adj stem + -거나", "examples": [["스트레스를 받으면 운동을 하거나 청소를 해요.", "When I'm stressed, I either exercise or clean."]], "notes": "Can chain more than two alternatives; unlike 아니면, it attaches directly to the verb/adjective stem."}], "commonality": 5, "difficulty": 1, "formality": 50, "politeness": 50, "id": "거나", "matchStrings": ["거나"], "finalOnly": false}, {"pattern": "-고 나서", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'after finishing X' — the second action happens only once the first is fully completed.", "formation": "Verb stem + -고 나서", "examples": [["주말에 청소를 하고 나서 요리를 했어요.", "On the weekend, after cleaning, I cooked."]], "notes": "Emphasizes completion of the first action before the second begins, more so than plain -고."}], "commonality": 5, "difficulty": 1, "formality": 50, "politeness": 50, "id": "고-나서", "matchStrings": ["고 나서"], "finalOnly": false}, {"pattern": "-는 길에", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'on the way while doing X' — an incidental action happens in the course of going somewhere.", "formation": "Verb (present) modifier + 길에", "examples": [["집에 돌아오는 길에 과일 좀 사 오세요.", "On your way home, please pick up some fruit."]], "notes": "Limited to motion verbs like 가다/오다/나가다 — describes something done en route."}], "commonality": 3, "difficulty": 2, "formality": 40, "politeness": 50, "id": "는-길에", "matchStrings": ["는 길에"], "finalOnly": false}, {"pattern": "-는 데다가", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'on top of X / in addition to X' — adds a second fact that compounds or intensifies the first, often making a situation more extreme.", "formation": "Verb (present) -는 데다가 · Adjective -(으)ㄴ 데다가", "examples": [["오늘은 비가 오는 데다가 바람까지 불어서 제대로 걸을 수가 없다.", "Today it's not only raining, but the wind is blowing too, so I can barely walk."]], "notes": "Both facts usually point in the same direction (both positive or both negative), intensifying the overall statement."}], "commonality": 4, "difficulty": 3, "formality": 50, "politeness": 50, "id": "는-데다가", "matchStrings": ["데다가"], "finalOnly": false}, {"pattern": "-든지", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'whether X or Y' / 'no matter which' — expresses that the choice among alternatives doesn't matter to the outcome.", "formation": "Verb/Adj stem + -든지 (often doubled: -든지 -든지)", "examples": [["우산이 비싸든지 싸든지 무조건 사 오세요.", "Whether the umbrella is expensive or cheap, just buy it no matter what."]], "notes": "Often doubled across two alternatives, or combined with question words (누구든지, 언제든지) to mean 'anyone/anytime at all.'"}], "commonality": 4, "difficulty": 2, "formality": 45, "politeness": 50, "id": "든지", "matchStrings": ["든지"], "finalOnly": false}, {"pattern": "-아/어도", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'even if / even though X' — the result in the second clause holds true regardless of the first clause.", "formation": "Verb/Adj stem + -아/어도", "examples": [["무슨 일이 있어도 오늘까지는 이 일을 꼭 끝내야 해요.", "No matter what happens, I have to finish this by today."]], "notes": "The most basic/common concessive ending; less formal than -더라도."}], "commonality": 5, "difficulty": 1, "formality": 50, "politeness": 50, "id": "아-어도", "matchStrings": ["아도", "어도", "여도"], "finalOnly": false}, {"pattern": "-(으)나 마나", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'whether you do X or not, the result is the same' — implies doing X is essentially pointless because the outcome won't change.", "formation": "Verb stem + -(으)나 마나", "examples": [["선생님께 물어보나 마나 허락하지 않으실 거예요.", "Whether we ask the teacher or not, they're not going to allow it anyway."]], "notes": "Carries a resigned or slightly dismissive tone about the futility of the action."}], "commonality": 3, "difficulty": 3, "formality": 30, "politeness": 45, "id": "으-나-마나", "matchStrings": ["나 마나"], "finalOnly": false}, {"pattern": "-(으)려고", "level": "intermediate", "senses": [{"label": null, "definition": "Expresses intention or purpose: 'intending to X' or 'in order to X,' setting up the reason behind the main clause's action.", "formation": "Verb stem + -(으)려고", "examples": [["친구 결혼식 때 입으려고 양복을 미리 사 두었다.", "I bought a suit in advance, intending to wear it to my friend's wedding."]], "notes": "Cannot be followed directly by a command or suggestion in the same clause; states intent behind a separate action."}], "commonality": 5, "difficulty": 1, "formality": 45, "politeness": 50, "id": "으-려고", "matchStrings": ["으려고", "려고"], "finalOnly": false}, {"pattern": "-(으)려다가", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'was about to/intending to do X, but then (something else happened instead).' The original intention was interrupted or changed.", "formation": "Verb stem + -(으)려다가", "examples": [["친구랑 밥을 먹으러 가려다가 그냥 도서관에 가기로 했다.", "I was going to go eat with a friend, but then decided to just go to the library instead."]], "notes": "Always implies a change of plan — the original intention was not carried out."}], "commonality": 3, "difficulty": 2, "formality": 40, "politeness": 50, "id": "으-려다가", "matchStrings": ["으려다가", "려다가"], "finalOnly": false}, {"pattern": "-(으)려면", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'if you intend to / want to do X, (then you need to do Y)' — sets up a condition tied to a goal or intention.", "formation": "Verb stem + -(으)려면", "examples": [["한국어를 잘하려면 열심히 공부해야 돼요.", "If you want to become good at Korean, you have to study hard."]], "notes": "Almost always paired with a following clause stating what's required to achieve the stated intention."}], "commonality": 5, "difficulty": 2, "formality": 45, "politeness": 50, "id": "으-려면", "matchStrings": ["으려면", "려면"], "finalOnly": false}, {"pattern": "-(으)ㄹ수록", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'the more X, the more Y' — expresses a proportional relationship where increasing one thing increases another.", "formation": "Verb/Adj stem + -(으)ㄹ수록 (often doubled: -(으)면 -(으)ㄹ수록)", "examples": [["한국어는 배우면 배울수록 재미있어요.", "The more you learn Korean, the more interesting it gets."]], "notes": "Frequently appears in the doubled pattern -(으)면 -(으)ㄹ수록 for extra emphasis on the proportional relationship."}], "commonality": 5, "difficulty": 2, "formality": 50, "politeness": 50, "id": "으-ㄹ수록", "matchStrings": ["을수록", "ㄹ수록"], "finalOnly": false}, {"pattern": "-(으)면서", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'while X-ing' — two actions happen at the same time, performed by the same subject.", "formation": "Verb stem + -(으)면서", "examples": [["저는 음악을 들으면서 공부를 해요.", "I study while listening to music."]], "notes": "Both actions must share the same subject and happen simultaneously; can also imply mild contrast in some contexts ('while X, also Y')."}], "commonality": 5, "difficulty": 1, "formality": 50, "politeness": 50, "id": "으-면서", "matchStrings": ["으면서", "면서"], "finalOnly": false}, {"pattern": "-(으)ㄹ 정도로", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'to the extent/degree that X' — describes how intense or extreme something is by comparing it to a resulting degree.", "formation": "Verb/Adj stem + -(으)ㄹ 정도로", "examples": [["그 영화는 눈물이 날 정도로 슬펐지만 울지 않고 참았다.", "The movie was sad enough to bring tears, but I held back and didn't cry."]], "notes": "Similar in spirit to -을/ㄹ 만큼; both describe degree via a comparison point."}], "commonality": 4, "difficulty": 3, "formality": 50, "politeness": 50, "id": "으-ㄹ-정도로", "matchStrings": ["정도로"], "finalOnly": false}, {"pattern": "-곤 하다", "level": "intermediate", "senses": [{"label": null, "definition": "Describes a habitual or repeated action in the past or as a general tendency: 'used to do X (regularly)' or 'X happens from time to time.'", "formation": "Verb stem + -곤 하다", "examples": [["나는 시간이 나면 공원을 산책하곤 해요.", "When I have free time, I often take a walk in the park."]], "notes": "Implies repetition over time, not a one-off occurrence."}], "commonality": 4, "difficulty": 2, "formality": 45, "politeness": 50, "id": "곤-하다", "matchStrings": ["곤 하"], "finalOnly": true}, {"pattern": "-기 마련이다", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'it's bound to be the case that X' or 'naturally X' — expresses a general truth or inevitable tendency.", "formation": "Verb/Adj stem + -기 마련이다", "examples": [["사람은 나이가 들면 누구나 늙기 마련이에요.", "Everyone is bound to grow old as they age — that's just natural."]], "notes": "States a universal or near-universal truth, often used to reassure or normalize a situation."}], "commonality": 4, "difficulty": 3, "formality": 55, "politeness": 55, "id": "기-마련이다", "matchStrings": ["마련이다", "마련이에요", "마련이야"], "finalOnly": true}, {"pattern": "-기로 하다", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'to decide to do X' — the subject makes a decision or plan to carry out an action.", "formation": "Verb stem + -기로 하다", "examples": [["이번 방학에는 친구와 함께 여행을 가기로 했어요.", "This vacation, I've decided to go traveling with a friend."]], "notes": "Marks a firm decision, often about future plans, and is very commonly used in everyday conversation."}], "commonality": 5, "difficulty": 2, "formality": 45, "politeness": 50, "id": "기로-하다", "matchStrings": ["기로 했", "기로 하"], "finalOnly": true}, {"pattern": "-게 되다", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'to come to be / end up X-ing' — describes a change of state that happens due to circumstances, often not by the subject's own direct choice.", "formation": "Verb/Adj stem + -게 되다", "examples": [["다음 달에 미국으로 유학을 가게 되었어요.", "It's been arranged that I'll go study abroad in the US next month."]], "notes": "Often implies the change came about through circumstance rather than deliberate personal decision — contrast with -기로 하다, which implies a direct decision."}], "commonality": 5, "difficulty": 2, "formality": 45, "politeness": 50, "id": "게-되다", "matchStrings": ["게 되었", "게 됐", "게 되"], "finalOnly": true}, {"pattern": "-는 수가 있다", "level": "intermediate", "senses": [{"label": null, "definition": "Warns that there are cases/situations where a particular (usually undesirable) outcome can occur: 'there are times when X can happen.'", "formation": "Verb (present) modifier + 수가 있다", "examples": [["그렇게 공부를 안 하다가는 후회하는 수가 있어요.", "If you keep not studying like that, there may come a time you regret it."]], "notes": "Used more as a cautionary warning than plain -을 수 있다, which is neutral possibility."}], "commonality": 3, "difficulty": 3, "formality": 40, "politeness": 50, "id": "는-수가-있다", "matchStrings": ["는 수가 있"], "finalOnly": true}, {"pattern": "-던데요", "level": "intermediate", "senses": [{"label": null, "definition": "Shares a past observation with a tone that invites reaction or sets up context, often with mild surprise: 'it was X, you know' or 'X, as I recall.'", "formation": "Verb/Adj stem + -던데요", "examples": [["어제 그 영화를 봤는데 엄청 재미있던데요.", "I watched that movie yesterday, and it was really fun, you know."]], "notes": "Reports a direct past observation, similar to -더라고요, but with a more conversational, reaction-inviting tone."}], "commonality": 4, "difficulty": 3, "formality": 30, "politeness": 50, "id": "던데요", "matchStrings": ["던데요"], "finalOnly": true}, {"pattern": "-아/어 있다", "level": "intermediate", "senses": [{"label": null, "definition": "Describes a resultant state: the subject is currently in the state that resulted from a completed action, e.g., 'is (sitting/standing/hung, etc.).'", "formation": "Verb stem + -아/어 있다", "examples": [["우리 교실 벽에는 세계지도와 시계가 걸려 있다.", "On our classroom wall, there's a world map and a clock hanging."]], "notes": "Only used with a limited set of verbs describing position/state changes (앉다, 서다, 걸리다, 열리다, etc.) — contrast with -고 있다, which describes an ongoing action."}], "commonality": 5, "difficulty": 1, "formality": 50, "politeness": 50, "id": "아-어-있다", "matchStrings": ["아 있", "어 있"], "finalOnly": true}, {"pattern": "-았/었으면 하다", "level": "intermediate", "senses": [{"label": null, "definition": "Expresses a wish or hope, often gentler and more indirect than -고 싶다: 'I hope that X (would happen).'", "formation": "Verb/Adj stem + -았/었으면 하다", "examples": [["대학교를 졸업하고 한국에서 직장을 구했으면 합니다.", "I hope that after graduating from university, I can find a job in Korea."]], "notes": "Softer and more polite than stating a direct wish; commonly used in formal or written requests."}], "commonality": 4, "difficulty": 2, "formality": 60, "politeness": 65, "id": "았-었으면-하다", "matchStrings": ["았으면 하", "었으면 하"], "finalOnly": true}, {"pattern": "-(으)려나 보다", "level": "advanced", "senses": [{"label": null, "definition": "Expresses a tentative guess that something is about to happen, based on indirect evidence: 'it seems like X is about to happen / I guess X.'", "formation": "Verb stem + -(으)려나 보다", "examples": [["하늘이 어두워지는 걸 보니 비가 오려나 봐요.", "Seeing the sky get dark, I guess it's about to rain."]], "notes": "A softer, more tentative inference than -는 모양이다; often based on a small observed cue."}], "commonality": 3, "difficulty": 4, "formality": 35, "politeness": 50, "id": "으-려나-보다", "matchStrings": ["려나 봐", "려나 보"], "finalOnly": true}, {"pattern": "-(으)려던 참이다", "level": "advanced", "senses": [{"label": null, "definition": "Means 'was just about to do X' — describes an action the speaker was on the verge of starting when something else happened (often being asked to do it).", "formation": "Verb stem + -(으)려던 참이다", "examples": [["저도 지금 막 가려던 참이었어요.", "I was just about to leave right now, actually."]], "notes": "Frequently used to agree with or confirm a suggestion that matches what the speaker was already about to do."}], "commonality": 3, "difficulty": 3, "formality": 35, "politeness": 50, "id": "으-려던-참이다", "matchStrings": ["려던 참"], "finalOnly": true}, {"pattern": "-는/은 줄 모르다(알다)", "level": "advanced", "senses": [{"label": null, "definition": "Means 'didn't know/realize that X was the case' (or, with 알다, 'thought/knew that X was the case') — describes a (often mistaken) assumption about a fact.", "formation": "Verb/Adj modifier + 줄 모르다/알다", "examples": [["영미 씨가 한국어를 이렇게 잘하는 줄 몰랐어요.", "I didn't realize Yeong-mi was this good at Korean."]], "notes": "Frequently used to express surprise at discovering the assumption was wrong."}], "commonality": 4, "difficulty": 3, "formality": 40, "politeness": 50, "id": "는-은-줄-모르다-알다", "matchStrings": ["줄 몰랐", "줄 알았"], "finalOnly": false}, {"pattern": "-는걸요, -(으)ㄴ걸요", "level": "advanced", "senses": [{"label": null, "definition": "A sentence-final ending expressing mild surprise, gentle assertion, or a soft counter to what was just said: 'well, actually X, you know.'", "formation": "Verb (present) -는걸요 · Adjective -(으)ㄴ걸요", "examples": [["평소에는 몰랐는데 치마를 입으니 여성스러운걸요.", "I didn't notice before, but now that she's wearing a skirt, she looks quite feminine, doesn't she."]], "notes": "Softer and more casual than a flat statement; often carries a note of newly-realized appreciation or mild pushback."}], "commonality": 3, "difficulty": 3, "formality": 25, "politeness": 45, "id": "는걸요-으-ㄴ걸요", "matchStrings": ["는걸요", "ㄴ걸요", "은걸요"], "finalOnly": true}, {"pattern": "-(으)ㄹ 듯하다", "level": "advanced", "senses": [{"label": null, "definition": "Means 'it seems like X / it looks like X will happen' — a guess based on the speaker's impression, similar to -는 것 같다 but more formal.", "formation": "Verb/Adj stem + -(으)ㄹ 듯하다", "examples": [["오늘 일이 많아서 회식에 참석하지 못할 듯합니다.", "Since I have a lot of work today, it seems I won't be able to attend the dinner."]], "notes": "More formal/written in register than -는 것 같다; common in polite or business contexts."}], "commonality": 4, "difficulty": 3, "formality": 60, "politeness": 55, "id": "으-ㄹ-듯하다", "matchStrings": ["듯합니다", "듯해요", "듯하다"], "finalOnly": true}, {"pattern": "-(으)ㄹ 리가 없다", "level": "advanced", "senses": [{"label": null, "definition": "Means 'there's no way X could be true' — expresses strong disbelief or certainty that something is impossible given what the speaker knows.", "formation": "Verb/Adj stem + -(으)ㄹ 리가 없다", "examples": [["등산을 싫어하는 다나카 씨가 산에 갈 리가 없다.", "There's no way Tanaka, who hates hiking, would go to the mountains."]], "notes": "Expresses the speaker's confident logical conclusion, not a simple guess — stronger than -지 않을 것 같다."}], "commonality": 4, "difficulty": 3, "formality": 45, "politeness": 50, "id": "으-ㄹ-리가-없다", "matchStrings": ["리가 없"], "finalOnly": true}, {"pattern": "-(으)ㄹ 수밖에 없다", "level": "intermediate", "senses": [{"label": null, "definition": "Means 'there's no choice but to X / can't help but X' — the outcome is unavoidable given the circumstances.", "formation": "Verb/Adj stem + -(으)ㄹ 수밖에 없다", "examples": [["그렇게 열심히 하는데 성공할 수밖에 없지요.", "Working that hard, of course they can't help but succeed."]], "notes": "Frames the situation as leaving no real alternative, whether that outcome document.getElementById('authSubmit').addEventListener('click', async ()=>{
  const rawInput = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if(!rawInput || !password){ showAuthMsg('Enter email and password.', 'error'); return; }
  if(authMode === 'signup'){
    const email = rawInput;
    const displayName = document.getElementById('displayNameInput').value.trim();
    if(!displayName){ showAuthMsg('Enter a name.', 'error'); return; }
    const { data: available, error: availError } = await supabaseClient.rpc('display_name_available', { dname: displayName });
    if(!availError && available === false){ showAuthMsg(t('duplicateName'), 'error'); return; }
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if(error){ showAuthMsg(error.message, 'error'); return; }
    if(data.user){
      const { error: profileError } = await supabaseClient.from('profiles').upsert({ id: data.user.id, display_name: displayName });
      if(profileError){ showAuthMsg(t('duplicateName'), 'error'); return; }
    }
    if(data.session){ onAuthed(data.user); }
    else { showAuthMsg('Account created. Check your email to confirm, then sign in.', 'info'); }
  } else {
    let email = rawInput;
    if(!email.includes('@')){
      const { data: resolvedEmail, error: lookupError } = await supabaseClient.rpc('email_for_display_name', { dname: rawInput });
      if(lookupError || !resolvedEmail){ showAuthMsg('No account found with that name.', 'error'); return; }
      email = resolvedEmail;
    }
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ showAuthMsg(error.message, 'error'); return; }
    onAuthed(data.user);
  }
});

/* ---------- STUDY HELPERS ---------- */
function dayTotal(userId, dateKey){
  const u = allEntries[userId];
  if(!u || !u[dateKey]) return 0;
  return Object.values(u[dateKey]).reduce((a,b)=>a+Number(b),0);
}
function computeStreak(userId){
  let streak = 0; let d = new Date();
  if(!(dayTotal(userId, todayStr(d)) >= GOAL)) d.setDate(d.getDate()-1);
  while(true){
    const key = todayStr(d);
    if(dayTotal(userId, key) >= GOAL){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function computeWeekTotal(userId){
  const now = new Date(); const day = now.getDay();
  const mondayOffset = day === 0 ? 6 : day - 1;
  const monday = new Date(now); monday.setDate(now.getDate() - mondayOffset);
  let sum = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d > now) break;
    sum += dayTotal(userId, todayStr(d));
  }
  return sum;
}
function computeTotal(userId){
  const u = allEntries[userId];
  if(!u) return 0;
  return Object.keys(u).reduce((a,k)=>a+dayTotal(userId,k),0);
}
function levelFor(hours){
  if(!hours) return '';
  if(hours >= GOAL) return 'hit';
  if(hours >= GOAL*0.66) return 'l3';
  if(hours >= GOAL*0.33) return 'l2';
  if(hours > 0) return 'l1';
  return '';
}

  allEntries = {};

  const { data: bookRows } = await supabaseClient.from('books').select('*').order('created_at', {ascending:false});
  allBooks = {};

  const { data: subRows } = await supabaseClient.from('event_subscriptions').select('*');

function icsEscape(s){ return String(s).replace(/[,;]/g, c=>'\\'+c).replace(/\n/g,'\\n'); }
function icsDateTimeUTC(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function icsRRule(ev){
  if(!ev.recur_freq) return null;
  const freqMap = { day:'DAILY', week:'WEEKLY', month:'MONTHLY' };
  let rule = `FREQ=${freqMap[ev.recur_freq]};INTERVAL=${ev.recur_interval||1}`;
  if(ev.recur_end_type === 'date' && ev.recur_end_date){
    rule += `;UNTIL=${ev.recur_end_date.replace(/-/g,'')}T235959Z`;

/* ---------- ICS IMPORT ---------- */
function unfoldICS(text){
  return text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');
}
function unescapeICSText(s){
  return String(s||'').replace(/\\n/g,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
}
function parseICS(text){
  const unfolded = unfoldICS(text);
  const lines = unfolded.split('\n');
  const events = [];
  let cur = null;
  lines.forEach(rawLine=>{
    const line = rawLine.trim();
    if(line === 'BEGIN:VEVENT'){ cur = {}; return; }
    if(line === 'END:VEVENT'){ if(cur && cur.title && cur.date) events.push(cur); cur = null; return; }
    if(!cur) return;
    const idx = line.indexOf(':');
    if(idx === -1) return;
    const keyPart = line.slice(0, idx);
    const value = line.slice(idx+1);
    const key = keyPart.split(';')[0].toUpperCase();
    if(key === 'SUMMARY'){ cur.title = unescapeICSText(value); }
    else if(key === 'DESCRIPTION'){ cur.notes = unescapeICSText(value); }
    else if(key === 'RRULE'){ cur.rrule = value; }
    else if(key === 'DTSTART'){
      const digits = value.replace(/[^0-9T]/g,'');
      const datePart = digits.split('T')[0];
      if(datePart.length >= 8){
        cur.date = `${datePart.slice(0,4)}-${datePart.slice(4,6)}-${datePart.slice(6,8)}`;
      }
      const timePart = digits.includes('T') ? digits.split('T')[1] : '';
      if(timePart.length >= 4){
        cur.time = `${timePart.slice(0,2)}:${timePart.slice(2,4)}`;
      }
    }
  });
  return events;
}
function parseRRule(rrule){
  const parts = {};
  rrule.split(';').forEach(p=>{
    const kv = p.split('=');
    if(kv[0]) parts[kv[0].toUpperCase()] = kv[1];
  });
  return parts;
}
function isBirthdayTitle(title){
  const s = (title||'').toLowerCase();
  return s.includes('birthday') || s.includes('fødselsdag');
}
function classifyImportedEvents(parsed){
  const results = [];
  const consumed = new Set();
  const byTitle = {};
  parsed.forEach((ev, idx)=>{
    const key = (ev.title||'').trim();
    if(!byTitle[key]) byTitle[key] = [];
    byTitle[key].push(Object.assign({}, ev, { idx }));
  });

  parsed.forEach((ev, idx)=>{
    if(consumed.has(idx)) return;

    if(isBirthdayTitle(ev.title)){
      results.push({
        title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
        kind: 'birthday', recur_freq: 'year', recur_interval: 1, recur_end_type: 'never', recur_end_date: null
      });
      consumed.add(idx);
      return;
    }

    if(ev.rrule){
      const rr = parseRRule(ev.rrule);
      let endDate = null;
      if(rr.UNTIL){
        const d = rr.UNTIL.replace(/[^0-9]/g,'').slice(0,8);
        endDate = `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
      }
      if(rr.FREQ === 'WEEKLY'){
        results.push({
          title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
          kind: 'course', recur_freq: 'week', recur_interval: parseInt(rr.INTERVAL)||1,
          recur_end_type: endDate ? 'date' : 'never', recur_end_date: endDate
        });
        consumed.add(idx);
        return;
      }
      const freqMap = {DAILY:'day', WEEKLY:'week', MONTHLY:'month', YEARLY:'year'};
      results.push({
        title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
        kind: 'imported', recur_freq: freqMap[rr.FREQ] || null, recur_interval: parseInt(rr.INTERVAL)||1,
        recur_end_type: endDate ? 'date' : 'never', recur_end_date: endDate
      });
      consumed.add(idx);
      return;
    }

    const group = (byTitle[(ev.title||'').trim()] || []).filter(g => !consumed.has(g.idx));
    if(group.length >= 4){
      const sorted = group.slice().sort((a,b)=> a.date.localeCompare(b.date));
      let bestStart=0, bestLen=1, curStart=0, curLen=1;
      for(let i=1;i<sorted.length;i++){
        const prev = new Date(sorted[i-1].date);
        const curD = new Date(sorted[i].date);
        const diffDays = Math.round((curD-prev)/86400000);
        if(diffDays === 7){ curLen++; }
        else { if(curLen>bestLen){bestLen=curLen;bestStart=curStart;} curStart=i; curLen=1; }
      }
      if(curLen>bestLen){bestLen=curLen;bestStart=curStart;}
      if(bestLen >= 4){
        const runItems = sorted.slice(bestStart, bestStart+bestLen);
        results.push({
          title: ev.title, date: runItems[0].date, time: runItems[0].time || null, notes: runItems[0].notes || null,
          kind: 'course', recur_freq: 'week', recur_interval: 1,
          recur_end_type: 'date', recur_end_date: runItems[runItems.length-1].date
        });
        runItems.forEach(ri => consumed.add(ri.idx));
        return;
      }
    }

    results.push({
      title: ev.title, date: ev.date, time: ev.time || null, notes: ev.notes || null,
      kind: 'imported', recur_freq: null, recur_interval: 1, recur_end_type: 'never', recur_end_date: null
    });
    consumed.add(idx);
  });

  return results;
}
async function importIcsFile(file){
  const text = await file.text();
  let parsed;
  try{ parsed = parseICS(text); }catch(e){ parsed = []; }
  if(parsed.length === 0){
    alert(t('importFail'));
    return;
  }
  const classified = classifyImportedEvents(parsed);
  const rows = classified.map(ev => ({
    user_id: currentUser.id,
    title: ev.title || 'Untitled',
    kind: ev.kind,
    event_date: ev.date,
    event_time: ev.time || null,
    notes: ev.notes || null,
    color: ev.kind === 'course' ? '#6E8FB0' : ev.kind === 'birthday' ? '#B37B4F' : '#8B8578',
    recur_freq: ev.recur_freq,
    recur_interval: ev.recur_interval,
    recur_end_type: ev.recur_end_type,
    recur_end_date: ev.recur_end_date,
    is_private: false
  }));
  const { data, error } = await supabaseClient.from('events').insert(rows).select();
  if(!error && data){
    if(!allEvents[currentUser.id]) allEvents[currentUser.id] = [];
    allEvents[currentUser.id].push(...data);
    renderCalendarTab();
    alert(t('importSuccess').replace('{n}', data.length));
  } else {
    alert(t('importFail'));
  }
}

function formatCountdown(target){
  const diff = target - new Date();
  if(diff <= 0) return null;
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  return `${days}d ${hours}h ${mins}m`;
}

}

function formatTime12h(t){
  if(!t) return '';
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr,10);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${mStr} ${ampm}`;
}

function expandOccurrences(ev, rangeStartStr, rangeEndStr){
  const rangeStart = new Date(rangeStartStr);
  const rangeEnd = new Date(rangeEndStr);
  const excluded = new Set(ev.excluded_dates || []);
  if(!ev.recur_freq){
    if(excluded.has(ev.event_date)) return [];
    const d = new Date(ev.event_date);
    return (d >= rangeStart && d <= rangeEnd) ? [ev.event_date] : [];
  }
  const occ = [];
  let cur = new Date(ev.event_date);
  const interval = ev.recur_interval || 1;
  const recurEnd = (ev.recur_end_type === 'date' && ev.recur_end_date) ? new Date(ev.recur_end_date) : null;
  let safety = 0;
  while(cur <= rangeEnd && safety < 2000){
    safety++;
    if(recurEnd && cur > recurEnd) break;
    const dateKey = todayStr(cur);
    if(cur >= rangeStart && cur <= rangeEnd && !excluded.has(dateKey)){ occ.push(dateKey); }
    if(ev.recur_freq === 'day') cur.setDate(cur.getDate() + interval);
    else if(ev.recur_freq === 'week') cur.setDate(cur.getDate() + interval*7);
    else if(ev.recur_freq === 'month') cur.setMonth(cur.getMonth() + interval);
    else if(ev.recur_freq === 'year') cur.setFullYear(cur.getFullYear() + interval);
    else break;
  }
  return occ;
}

function nextOccurrence(ev){
  const today = todayStr();
  const farFuture = todayStr(new Date(Date.now() + 1000*60*60*24*365*3));
  if(!ev.recur_freq){ return ev.event_date; }
  const occ = expandOccurrences(ev, today, farFuture);
  if(occ.length > 0) return occ[0];
  const recurEnd = (ev.recur_end_type === 'date' && ev.recur_end_date) ? ev.recur_end_date : null;
  return recurEnd || ev.event_date;
}

function recurBadgeText(ev){
  if(!ev.recur_freq) return '';
  const n = ev.recur_interval || 1;
  const unitKey = ev.recur_freq === 'day' ? 'repeatDay' : ev.recur_freq === 'week' ? 'repeatWeek' : ev.recur_freq === 'year' ? 'repeatYear' : 'repeatMonth';
  let text = t('recurBadge').replace('{n}', n).replace('{unit}', t(unitKey).toLowerCase());
  if(ev.recur_end_type === 'date' && ev.recur_end_date){
    text += ' · ' + t('recurUntil').replace('{date}', ev.recur_end_date);
  } else {
    text += ' · ' + t('recurForever');
  }
  return text;
}

function fineCountdownText(targetMs, nowMs){
  const diffMs = targetMs - nowMs;
  const absMs = Math.abs(diffMs);
  const h = Math.floor(absMs/3600000);
  const m = Math.floor((absMs%3600000)/60000);
  const s = Math.floor((absMs%60000)/1000);
  const parts = [];
  if(h>0) parts.push(h+'h');
  parts.push(m+'m');
  if(h===0) parts.push(s+'s');
  const fine = parts.join(' ');
  return diffMs >= 0 ? `${fine} ${t('fineLeft')}` : `${fine} ${t('fineAgo')}`;
}

  if(Math.abs(diffMsExact) < 86400000){
    daysText = fineCountdownText(target.getTime(), now.getTime());
    soon = true;
  }
  else if(diffDays > 0){ daysText = diffDays + ' ' + pluralUnit(diffDays, t('dayLeftSingular'), t('daysLeft')); soon = diffDays <= 7; }
  else if(diffDays === 0){ daysText = t('today'); soon = true; }

async function saveSubscription(eventId){
  const draft = reminderDrafts[eventId];
  if(!draft) return;
  const existing = allSubsByEvent[eventId] || {};
  const recipients = Array.from(draft.recipients);
  if(recipients.length > 0){
    const rows = recipients.map(uid => ({
      event_id: eventId, user_id: uid, applies_to: draft.appliesTo, reminders: draft.reminders
    }));
    await supabaseClient.from('event_subscriptions').upsert(rows, { onConflict: 'event_id,user_id' });
  }
  const toRemove = Object.keys(existing).filter(uid => !draft.recipients.has(uid));
  for(const uid of toRemove){
    await supabaseClient.from('event_subscriptions').delete().eq('event_id', eventId).eq('user_id', uid);
  }
  const { data: freshRows } = await supabaseClient.from('event_subscriptions').select('*').eq('event_id', eventId);
  allSubsByEvent[eventId] = {};
  (freshRows||[]).forEach(s=>{ allSubsByEvent[eventId][s.user_id] = s; });
  mySubscriptions[eventId] = allSubsByEvent[eventId][currentUser.id];
  if(!mySubscriptions[eventId]) delete mySubscriptions[eventId];
  expandedSubscribe.delete(eventId);
  renderCalendarTab();
}
async function removeSubscription(eventId){
  await supabaseClient.from('event_subscriptions').delete().eq('event_id', eventId).eq('user_id', currentUser.id);
  delete mySubscriptions[eventId];
  if(allSubsByEvent[eventId]) delete allSubsByEvent[eventId][currentUser.id];
  delete reminderDrafts[eventId];
  expandedSubscribe.delete(eventId);
  renderCalendarTab();
}

function renderKindList(kind, listId, controlsId){
  const list = document.getElementById(listId);
  const controls = document.getElementById(controlsId);
  list.innerHTML = '';
  controls.innerHTML = '';
  const items = itemsOfKind(kind);
  if(items.length === 0){ list.innerHTML = '<div class="empty">—</div>'; return; }

  const state = listState[kind];
  let toShow;

  if(!state.expanded){
    toShow = items.slice(0, PREVIEW_SIZE);
  } else {
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if(state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * PAGE_SIZE;
    toShow = items.slice(start, start + PAGE_SIZE);
  }
  toShow.forEach(ev => list.appendChild(buildEventRowEl(ev)));

  if(!state.expanded && items.length > PREVIEW_SIZE){
    const moreBtn = document.createElement('button');
    moreBtn.className = 'show-more-btn';
    moreBtn.textContent = `${t('showMore')} (${items.length - PREVIEW_SIZE})`;
    moreBtn.addEventListener('click', ()=>{ state.expanded = true; state.page = 1; renderCalendarTab(); });
    controls.appendChild(moreBtn);
  } else if(state.expanded){
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if(totalPages > 1){
      const nav = document.createElement('div');
      nav.className = 'list-controls';
      const mkBtn = (label, page, disabled)=>{
        const b = document.createElement('button');
        b.textContent = label;
        b.disabled = !!disabled;
        b.className = 'page-btn' + (page === state.page ? ' active' : '');
        b.addEventListener('click', ()=>{ state.page = page; renderCalendarTab(); });
        return b;
      };
      nav.appendChild(mkBtn('«', 1, state.page === 1));
      nav.appendChild(mkBtn('‹', Math.max(1, state.page - 1), state.page === 1));
      for(let p = 1; p <= totalPages; p++){ nav.appendChild(mkBtn(String(p), p, false)); }
      nav.appendChild(mkBtn('›', Math.min(totalPages, state.page + 1), state.page === totalPages));
      nav.appendChild(mkBtn('»', totalPages, state.page === totalPages));
      controls.appendChild(nav);
    }
    if(items.length > PREVIEW_SIZE){
      const lessBtn = document.createElement('button');
      lessBtn.className = 'show-more-btn';
      lessBtn.textContent = t('showLess');
      lessBtn.addEventListener('click', ()=>{ state.expanded = false; state.page = 1; renderCalendarTab(); });
      controls.appendChild(lessBtn);
    }
  }
}

function textColorFor(hex){
  if(!hex) return '#fff';
  const h = hex.replace('#','');
  if(h.length !== 6) return '#fff';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#1E1F22' : '#fff';
}

function isMobileDevice(){ return window.innerWidth <= 640; }
function shortenTitleForMobile(title){
  if(!title) return title;
  const fillers = new Set(['the','in','to','from','of','and']);
  const words = title.split(/\s+/).filter(Boolean);
  const clusters = [];
  let current = '';
  words.forEach(w=>{
    const clean = w.toLowerCase().replace(/[^a-z]/g,'');
    if(w === '&' || fillers.has(clean)){
      if(current){ clusters.push(current); current = ''; }
      return;
    }
    current += w.charAt(0).toUpperCase();
  });
  if(current) clusters.push(current);
  if(clusters.length === 0) return title;
  return clusters.join(' ');
}

function timeToMinutes(t){

}
