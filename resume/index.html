<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kristoffer Tiedemann — Resume</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --paper:#FAF7F0; --ink:#1C1C1C; --ink-soft:#6B6B63; --line:#E4DFD3; --celadon-4:#4F7563;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#181816; --ink:#EDEAE1; --ink-soft:#9C978A; --line:#33332E; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 20px;height:100%;display:flex;flex-direction:column;}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;flex:0 0 auto;}
  h1{font-size:18px;margin:0;font-weight:700;}
  .hint{font-size:12.5px;color:var(--ink-soft);}
  .pdf-frame{flex:1 1 auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:70vh;background:#fff;}
  .pdf-frame embed, .pdf-frame iframe{width:100%;height:100%;border:none;}
  .empty-state{flex:1 1 auto;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:10px;color:var(--ink-soft);font-size:14px;text-align:center;padding:40px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kristoffer Tiedemann</h1>
    <span class="hint" id="statusHint"></span>
  </header>
  <div id="content"></div>
</div>
<script>
  // Fully standalone, public, no auth, no app chrome, no shared code with
  // index.html on purpose -- this page must keep working even if the main
  // app is broken. The PDF is uploaded from Settings (admin-only) to the
  // "resume" Storage bucket at the fixed path resume.pdf, so this page just
  // has to know that one URL, never a Supabase client/session.
  //
  // Interim state: this simply displays the uploaded PDF in-browser. The
  // longer-term plan (once the real resume PDF exists) is to analyze its
  // layout and regenerate matching HTML/CSS here instead, so a re-upload
  // regenerates the page in the exact same layout automatically -- that
  // part needs a real PDF to design against, so it isn't built yet.
  const RESUME_URL = 'https://kbqwitmxpmkueryjsyip.supabase.co/storage/v1/object/public/resume/resume.pdf';
  fetch(RESUME_URL, { method: 'HEAD' }).then(res=>{
    const content = document.getElementById('content');
    if(res.ok){
      content.innerHTML = '<div class="pdf-frame"><embed src="' + RESUME_URL + '" type="application/pdf"></div>';
    } else {
      content.innerHTML = '<div class="empty-state">No resume uploaded yet.</div>';
    }
  }).catch(()=>{
    document.getElementById('content').innerHTML = '<div class="empty-state">No resume uploaded yet.</div>';
  });
</script>
</body>
</html>
