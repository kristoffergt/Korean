<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kristoffer Tiedemann — Resume</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --paper:#FAF7F0; --ink:#1C1C1C; --ink-soft:#6B6B63; --line:#E4DFD3; --celadon-4:#4F7563;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#181816; --ink:#EDEAE1; --ink-soft:#9C978A; --line:#33332E; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#3a3a3a;color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
  .page-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .page-header h1{font-size:18px;margin:0;font-weight:700;font-family:'Inter',system-ui,sans-serif;color:#fff;}
  .page-header a{font-size:12.5px;color:#fff;text-decoration:none;}
  .page-header a:hover{text-decoration:underline;}
  .hint{font-size:12.5px;color:var(--ink-soft);}

  /* The resume itself is deliberately its own visual world (serif, black
     ink on paper) rather than inheriting the site's Inter/celadon theme --
     it's a faithful reproduction of a real printed resume layout, not a
     themed app page, so it should look the same regardless of the site's
     own light/dark palette above. */
  .resume{
    background:#fff; color:#111; font-family:'Times New Roman', Georgia, 'Noto Serif', serif;
    font-size:13.5px; line-height:1.35; padding:36px 40px; border:1px solid var(--line); border-radius:10px;
  }
  .r-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .r-name{font-size:19px; font-weight:700; letter-spacing:0.3px; margin:0 0 2px;}
  .r-linkedin{font-size:12px;}
  .r-contact{text-align:right; font-size:12px; line-height:1.5;}
  h2.r-section{
    font-size:12.5px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase;
    border-bottom:1px solid #111; padding-bottom:1px; margin:16px 0 6px;
  }
  h2.r-section:first-of-type{margin-top:8px;}
  .r-entry{margin-bottom:8px;}
  .r-entry:last-child{margin-bottom:0;}
  /* The date/location column is a genuinely fixed width -- 175px --
     everywhere it appears (title row, subtitle row, floated bullet date,
     AND the margin reserved from the bullet list), instead of each one
     separately guessing at how much space to leave based on that one
     row's own content. A guessed margin can always be wrong for some
     date string; a shared fixed width is a hard boundary text can never
     cross, no matter what the left or right side's content is. */
  .r-row{display:table; width:100%; table-layout:fixed;}
  .r-row .r-left{display:table-cell; font-weight:700; text-align:left; vertical-align:top; padding-right:14px;}
  .r-row .r-right{display:table-cell; width:175px; text-align:right; vertical-align:top;}
  /* The float sits inside the <ul>, which already reserves 175px via its
     own margin-right (so every OTHER line, not just this one, keeps clear
     of the date column) -- without the matching negative margin here, the
     float's own 175px width gets reserved a second time inside that
     already-narrowed box, landing it 175px too far left instead of flush
     with the row/sub date above it. This shifts it back into the exact
     zone the list already reserved for it. */
  .r-date-float{float:right; width:175px; margin-right:-175px; font-style:italic; text-align:right;}
  .r-sub{display:table; width:100%; font-style:italic; table-layout:fixed;}
  .r-sub > span:first-child{display:table-cell; text-align:left; vertical-align:top; padding-right:14px;}
  .r-sub .r-right{display:table-cell; width:175px; text-align:right; vertical-align:top;}
  /* Bullets aren't part of the r-row/r-sub table, so without this they'd
     span the full card width -- reserving the exact same 175px keeps
     wrapped bullet lines out of the date column too. */
  .r-entry ul{margin:2px 175px 0 0; padding-left:16px;}
  .r-entry li{margin:1px 0;}
  .r-info-row{display:flex; gap:6px;}
  .r-info-row + .r-info-row{margin-top:1px;}
  .r-info-label{font-weight:700; flex:0 0 auto; min-width:78px;}

  @media (max-width:640px){
    .resume{padding:22px 18px; font-size:12.5px;}
    .r-header{flex-direction:column; gap:6px;}
    .r-contact{text-align:left;}
    .r-row, .r-sub, .r-row .r-left, .r-row .r-right, .r-sub > span:first-child, .r-sub .r-right{display:block;}
    .r-row .r-right, .r-sub .r-right{text-align:left; white-space:normal; padding-left:0;}
    /* float:none + display:block here would make the date its own line at
       the very start of the <li> -- since it's the li's first child, that
       pushes the bullet marker to sit next to the DATE instead of the
       actual bullet text below it. Keeping it inline (with the li's real
       text right after) means the bullet marker stays where it belongs,
       at the start of the whole line. */
    .r-date-float{float:none; display:inline; font-style:italic; margin:0;}
    .r-date-float::before{content:"(";}
    .r-date-float::after{content:") ";}
    .r-entry ul{margin-right:0;}
  }
  @media print{
    body{background:#fff;}
    .page-header, .hint{display:none;}
    .wrap{max-width:none; padding:0;}
    .resume{border:none; border-radius:0; padding:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <h1>Resume</h1>
    <a href="https://kbqwitmxpmkueryjsyip.supabase.co/storage/v1/object/public/resume/3db6e424-96b0-492b-a197-e191037ac3d3/resume.pdf" target="_blank" rel="noopener" download="Resume - Kristoffer Grillo Tiedemann.pdf">Download PDF ↗</a>
  </div>

  <div class="resume" id="resumeRoot">
    <p class="hint">Loading…</p>
  </div>
</div>
<script>
// Renders from the resume_content table (see sql migrations/resume_content_sync_migration.sql)
// instead of hardcoded HTML, so re-syncing the page from an updated resume
// doesn't require hand-editing this file -- see the "Sync resume from PDF"
// section in account settings, which writes to that same table.
const SUPABASE_URL = 'https://kbqwitmxpmkueryjsyip.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImticXdpdG14cG1rdWVyeWpzeWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzIxNjUsImV4cCI6MjEwMTE0ODE2NX0.hOuxXxjfPemuSpthbMAD7tz30oxBkI3CyyZ8fwgwZTc';

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// entry.role (e.g. "Store Operations") is optional and always rendered in
// italics after an en dash, matching entries like "365 Discount – Store
// Operations" -- kept as a separate plain-text field rather than expecting
// title to carry hand-authored <em> markup, since title comes from an
// AI-driven paste-in and every other field is plain text + escaped.
function renderEntry(entry){
  const bullets = entry.bullets || [];
  const hasSubtitle = entry.subtitle != null && String(entry.subtitle).trim() !== '';
  const hasRole = entry.role != null && String(entry.role).trim() !== '';
  const titleHtml = escapeHtml(entry.title) + (hasRole ? ` – <em>${escapeHtml(entry.role)}</em>` : '');
  const rowHtml = `<div class="r-row"><span class="r-left">${titleHtml}</span><span class="r-right">${escapeHtml(entry.location)}</span></div>`;
  let subHtml = '';
  let bulletsHtml = '';
  if(hasSubtitle){
    subHtml = `<div class="r-sub"><span>${escapeHtml(entry.subtitle)}</span><span class="r-right">${escapeHtml(entry.date)}</span></div>`;
    bulletsHtml = bullets.length ? `<ul>${bullets.map(b=>`<li>${escapeHtml(b)}</li>`).join('')}</ul>` : '';
  } else if(bullets.length){
    const [first, ...rest] = bullets;
    bulletsHtml = `<ul><li><span class="r-date-float">${escapeHtml(entry.date)}</span>${escapeHtml(first)}</li>${rest.map(b=>`<li>${escapeHtml(b)}</li>`).join('')}</ul>`;
  } else if(entry.date){
    // No subtitle and no bullets to float the date into -- fall back to a
    // plain right-aligned line rather than silently dropping the date.
    bulletsHtml = `<div style="text-align:right;font-style:italic;">${escapeHtml(entry.date)}</div>`;
  }
  return `<div class="r-entry">${rowHtml}${subHtml}${bulletsHtml}</div>`;
}
function renderInfoSection(section){
  return (section.info || []).map(i=>
    `<div class="r-info-row"><span class="r-info-label">${escapeHtml(i.label)}:</span><span>${escapeHtml(i.value)}</span></div>`
  ).join('');
}
function renderHeader(h){
  h = h || {};
  return `<div class="r-header">
      <div>
        <p class="r-name">${escapeHtml(h.name)}</p>
        <div class="r-linkedin">${escapeHtml(h.linkedin)}</div>
      </div>
      <div class="r-contact">
        <div>${escapeHtml(h.location)}</div>
        <div>${escapeHtml(h.phone)}</div>
        <div>${escapeHtml(h.email)}</div>
      </div>
    </div>`;
}
function renderResume(data){
  let html = renderHeader(data.header);
  (data.sections || []).forEach(sec=>{
    html += `<h2 class="r-section">${escapeHtml(sec.title)}</h2>`;
    html += sec.info ? renderInfoSection(sec) : (sec.entries || []).map(renderEntry).join('');
  });
  document.getElementById('resumeRoot').innerHTML = html;
}
fetch(`${SUPABASE_URL}/rest/v1/resume_content?id=eq.main&select=content`, {
  headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
})
  .then(r=>r.json())
  .then(rows=>{
    if(rows && rows[0] && rows[0].content){
      renderResume(rows[0].content);
    } else {
      document.getElementById('resumeRoot').innerHTML = '<p class="hint">Could not load resume content.</p>';
    }
  })
  .catch(()=>{
    document.getElementById('resumeRoot').innerHTML = '<p class="hint">Could not load resume content.</p>';
  });
</script>
</body>
</html>
